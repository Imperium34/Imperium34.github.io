          Salahiyet bozulursa kâinattaki bütün dişiler bozulur. Gördüğü
          canlı cansız her şeyi dişiye çevirebilir.
      - varlik: "Kadim Şeytaniçe"
        not: "tazim ismi — 'Kadir-i Mutlak'ın Nisvani Bedeni'"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Femininity"
    not: >-
      Tazim isminde zaten 'Nisvani' biçiminde kullanılan karşılıktır.
      男性 (Rical) ile çift oluşturur ve Türkçede de çift olarak
      seçilmiştir: ikisi de Arapça çoğul insan adıdır, aynı vezinde
      durur (Kural 11 onarımı — kaynak da ikisini 男性/女性 olarak
      simetrik verir).

  - cince: 瘟疫
