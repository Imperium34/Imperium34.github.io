        not: "风 ile kesişir"
      - yol: "Denizci Yolu"
        mertebe: 2
        not: "天灾 → Felaket; Mertebe adında. 风暴化身 ve 天灾降临 (雷灾, 雪难, 海啸) bu salahiyetten türer"
      - varlik: "Tiran"
        not: "tazim ismi — 天灾君主 → 'Felaketlerin Efendisi'"
    dogrulama: yazar_qa
    not: >-
      Hem Mertebe adında hem tazim isminde zaten kullanılan karşılıktır.
      天 (semavi) unsuru Türkçeye taşınmamıştır; gerekçe Mertebe
