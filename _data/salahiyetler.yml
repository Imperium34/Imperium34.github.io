    turkce: Nizamın Gölgesi
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avukat Yolu"
        mertebe: 0
        not: "Cebbar salahiyeti bu simgeye bağlıdır"
      - varlik: "Nizamın İnhilali"
        not: "tazim ismi — 秩序阴影"
    dogrulama: yazar_qa
    not: >-
      Tazim isminde zaten kullanılan karşılıktır; satır metni için o
      girdiye bakınız.

  - cince: 月亮
    pinyin: yuèliàng
    turkce: Ay
    tur: simge
    durum: tamam
    sistem_kural: [10, 13]
    gecisler:
      - yol: "Aktar Yolu"
        mertebe: 0
        not: >-
          月亮 → Ay; Mertebe 0 adı. Kanon bunun bir salahiyetten çok
          simgeye yakın olduğunu açıkça söyler: Ay nasıl dünyanın
          yoldaşıysa, Ana da hayatın ilk yoldaşıdır. Tevellüt ve
          tenasül imgelerini içerir; Ruhaniyet, bitki, güzellik, celp,
          hayvan, insan, aşkın mahlukat ile Hayat, Karanlık ve
          Garabet'in birer kısmını temsil eder.
      - yol: "Aktar Yolu"
        mertebe: 1
        not: "Güzellik Tanrıçası makul sınırlar içinde Ay'ın kuvvetini ödünç alabilir, ayın rengini değiştirebilir"
      - varlik: "Toprak Ana"
        not: "Dünya Savaşı sonrası tazim ismi — 'Tenasül ve Kızıl Ayın Timsali'"
    dogrulama: yazar_qa
    not: >-
      Ay simgesinin beş ciheti (salahiyet değil, simgenin yüzleri):
      血月 Kan Ayı — dişil kuvvet azar, Âlem-i Ervah ile hakikat uzun
      süre iç içe geçer; 红月 Kızıl Ay — dişil kuvvet, ruhaniyet ve
      karanlık ile garabet büyüleri güçlenir; 银月 Gümüş Ay — Kızıl Ay
      ile bağı keser, ona dayalı bütün kabiliyetler işlemez olur; 满月
      Dolunay — hayat serpilir, ruhaniyet canlanır, gönüller yatışır;
      缺月 Eksik Ay — karanlık koyulaşır, garabet yayılır. 'Eksik' 缺
      karakterinin düz karşılığıdır; İngilizcedeki 'waning' bir
      yorumdur.

  - cince: 变化
    pinyin: biànhuà
    turkce: Değişim
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        not: "诡异 ile karışarak 重组 salahiyetini doğurur; 变形 de bu simgeye aittir. Kanon 变化 ile 诡异 arasında içsel bağ kurar: biri kavranabilir değişim, öbürü hakkında hüküm verilemeyen değişim"
      - yol: "Hafi Talibi Yolu"
        not: "异变 (Mesh) her şeyin 变化'sini bir dereceye kadar etkiler; kanon bunu Soytarı ile kesişen bir salahiyet sayar"
    dogrulama: yazar_qa
    not: >-
      异变 (Mesh) ile karıştırılmamalı: kesişirler fakat ayrı
      terimlerdir. Bu ayrımın korunması 异类/异变 çiftinde 'Başkalaşım'
      gibi karşılıkların reddedilme sebebidir (bkz. Mesh satırı).

  - cince: 时空之王
    pinyin: shíkōng zhī wáng
    turkce: Zaman ve Mekan Sultanı
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        not: "诡异 ile karışarak 历史 salahiyetini doğurur; 诡秘之境 de bu iki simgeden gelir"
      - varlik: "Esrarın Hükümdarı"
        not: "tazim ismi — 'Zaman ve Mekan Sultanı'"
    dogrulama: yazar_qa
    not: "Tazim isminde zaten kullanılan karşılıktır."

  - cince: 命运道标
    pinyin: mìngyùn dàobiāo
    turkce: Kaderin Mihenk Taşı
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        not: "命运锚点 (Kader Çıpası) bu simgeye ait salahiyettir; Mucizekâr'ın 命运卡壳'ı da buradan türer"
      - varlik: "Esrarın Hükümdarı"
        not: "tazim ismi — 'Kaderin Mihenk Taşı'"
    dogrulama: yazar_qa
    not: >-
      Tazim isminde zaten kullanılan karşılıktır; 道标'nun yön gösterme
      yerine ölçüt olma cihetine kaydırılmasının gerekçesi o girdidedir.

  - cince: 诡异
    pinyin: guǐyì
    turkce: Garabet
    tur: simge
    durum: tamam
    sistem_kural: [8, 10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        not: >-
          不可思议 (kavranamaz) diye de anılır; kavranamazlık 'anlaşılamaz'
          kavramını da içerdiği için kendiliğinden bir miktar Sırrakadem
          barındırır. Soytarı sembolündeki gizlilik unsuru buradan gelir.
          奇迹, 历史 ve 诡秘之境 bu simgeden türer.
      - yol: "Kâhin Yolu"
        mertebe: 4
        not: "诡法师 → Garabet Efsuncusu; Mertebe adında. 秘 ile birleşince 诡秘 olur (bkz. Sır Kuklabazı notu)"
      - yol: "Aktar Yolu"
        mertebe: 0
        pay: kismi
        tur_burada: salahiyet
        not: "Ay'ın puslu ve esrarlı hâli kendi bedelini koyma, dehşetli lanet ve ay ışığına dönüşme gibi garip kabiliyetler doğurur"
    dogrulama: yazar_qa
    not: >-
      Kanon 变化 ile 诡异 arasında içsel bir bağ kurar: biri kavranabilir
      değişim, öbürü söylenemeyen ve hakkında hüküm verilemeyen değişim.

  - cince: 盲目痴愚
    pinyin: mángmù chīyú
    turkce: Kör Ahmaklık
    tur: simge
    durum: tamam
    sistem_kural: [10, 11]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        not: "zihin alanındaki simge; 愚弄 salahiyetine karşılık gelir. En basit tatbiki hasmın zekâsını zorla düşürmektir, Mertebe 0 gerçek ilahları dahi etkiler"
    dogrulama: yazar_qa
    not: >-
      KABUL EDİLEN KAYIP: 盲目痴愚, Azathoth'un Çince unvanıyla (盲目痴愚之神)
      aynı ibaredir. Bu örtüşme karakterlerin bilgisine girmez ve
      salahiyetlerin işleyişini etkilemez; Kural 11 gereği onarılmaz
      (bkz. Soytarı Efendi).



  - cince: 战争之主
    pinyin: zhànzhēng zhī zhǔ
    turkce: Harbin Hükümdarı
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 0
        not: >-
          Harp salahiyetinin simgesel uzantısı; bir gezegenin herhangi bir
          yerindeki takım üyelerine kendi konumunu ve Yegânelik kudretini
          paylaştırabilir. Aynı anda yalnız bir üye Yegâneliği kullanabilir
          ve zemini yetmediği için tam kudretini açığa çıkaramaz.
    dogrulama: yazar_qa
    not: "Harp Ruhbanı notunda zaten kullanılan karşılıktır."

  - cince: 无暗
    pinyin: wú'àn
    turkce: Karanlıksız
    tur: simge
    durum: tamam
    sistem_kural: [10, 11]
    gecisler:
      - yol: "Ozan Yolu"
        mertebe: 4
        not: "无暗者 → Karanlıksız; Mertebe adında. 无暗之域 ve 无暗之枪 kabiliyetleri aynı kelimeyi taşır"
      - yol: "Ozan Yolu"
        not: >-
          无暗象征 — yazarın soru-cevabında simge olarak anılır: Kadir-i
          Mutlak gibi Yüce Kadimlerin ruhani damgasını bastırabilir, iki
          taraf birbirini karşılıklı men eder
    dogrulama: yazar_qa
    ingilizce_tuzak: "Unshadowed — 阴影 ile karıştırılır"
    not: >-
      Kelime 暗'dır, 阴影 değil. Önceki karşılık 'Gölgesiz' Türkçede bu
      simgeyi Asılmış Adam'ın Gölge salahiyetine karşıt gibi okutuyordu;
      oysa kaynak Karanlık'a karşıttır. Mertebe 4'ün kabiliyet tarifi de
      ikisini ayrı sayar: 对影子、污秽、堕落、黑暗方面的非凡能力 —
      gölge, necaset, tereddi ve karanlık dört ayrı kalem olarak geçer.
      Mertebe adı, kabiliyetler ve simge Çincede tek kelimedir; Türkçede
      de tek kelime taşır (Kural 11 onarımı).

  - cince: 不灭之光
    pinyin: bùmiè zhī guāng
    turkce: Sönmez Işık
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Ozan Yolu"
        mertebe: 0
        not: >-
          bu simge yüzünden Yolun hakiki ilahını tamamen yok etmek çok
          güçtür; yok edilse dahi bunun üzerinden dirilme ihtimali kalır.
          Aynı sebeple Alîm ü Kadîr de Güneş Yolu üzerinden daha kolay
          geri döner.
      - varlik: "Ebedi Yanan Güneş"
        not: "tazim ismi — 'Sönmez Işık'"
    dogrulama: yazar_qa
    not: "Tazim isminde zaten kullanılan karşılıktır; Kural 10 gereği satır onunla aynı kelimeyi taşır."

  - cince: 造物
    pinyin: zàowù
    turkce: Bârî
    tur: simge
    durum: tamam
    sistem_kural: [7, 10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 0
        not: "Beyaz Kule'nin kısmi 创造 salahiyeti bu simgeden ve 全知全能 simgesinden doğar"
      - yol: "Denizci Yolu"
        mertebe: 0
        not: "Tiran'ın 雷霆, 物质 ve (全能 ile kesişerek) 水 salahiyetleri bu simgeden türer"
      - varlik: "Kadir-i Mutlak"
        not: "tazim ismi — 造物主 → 'Bârî'"
      - varlik: "Aslî Yaradan"
        not: "最初造物主 — aynı terim; kanon Kadir-i Mutlak'ın Bârî unvanının Aslî Yaradan'ınkiyle aynı olduğunu açıkça söyler ve bunun, onun hususiyetlerinin bir kısmını kullanabilmesi anlamına geldiğini belirtir"
    dogrulama: yazar_qa
    not: >-
      Aslî Yaradan'ın adı ise bilinçli olarak bu ekonominin dışındadır:
      bütün yol gruplarının menşei olduğu için hiçbir grubun ayrılmış
      kelimesiyle adlandırılamaz (bkz. o girdi).

  - cince: 星界阶梯
    pinyin: xīngjiè jiētī
    turkce: Âlem-i Misal Süllemi
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Âlem-i Misal'de toplanan kavramlara bir dereceye kadar tesir
          eder; bilginin kat kat kâinatın en esaslı simgelerine ve en
          menşedeki tehlikelere açılmasını simgeler
    dogrulama: yazar_qa
    not: >-
      'Süllem' klasik kayıtta merdiven demektir ve Osmanlı ilim
      geleneğinde eser adı olarak kullanılır (Süllem-ül Ulûm); bilgi
      Yoluna ait bir merdiven simgesi için bu yankı kazançtır.
      'Mirac' reddedildi: muayyen bir hadiseye bağlıdır ve simgenin
      taşıyamayacağı bir yük getirir.
      Kaynak bunu açıkça 权柄 olarak verir; 象征 değildir. Âlem-i Misal
      Müdebbiri ile birlikte Beyaz Kule'nin iki Âlem-i Misal
      salahiyetinden biridir.

  - cince: 承罪
    pinyin: chéngzuì
    turkce: Günah Taşıma
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Hafi Talibi Yolu"
        mertebe: 0
        pay: kismi
        not: "salahiyet değil; 牺牲 ile birlikte 概念与部分象征 olarak sayılır. Tezahürü 替罪'dır"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Sin-Bearing"

  - cince: 牺牲
    pinyin: xīshēng
    turkce: Feda
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Hafi Talibi Yolu"
        mertebe: 0
        pay: kismi
        not: "salahiyet değil; 承罪 ile birlikte 概念与部分象征. 倒吊人 tezahüründe 牺牲自我换取确凿的希望 — kesin bir umut karşılığında kendini feda etmek"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Sacrifice — 祭祀 ile aynı kelimeye düşer"
    not: >-
      'Kurban' bırakıldı ve 祭祀'ye verildi. İki terim ayrıdır: 祭祀
      kurban ayinidir ve 祭司 (Rahip), 主祭 (Başrahip) ile aynı aileye
      aittir (bkz. Kural 3, Ahmer Hünkar notu); 牺牲 ise kendini
      vermektir. Asılmış Adam'ın tarifi ikincisidir."

  # ─────────────────────────────────────────────────────────────
  # KABİLİYETLER (具体表现) — yalnızca salahiyet/simge tezahürü olanlar
  # ─────────────────────────────────────────────────────────────

  - cince: 衰老
    pinyin: shuāilǎo
    turkce: Köhnetme
    tur: kabiliyet
    durum: tamam
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 1
        tezahuru: [窃取]
        not: >-
          hedefin ömründen büyük miktar eksiltip onu köhne bir hâle
          sokar. Çalınan yalnızca hayatta kalma süresidir; hedefi
          büyütmez, yalnız yaşayacağı yılları azaltır. Hızlanmış
          yaşlanma bu sirkatin simgesel tezahürüdür.
    dogrulama: yazar_qa
    not: >-
      'Ömür hırsızlığı' reddedildi: üç kelimedir, mekanizmayı adlandırır
      ve Sirkat'i tekrarlar. 'Köhnetme' neticeyi adlandırır ve büyüme
      ima etmez — kanonun bilhassa vurguladığı ayrım budur.

  - cince: 伪装
    pinyin: wěizhuāng
    turkce: Tebdil
    tur: kabiliyet
    durum: tamam
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 4
        tezahuru: [窃取]
        not: "kısmen iade edilir: başka bir gerçek ilahın mümini gibi tebdil olup savunmaları aşar ve ilahın alanına ait tılsımlar yapar; karşılık gelen ilahın idraki ne kadar yüksekse muvaffakiyet ihtimali o kadar düşer"
      - yol: "Kapkaççı Yolu"
        mertebe: 3
        not: "tamamen iade edilir: muharebede efsun veya önceden tertip ile ilahın lütfunu yahut kabiliyetini çalar; ilahın idraki ne kadar düşükse muvaffakiyet ihtimali o kadar yüksektir"
    dogrulama: yazar_qa
    not: >-
      'Tebdil-i kıyafet' kalıbından; 盗天机 (Sirkat-i Esrar) bu tebdilin
      mümkün kıldığı hususi sirkattir.
      YOL NÜSHASI: Bu sözlük Kapkaççı Yolu'nun Amon nüshasını esas alır;
      Semavi Muazzez'in nüshası devam serisinde görünür ve kapsam
      dışıdır. Yazar gönderisi kabiliyeti Mertebe 5'e koyar, fakat
      Amon'un nüshası onu Mertebe 5'te siler, Mertebe 4'te kısmen,
      Mertebe 3'te tamamen iade eder.

  - cince: 盗天机
    pinyin: dào tiānjī
    turkce: Sirkat-i Esrar
    tur: kabiliyet
    durum: tamam
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 4
        tezahuru: [窃取]
        not: "伪装 (Tebdil) ile yapılır: ilahın mümini gibi görünüp duaya gelen karşılığı çalmak; Amon nüshasında bu Mertebede kısmen iade edilir"
      - yol: "Kapkaççı Yolu"
        mertebe: 3
        not: "tamamen iade edilir"
    dogrulama: yazar_qa
    not: >-
      天机 'göğün sırrı'dır; 'Esrar' Kural 8 gereği zaten bu yol grubunun
      kelimesidir ve terkip o registerde durur.
      YOL NÜSHASI: Amon nüshası esas alınır (bkz. 伪装 satırı); Semavi Muazzez'in nüshasında kabiliyet Mertebe 5'te bulunur.

  - cince: 熵
    pinyin: shāng
    turkce: İnhilal
    tur: kabiliyet
    durum: tamam
    sistem_kural: [5]
    gecisler:
      - yol: "Avukat Yolu"
        mertebe: 2
        tezahuru: [混乱]
        not: >-
          熵之公爵 → İnhilal Dükü; Mertebe adında. Onunla ne kadar uzun
          dövüşülürse kendi kabiliyetleri, düşünceleri ve hâli o kadar
          rastgeleleşir, fitneye düşer ve zapt edilemez olur; nihayetinde
          bir çamura dönüp tuhaf bir sönümlenme hâline girer. Hedefi
          düşman olabileceği gibi çevre yahut kaideler de olabilir.
      - yol_grubu: "Nizamın İnhilali"
        not: "yol grubunun adı bu kelimeden gelir"
    dogrulama: yazar_qa
    not: >-
      Kanon bunu 混乱 (Fitne) salahiyetinden türeyen bir 能力 (kabiliyet)
      sayar, müstakil bir salahiyet değil.
      'İnhilal' tercihinin tam gerekçesi İnhilal Dükü girdisindedir;
      failsiz, kendiliğinden çözülmeyi bildirir ve terfi ayininin
      'dış müdahale olmaksızın içten çöküş' şartını karşılar.

  - cince: 解离
    pinyin: jiělí
    turkce: Ayrıştırma
    tur: kabiliyet
    durum: tamam
    gecisler:
      - yol: "Bilgin Yolu"
        mertebe: 3
        tezahuru: [解析, 规律]
        not: >-
          奥秘学者 → Gizem Alimi; bir ışın salıp çoğu nesnenin yapısını
          bozar, hedef tamamen ayrışıp kırıntılar hâlinde yere dökülür,
          rengi bile buharlaşır gibi hızla kaybolur. Kanon bunu Tahlil ile
          Mizan salahiyetlerinin ortak uzantısı sayar.
    dogrulama: yazar_qa
    not: >-
      Bilgin Yolu'nun alt Mertebeleri bilinçli olarak modern-bilimsel
      kayıttadır (Arkeolog, Zanaatkâr, Gökbilimci, Kimyager); 'Ayrıştırma'
      kimyada bileşimin çözülmesidir ve bu kayda oturur.
      'Tecziye' reddedildi: modern Türkçede 'cezalandırma' olarak
      okunur. 'Tefekkük' değerlendirildi; anlamca isabetli fakat Yolun
      kaydı için fazla arkaik. 熵 (İnhilal) ile karıştırılmamalı: o bir
      düzenin failsiz, içten çözülmesidir; bu ise bir yapının
      dışarıdan ayrıştırılmasıdır.

  - cince: 创造之力
    pinyin: chuàngzào zhī lì
    turkce: Hilkat Kuvveti
    tur: kabiliyet
    durum: tamam
    sistem_kural: [9, 11]
    gecisler:
      - yol: "Aktar Yolu"
        mertebe: 2
        tezahuru: [生命]
        not: >-
          创生者 → Hayat Bahşedici; Hayat salahiyetinin bir kısmından
          türer. Bedeni en üst kıvamına varır; çevresindeki hayat
          serpilmenin ve yeni doğumun sevincini duyar, bitki, hayvan,
          insan ve öbür aşkın ırkların ömrü uzar yahut kısalır. Hayatta
          değişim ve kısa süreli patlama doğurur — kulluk gerektirmeyen,
          geniş ölçekli bir Kan Kulu dönüşümü. Ölmemiş olan her şeyi
          ilaçsız iyi eder, Beklend büyüklüğünde bir toprağa yeni hayat
          verir, necaseti ve aşındırmayı temizler.
    dogrulama: yazar_qa
    not: >-
      创造 karakterleri Okur Yolu'nun 创造 (Hâlık) salahiyetiyle
      ortaktır ve bu ortaklık yazarın kendi kelime tercihidir;
      'Hilkat' ile 'Hâlık' aynı kökün iki biçimidir (yaratılış /
      Yaradan). Kanon ise türeyişi ayrı kurar: bu kuvvet 创造
      salahiyetinden değil, 生命 (Hayat) salahiyetinden doğar. Kelime
      yazarın kelimesini, not türeyişi taşır.
      'Kudret' kullanılmadı: 力量'ın (Savaşçı Yolu) karşılığıdır.
      'Tekvin' ve 'İhya' değerlendirildi.
      Yan anlam: 'hilkat garibesi' deyimi, bu kuvvetin doğurduğu
      başkalaşmış mahlukatla (ağızlı otlar, kuş başlı böcekler, inleyen
      tahıllar) örtüşür.

  - cince: 占卜
    pinyin: zhānbǔ
    turkce: Kehanet
    tur: kabiliyet
    durum: tamam
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 9
        not: "占卜家 → Kâhin; Mertebe adında. Astroloji, ruhani rakamlar, sarkaç, kristal küre gibi her türlü kehanet usulüne ustalıkla vâkıf olur"
      - yol: "Canavar Yolu"
        mertebe: 8
        not: "机器 → Otomaton; kehanet ve kehanet karşıtı kabiliyet kazanır"
      - yol: "Çırak Yolu"
        mertebe: 7
        not: "占星人 → Müneccim; kristal küreyle kehanet"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Divination — 预言 (Tenebbü) ile karıştırılır"
    not: >-
      ÜÇ KATMAN: 'fal' sokak düzeyindeki falcılıktır (fal baktırmak);
      'kehanet' 占卜, yani Âlem-i Ervah'a bir vasıta üzerinden sorulan
      Aşkın kehanetidir; 'tenebbü' 预言, yani Kader Nehri'nden istikbalin
      okunması yahut bildirilmesidir. Kanon ikisini her yerde ayrı
      sayar: Sırbozma 'kehanet de tenebbü de değildir', kâğıt bedeller
      ve Cıva Beden 'kehanet ve tenebbü karşıtı'dır.
      'Kehanet' Kâhin'in kendi adıyla aynı kökü taşır.

  - cince: 预言
    pinyin: yùyán
    turkce: Tenebbü
    tur: kabiliyet
    durum: tamam
    gecisler:
      - yol: "Gizem Avcısı Yolu"
        mertebe: 3
        not: "预言大师 → Durugören; kaderin sırlarına ittıla eder, bir tercihin neticesini yahut en iyi tercihi tenebbü edebilir"
      - yol: "Canavar Yolu"
        mertebe: 2
        not: "预言术 — belli kişi ve hadiselerin hüsn-ü talih yahut kemtalih sebebiyle farklı neticelere varacağını tenebbü eder; tenebbüleri büyük ihtimalle gerçekleşir"
      - yol: "Canavar Yolu"
        mertebe: 0
        not: "大预言术 — Kader Nehri'nin kısa süreli kollarını etkileyerek kendi tenebbüsünü tam olarak gerçekleştirir; kanon Kader Çarkı'nın en kuvvetli tenebbü kabiliyetine sahip olduğunu söyler"
      - yol: "Canavar Yolu"
        mertebe: 4
        not: "水银之躯 → Cıva Beden; edilgen kehanet ve tenebbü karşıtı hassa"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Prophecy — 占卜 (Kehanet) ile karıştırılır"
    not: >-
      تنبؤ, istikbali önceden haber vermektir; üç katmanlı kehanet
      ailesinin en üst basamağıdır (bkz. 占卜 satırı). 预知 (İstişraf)
      salahiyetinden ayrıdır: İstişraf istikbale vâkıf olmaktır,
      Tenebbü onu söylemek ve kurmaktır.
      Mertebe 3'ün adı (Durugören) bu kelimeyi taşımaz; ad Mertebenin
      görme hâlini karşılar.

  - cince: 替罪
    pinyin: tìzuì
    turkce: Günah Keçisi
    tur: kabiliyet
    durum: tamam
    gecisler:
      - yol: "Hafi Talibi Yolu"
        mertebe: 0
        tezahuru: [承罪]
        not: "hedefin yerine hasarı ve ölümü üstlenmek; düşmanın asıl saldırı hedefini kendine çevirmek"
    dogrulama: yazar_qa
    not: >-
      替罪羊 Çincede 'günah keçisi' deyiminin kendisidir ve kabiliyetin adı
      onun ilk iki karakteridir; deyime gönderme muhtemeldir fakat kanonda
      teyit edilmemiştir.
      Türkçede 'günah keçisi' ile Yolun Çoban/Otlatma hattı arasında bir
      yankı doğar. Bu yankı Türkçenin kendi malzemesinden gelir: 替罪 ile
      牧羊人 Çincede hiçbir karakter paylaşmaz. Kaynağa dair bir iddia
      taşımaz (krş. Düşmüş Melek ↔ Hâviye).
