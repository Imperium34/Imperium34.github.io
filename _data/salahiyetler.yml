      - yol: "Suikastçı Yolu"
        mertebe: 1
        not: "Ayine Âlemi'nin kuvvetini doğrudan kullanır; hakikat ile aksi hızla yer değiştirebilir"
      - yol: "Suikastçı Yolu"
        mertebe: 3
        not: "不老魔女 → Solmaz; Ayine Bedeni ile birleşir, Ayine İzdüşümü ve Uyuyan Ayine ile dirilir"
    dogrulama: yazar_qa
    not: >-
      'Ayine' klasik kayıtta aynadır; Yolun bütün mimarisi ayna üzerine
      kurulu olduğu için düz 'Ayna' yerine tercih edilmiştir (krş.
      Hâviye / Uçurum). Türetilenler aynı kökü taşır: 镜替身 Ayine
      Bedeli, 镜投影 Ayine İzdüşümü.

  - cince: 女性
    pinyin: nǚxìng
