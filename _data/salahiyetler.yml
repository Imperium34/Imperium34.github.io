# Salahiyet Fihristi
#
# Anahtar: Çince terim. Her terim tek satırdır ve tek bir Türkçe karşılık taşır.
# Bir Türkçe kelimenin iki satırda görünmesi Kural 10 ihlalidir; grep ile aranabilir.
#
# ALANLAR
#   cince            Kaynak terim. Fihristin anahtarı.
#   pinyin           Okunuş.
#   turkce           Tek karşılık. null ise henüz karara bağlanmamıştır.
#   tur              salahiyet (权柄) | alt_salahiyet (下位权柄) |
#                    simge (象征/概念) | kabiliyet (具体表现) |
#                    ilahi_hukumranlik (神国) | mertebe_adi | belirsiz
#                    mertebe_adi: yalnız Mertebe adında geçen, salahiyet
#                    olmadığı teyit edilmiş terim; yeniden salahiyet diye
#                    kaydedilmesin diye tutulur.
#                    Kural 10 hem salahiyet hem simge adlarını bağlar.
#   durum            tamam | acik   (acik: karar geçici, sınanmayı bekliyor)
#   sistem_kural     İlgili Sistem Kuralı numaraları.
#   gecisler         Terimin görüldüğü yerler. Her biri:
#       yol              Yol adı.
#       yol_grubu        Yol grubu (yalnız grup düzeyinde bir görünüm varsa).
#       varlik           Varlık adı (tazim ismi gibi entite düzeyi görünümler).
#       mertebe          Mertebe numarası.
#       pay              tam | kismi        (Çincedeki 部分 işareti)
#       ust_salahiyet    alt_salahiyet ise, o Yolda neyin altında (下位权柄)
#       tezahuru         kabiliyet ise, hangi salahiyet/simgenin 具体表现'i
#       tur_burada       Bu geçişte satırın türü farklıysa
#       not              Kanonik tarif.
#   dogrulama        yazar_qa | metin | wiki | yok
#                    yazar_qa ve metin dışındaki hiçbir satır Kural 10 kararına
#                    tek başına dayanak yapılmaz.
#
# GEÇİŞ SINAMASI
#   Yalnızca tasarruf beyanı geçiş doğurur: 掌握X权柄 / 拥有X权柄 /
#   部分"X"权柄. Kavramın anılması geçiş değildir — 失控的除外 (bir
#   istisna kaydı) veya 失控倾向变强 (kabiliyetin bedeli) gibi ifadeler
#   terimi o Yola bağlamaz. Aksi hâlde 失控, 堕落, 诅咒 ve 心灵 gibi
#   terimler her Yolda görünür ve satır hiçbir şey söylemez olur.
#   ingilizce_tuzak  İngilizcenin bu terimi başka terimlerle aynı kelimeye
#                    düşürdüğü durumlar.
#   not              Karara dair açıklama, reddedilen karşılıklar, bilinen riskler.

salahiyetler:

  # ─────────────────────────────────────────────────────────────
  # ASLİ SALAHİYETLER
  # ─────────────────────────────────────────────────────────────

  - cince: 堕落
    pinyin: duòluò
    turkce: Tereddi
    tur: salahiyet
    durum: tamam
    sistem_kural: [5, 10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        pay: kismi
        not: "深渊 — içine düşen herkesi zorunlu olarak alçaltan ortam; tereddiyi yalnızca kışkırtmaz, yaratır"
      - yol: "Suçlu Yolu"
        mertebe: 6
        tur_burada: kabiliyet
        not: "污秽之语 sözcüklerinden biri; alan etkili saldırı, hedefte ve çevresinde hâviyeleşme eğilimi"
      - yol: "Hafi Talibi Yolu"
        mertebe: 0
        pay: kismi
        not: "倒吊人'in beş salahiyetinden biri; 堕落自性 olarak tezahür eder — her zîhayatın mütereddi fıtratının tecessümü"
      - yol: "Hafi Talibi Yolu"
        mertebe: 4
        not: "灵肉之刃 源于堕落领域; 堕落之影 — içteki tereddi iradesi gölgeyle birleşip müstakil bir varlık olur"
      - yol: "Hafi Talibi Yolu"
        mertebe: 2
        not: "秽语'nın 堕落 ve 污秽 salahiyetlerinin tezahürü olduğu kanonda açıkça söylenir"
      - yol: "Hafi Talibi Yolu"
        mertebe: 1
        not: "堕落眷属 — otlatılan ruhlar tereddi salahiyetinin etkisiyle tam itaat eder"
      - varlik: "Yarı Kadir-i Mutlak Âdem"
        not: "tazim ismi — 所有生灵的堕落自性 → 'Cümle Zîhayatın Mütereddi Fıtratı'"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Degeneration / Depravity / Corruption — 腐化 ve 污染 ile aynı kelimeye düşer"
    not: >-
      Sıfat hâli 'mütereddi'. Kök ر-د-ي düşme bildirir ve 堕落'nin düz
      anlamını (düşmek-inmek) karşılar. 'Yozlaşma' reddedildi: yoz
      kabalaşmayı bildirir, düşme imgesi yoktur ve Hâviye'nin Türkçedeki
      düşüş mimarisine katılmaz.
      İki Yolun kanonik bağı doğrudan bu salahiyet üzerinden kurulur:
      Asılmış Adam her zîhayatın düşme eğilimini temsil ederken, Hâviye
      içine düşen herkesi alçalmaya sürükleyen ortamdır.
      堕落伯爵 (Avukat Yolu M4) 'Sakıtlar Kontu' adını taşır: Kural 5'in
      'mütereddi' sıfatından bilinçli bir sapmadır. Mertebe 堕落
      salahiyetini taşımaz, kelime yalnız adındadır; 'sakıt' başka bir
      terimle çakışmaz ve unvan için daha açık bir kelimedir.
  - cince: 污秽
    pinyin: wūhuì
    turkce: Necaset
    tur: salahiyet
    durum: tamam
    sistem_kural: [5, 10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        pay: kismi
        not: "Hâviye'nin bileşeni; bütün mundar şeylerin tecessümü, beden-zihin-ruh üzerinde çok katmanlı etki"
      - yol: "Suçlu Yolu"
        mertebe: 1
        pay: kismi
        not: "污秽君王 → Necaset Hâkimi; Mertebe adında. 衰败君王 (Zeval Hâkimi) ile aynı kurulumdadır: salahiyet + 君王"
      - yol: "Suçlu Yolu"
        mertebe: 6
        tur_burada: kabiliyet
        not: "污秽之语 — Gulyabani'nin büyü ailesi (缓慢, 死, 堕落); Şeytan'da genişler (困惑, 懒惰, 亵渎), Vesvesekâr'a miras kalır"
      - yol: "Hafi Talibi Yolu"
        mertebe: 0
        pay: kismi
        not: >-
          倒吊人'in beş salahiyetinden biri; 污秽化身 olarak tezahür eder —
          kendisi Heyûlâ Deryası tarafından kirletilmiştir ve her şeyi
          kirletir. NOT: bu tarifte kirletme fiili 污染'dır, fakat 污染
          bu Yolun salahiyetleri arasında sayılmaz; fiil olarak geçer.
      - yol: "Hafi Talibi Yolu"
        mertebe: 2
        not: "秽语长老 → Necaset Hatibi; Mertebe adında. Kanon 秽语'yı 堕落 ve 污秽 salahiyetlerinin tezahürü olarak tanımlar"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Filth"
    not: >-
      Necaset ile Tencîs aynı kökten (ن-ج-س) gelir ve Çincedeki 污
      ortaklığını Türkçede görünür kılar. İki Yolda aynı kelimeyi taşıması
      bölünme değil, Kural 10 gereğidir (bkz. Necaset Hatibi notu).

  - cince: 污染
    pinyin: wūrǎn
    turkce: Tencîs
    tur: salahiyet
    durum: tamam
    sistem_kural: [5, 10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        pay: kismi
        not: "堕落 ve 污染'ın dışa doğru uzantısı; arzunun patlaması ve aklın yitiminin zorunlu sonucu"
      - yol: "Suçlu Yolu"
        mertebe: 3
        pay: kismi
        not: "呓语者 → Vesvesekâr; salahiyet bu Mertebede 心灵 ve 精神 alanlarında yoğunlaşır"
      - yol: "Suçlu Yolu"
        mertebe: 1
        pay: kismi
        not: "污秽君王'ın taşıdığı dört salahiyetten biri"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Corruption — 腐化 ve 堕落 ile aynı kelimeye düşer"
    not: >-
      Sefirot'un taşıyıcısına bulaştırdığı kirlenme de bu kelimeyle
      karşılanır. Vesvesekâr'ın salahiyeti 污秽 değil 污染'dır; 污秽之语
      alt Mertebeden miras kalan bir kabiliyettir.

  - cince: 阴影
    pinyin: yīnyǐng
    turkce: Gölge
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Hafi Talibi Yolu"
        mertebe: 0
        pay: kismi
        not: "倒吊人'in beş salahiyetinden biri; 阴影之主 olarak tezahür eder — Gölge Âlemi'nin hükümdarı"
      - yol: "Hafi Talibi Yolu"
        mertebe: 7
        not: "藏入阴影, 召唤阴影, 阴影诅咒, 操纵阴影, 阴影塑形 — Yolun gölge kabiliyetleri bu Mertebede açılır"
      - yol: "Hafi Talibi Yolu"
        mertebe: 5
        not: "掌控阴影 — 操纵阴影'ın ileri hâli"
      - yol: "Hafi Talibi Yolu"
        mertebe: 4
        not: "统御阴影; 堕落之影"
      - yol: "Hafi Talibi Yolu"
        mertebe: 2
        not: "terfi ayini: kendi gölgesini ayırıp yendikten sonra Gölge Âlemi'nde kendine bir 'ülke' kurmak"
      - yol: "Hafi Talibi Yolu"
        mertebe: 1
        not: "阴影统治者 — Gölge Âlemi'ni kullanabilir fakat henüz hükümdarı değildir"
      - varlik: "Hakiki Hâlık"
        not: "tazim ismi — 阴影帷幕后的主宰 → 'Gölge Perdesi Ardından Hükmeden'"
    dogrulama: yazar_qa
    not: >-
      Yolun mitsel biçimi 黑色阴影与蠕动的血肉'dır; gölge ile kan-et Yolun
      iki kurucu unsurudur. Gölge Zâhidi'nin adındaki 'Gölge' Çince addan
      (隐修士) gelmez, İngilizceden gelir; Yolun kendi salahiyeti olduğu
      için korunmuştur (bkz. Gölge Zâhidi notu).

  - cince: 黑暗
    pinyin: hēi'àn
    turkce: Karanlık
    tur: salahiyet
    durum: tamam
    sistem_kural: [9, 10, 13]
    gecisler:
      - yol: "Uykusuz Yolu"
        mertebe: 0
        pay: tam
        not: >-
          黑暗 → Karanlık; Mertebe 0 adı. Hedefi rüyaya sokabilir, sükûnet
          yahut ebedi uykuyu getirebilir, hedefi karanlıkta eritip onun
          bir parçası hâline getirebilir. Karanlık kâinatın en temel
          simgelerinden biri olduğu için bu salahiyeti taşıyan gerçek
          ilah karanlıkta ölmez ve onun yardımıyla dirilir.
      - yol: "Uykusuz Yolu"
        mertebe: 1
        not: "黑暗仆人 — gecede neredeyse gerçekten öldürülemez, her ölümünde karanlıktan döner; 黑暗之剑 ebedi uykuyu, yeisi ve helâki getirir"
      - yol: "Uykusuz Yolu"
        mertebe: 4
        not: "黑夜领域 — bedeninden gelgit gibi saf karanlık taşırıp bir alan kurar"
      - yol: "Hafi Talibi Yolu"
        mertebe: 0
        pay: kismi
        not: >-
          倒吊人'in beş salahiyetinden biri; 暗 olarak tezahür eder.
          Kanon burada Ebedi Gece Tanrıçası ile doğrudan mukayese yapar:
          Asılmış Adam'ın karanlığı her şeyi kapsayıp yutan ve insan
          kalbini alçaltan karanlığa meyleder.
      - yol: "Hafi Talibi Yolu"
        mertebe: 1
        not: "权柄体现 — simsiyah, yapışkan, tereddi kokan bir 'okyanus' yaratıp düşman saldırılarını yutar"
      - yol: "Aktar Yolu"
        mertebe: 0
        pay: kismi
        not: "Uykusuz Yolu'ndan farklı olarak Ay'dan doğan karanlık büyülerine ve hassalarına ağırlık verir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Darkness"
    not: >-
      Salahiyetin asıl sahibi Ebedi Gece Tanrıçası'nın Yolu'dur ve
      kelimenin nötr, tasvirî kaydı oradaki asıl karşılıktır (Kural 13:
      Mertebe 0 adları sade ve yerli kelimelerdir). Kanonun Yollar
      arasında açıkça mukayese kurması, Kural 10 gereği tek kelime
      kullanılmasını zorunlu kılar.
      KAYIT KATMANLARI (Kural 9): 暗 / 黑暗 üç yuvada üç biçim taşır.
      Salahiyet adı ve Mertebe 0 adı 'Karanlık'tır; özel adlarda
      'Zulmet' kullanılır (Sermedi Zulmet ← 永恒之暗, Ebedi Zulmet
      Nehri ← 永暗之河); sıfat hâli 'Zulmani'dir (Zulmani Melek ←
      暗天使). Üçü aynı terimdir, bölünme değildir.

  - cince: 异变
    pinyin: yìbiàn
    turkce: Mesh
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 11]
    gecisler:
      - yol: "Hafi Talibi Yolu"
        mertebe: 0
        pay: kismi
        not: >-
          倒吊人'in beş salahiyetinden biri; ilahî kudret karanlıkta yoktan
          canavar yaratır, diriliş hususiyeti buradan gelir (血肉不灭'in
          nitelik değiştirmiş hâli). Ayrıca her şeyin 变化'sini bir dereceye
          kadar etkiler ve bu, Soytarı ile kesişen bir salahiyettir.
      - yol: "Hafi Talibi Yolu"
        mertebe: 3
        not: "血肉不灭 ve üç başın çıkması, 血肉 salahiyetinin tezahürüdür; o da 异变'in alt salahiyetidir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Mutation"
    not: >-
      مسخ kökünden; 'mesh olmak' Türkçede canavarımsı bir biçime dönüşmeyi
      bildirir ve 异变'in yoktan canavar yaratma tarifini doğrudan karşılar.
      KABUL EDİLEN KAYIP: 异变 ile 异类 (Ecnâs) Çincede 异 karakterini
      paylaşır ve kanon birini tarif ederken diğerini kullanır. Türkçede bu
      ortaklık kurulmadı. Sebep: ortak kök taşıyan her Türkçe çift
      (Başkalık/Başkalaşım, Gayriyet/Tagayyür) 变化 (Change) ile de kök
      paylaşırdı; 变化 ise kanonun 异变 ile kesiştiğini söylediği ayrı bir
      salahiyettir. Okur gerçek bağı icat edilenden ayıramazdı.
      Bağ kanonda işletilmez, yalnızca tarifte kullanılır (krş. Soytarı'daki
      愚 / Azathoth kaydı).

  - cince: 欲望
    pinyin: yùwàng
    turkce: Arzu
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        pay: kismi
        not: "arzunun kendisi değil; kışkırtma, katalizör ve patlatma. 欲望母树'te kalanlarla karşıtlık kanonda belirtilir"
      - yol: "Suçlu Yolu"
        mertebe: 5
        not: "欲望使徒 → Arzu Havarisi; ayrıca 掌控欲望 ve 欲望化身 kabiliyetleri"
      - yol_grubu: "Arzuların Ana Şeceresi"
        not: "欲望母树 — yol grubu adında"
    dogrulama: yazar_qa

  - cince: 诅咒
    pinyin: zǔzhòu
    turkce: Lanet
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        pay: kismi
        not: "被缚者'e (Prangalı) kıyasla ruh ve zihin alanlarında yoğunlaşır"
      - yol: "Suçlu Yolu"
        mertebe: 8
        tur_burada: kabiliyet
        not: "恶语伤人 tarzı zayıf lanetler — gulyabani tipine göre değişir"
      - yol: "Hafi Talibi Yolu"
        mertebe: 7
        tur_burada: kabiliyet
        not: "阴影诅咒 — hedefin gölgesi üzerinden lanet; ayin veya hedefin eti/gölgesi vasıta olarak gerekir"
      - yol: "Hafi Talibi Yolu"
        mertebe: 6
        tur_burada: kabiliyet
        not: "血肉诅咒"
      - yol: "Mahkûm Yolu"
        mertebe: 0
        pay: tam
        not: >-
          salahiyetin asıl sahibi. Mertebe 0'da simge düzeyinde
          uygulanır: hedef farkına varmadan lanetlenir, her türden
          lanet tamamlanabilir ve kendisi güç lanetlenir — çok kuvvetli
          ve doğrudan bir bağ kurulmadıkça simgesel bağlar ona tesir
          etmez.
      - yol: "Mahkûm Yolu"
        mertebe: 2
        pay: kismi
        not: "古代邪物 → Kadim Melanet; 诅咒之源 (Lanetlerin Menbaı) mitsel biçim olarak dışa vurur, gören her canlı karşılık gelen lanete uğrar"
      - yol: "Mahkûm Yolu"
        mertebe: 1
        not: "神孽 → Ulûhiyet Nekbeti; azizlerin bile sezemediği, herhangi bir bağ üzerinden asla ulaşan lanetler kurar"
      - yol: "Mahkûm Yolu"
        mertebe: 8
        not: "Mertebe 8'den itibaren Lanet tedricen belirir: arzunun sık patlaması yüzünden Meczup çoğu Aşkından daha kolay şirazesini yitirir"
    dogrulama: yazar_qa
    not: >-
      Salahiyetin asıl sahibi Mahkûm Yolu'dur. Kanon Hâviye'nin
      lanetlerini ona göre konumlandırır: 被缚者'e kıyasla Hâviye'nin
      laneti ruh ve zihin alanlarında yoğunlaşır.

  - cince: 心灵
    pinyin: xīnlíng
    turkce: Zihin
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        not: "beş asli salahiyetin tamamı 心灵'e temas eder; 心灵 olmadan hiçbiri tam sayılmaz"
      - yol: "Suçlu Yolu"
        mertebe: 0
        not: "心灵渊海 — İlahi Hükümranlık → Zihnin Hâviyesi"
      - yol: "Suçlu Yolu"
        mertebe: 3
        not: "污染 bu Mertebede 心灵 ve 精神 alanlarında yoğunlaşır"
      - yol: "Seyirci Yolu"
        mertebe: 0
        pay: tam
        not: "心灵世界之主 — Âlem-i Zihin'in hükümdarı; âlem her kişinin bilinç adasını ve Külli Şuur-altı Deryası'nı kapsar"
      - yol: "Seyirci Yolu"
        mertebe: 1
        pay: kismi
        not: "her canlının zihnine hükmedip kendi iradesince hareket ettirebilir; hedef bunu kendi düşüncesi sanır"
      - yol: "Seyirci Yolu"
        not: "心灵世界 → Zihinsel Âlem / Âlem-i Zihin; 心灵大海 → Külli Şuur-altı Deryası; mitsel biçim 心灵巨龙"
      - varlik: "Yarı Kadir-i Mutlak Âdem"
        not: "tazim ismi — Âlem-i Zihnin Hâkimi"
    dogrulama: metin
    ingilizce_tuzak: "Mind / Spirit / Consciousness — 精神, 意识 ve 灵性 ile aynı kelimelere düşer"
    not: >-
      Nötr bir altyapı kelimesi gerekir: 心灵 Çincede de düz ve teknik bir
      kelimedir ve dünya adı, diyar adı, iksir malzemesi ve tazim ismi olarak
      görünür. 'Gönül' değerlendirildi ve reddedildi — Hâviye'de istenen
      karanlık okumayı verir, fakat Seyirci Yolu'nun sıradan bağlamlarında
      fazla yüklü kalır. Aranan karanlık zaten 心 ile kurulan 心之深渊
      (Kalbin Hâviyesi) satırında bulunur; o ayrı bir karakterdir.
      Ayrım ailesi — 心灵 Zihin · 意识 Bilinç · 灵性 Ruhaniyet · 精神 Ruhani
      (bkz. Ruhani Beden) · 心智 Dimağ (bkz. Dimağ Bedeni).
      NOT: 心灵大海 ile 集体潜意识之海 aynı denizin iki adıdır; ikisi de
      'Külli Şuur-altı Deryası' ile karşılanır, ayrı bir yer değildir.

  - cince: 异类
    pinyin: yìlèi
    turkce: Ecnâs
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        pay: kismi
        not: "aşağı doğru: gulyabanilerin kişisel ve çevresel etkenlerle ayrı ayrı başkalaşması; yukarı doğru: bütün bu başkalaşımların tamamına sahip olmak, hepsini kapsamak"
      - yol: "Mahkûm Yolu"
        mertebe: 0
        pay: tam
        not: >-
          异类之王 — Ecnâsın Kralı. Kanon burada terimi tarif eder:
          ecnâs, Aşkın Hasletlerinin menfi tesirlerinden doğan
          canavarlardır; gulyabaniler de, başka Yollarda şirazesini
          yitirenler de buna dâhildir. Hepsi Prangalı karşısında tabii
          olarak bastırılır, orta ve alt Mertebedekiler doğrudan sadık
          kulu olur. Her ecnâs cinsi ona en basit biçimde yakarabilir
          ve karşılık alır.
      - yol: "Mahkûm Yolu"
        mertebe: 1
        pay: kismi
        not: "神孽 → Ulûhiyet Nekbeti; laneti çevredeki canlıları kurtadama, hortlağa, kuklaya çevirebilir, fakat bu ecnâs kuklaları kısa süre dayanır"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Deviants"
    not: >-
      'Aykırı Irk' düz metinde kullanılır ve orada doğrudur (kanon farklı
      ırklardan türeyen gulyabanilerden söz eder); salahiyet adı olarak
      reddedildi: salahiyet ırkı değil, kategorik başkalığı adlandırır ve
      başkalaşım çoğu yerde ferdîdir. Ayrıca iki kelimelik ad bileşiğe
      girmez (krş. 'Ecnâs Ateşi').
      异 ortaklığının 异变 (Mesh) ile kurulmaması bilinçlidir; gerekçe o
      satırdadır.
      Bilinen risk: 'cins' modern Türkçede kaymış bir kelimedir; klasik
      kayıtta ve bileşiklerde sorun çıkarmaz.

  - cince: 空想
    pinyin: kōngxiǎng
    turkce: Tahayyül
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Seyirci Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Yolun asli salahiyeti; 幻想成真 (hayalin gerçek olması) diye de
          anılır. Tahayyül ettiği nesne tecessüm eder, tasavvur ettiği
          diyar fiziksel dünyaya iner, ilan ettiği gelecek vuku bulur.
          Yalnız zihni ve idraki değil Âlem-i Misal'i de kapsar; bu yüzden
          Musavvir iki Mertebe 1 hasletini ayırıp yerlerine tahayyül ettiği
          hasletleri koyabilir ve konumu düşmez.
      - yol: "Seyirci Yolu"
        mertebe: 1
        pay: kismi
        not: >-
          yazdığı hikâyeler gerçeğe dönüşür; hikâye mantıklı değilse ve
          olayları 'nedense', 'tuhaf biçimde' gibi muğlak sebeplerle
          yürütüyorsa sarfiyat artar, fark edilme ihtimali yükselir
      - yol: "Seyirci Yolu"
        mertebe: 0
        tur_burada: kabiliyet
        not: "空想之国 — İlahi Hükümranlık → Tahayyül Diyarı; Musavvir'in kendi kurduğu ülkedir ve ilahlaşmayla İlahi Diyar'a dönüşür"
      - varlik: "Grisha Âdem"
        not: "空想天使 → Tahayyül Meleği"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Imagination / Fantasy — 幻想 ve 梦境 ile karışır"
    not: >-
      Adem'in melek unvanında (空想天使) zaten kullanılan karşılıktır;
      Kural 10 gereği salahiyet satırı onunla aynı kelimeyi taşır.
      KABUL EDİLEN KAYIP: 空 'boş' demektir ve 空想 Çincede gerçekleşmesi
      mümkün olmayan kuruntuyu bildirir; kanon bu küçültücü kelimeyi
      tahayyülü gerçeğe dönüşen bir ilaha vererek istihza kurar.
      'Tahayyül' nötrdür ve bu istihzayı taşımaz. Mertebe 0 adının neden
      空想家'dan değil salahiyetten türetildiği için bkz. Musavvir notu.

  - cince: 洞察
    pinyin: dòngchá
    turkce: Temyiz
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 11]
    gecisler:
      - yol: "Seyirci Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Âlem-i Zihin'in hükümdarı olarak bir manada her şeyi bilir, fakat
          bu bilme yalnızca Âlem-i Zihin'le ilgili olanı kapsar. Temyiz
          ayrıca kader, hakikat ve vehim alanlarına da yönelebilir.
      - yol: "Seyirci Yolu"
        mertebe: 2
        pay: kismi
        not: >-
          洞察者 → Mümeyyiz; Mertebe adında. Hedefin gizli zihin
          gediklerini ve en çok neden korktuğunu sezer, geçmiş
          kaderlerini ve doğurduğu illiyet bağlarını başlangıç
          düzeyinde okur. Olağan kehanet ve tenebbü karşıtı tedbirler onu
          aldatamaz.
      - yol: "Seyirci Yolu"
        mertebe: 1
        pay: kismi
        not: "凡有言，必被知 — biri Yazar'ı tanıdığı anda Yazar da onu ve temas ettiği herkesi tanır"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Insight"
    not: >-
      Mertebe 2'nin adı (洞察者) salahiyetin fail hâlidir; Türkçede
      Mümeyyiz/Temyiz aynı kökü paylaşarak bu ortaklığı korur (Kural 11
      onarımı). Musavvir'in aksine burada ad salahiyetten kopmaz.
      Kanon Temyiz ile 隐秘 (Sırrakadem) arasında karşılıklı men ilişkisi
      kurar: Temyiz bazen Sırrakadem'in örtüsünü deler, bazen ona takılır.
      Aynı ilişki aldatma ve iğfal salahiyetleri için de geçerlidir.
      NOT: 洞悉 ile 洞察 ayrı terimlerdir ve İngilizce ikisine de Insight
      der. 洞悉 Okur Yolu'nun Mertebe 3'üdür (Arif), 洞察 ise bu satırdır.
      Arif/Temyiz ayrımı bu yüzden bilinçlidir.

  - cince: 梦境
    pinyin: mèngjìng
    turkce: Hülya
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Seyirci Yolu"
        mertebe: 0
        pay: kismi
        not: "梦境 kavramının bizzat kendisi"
      - yol: "Seyirci Yolu"
        mertebe: 5
        not: "梦境行者 → Hülya Gezgini; Mertebe adında"
      - yol: "Seyirci Yolu"
        mertebe: 3
        not: "织梦人 → Hülya Dokuyan; Mertebe adında. Terfi ayini: en az yüz bin kişiye aynı gece aynı rüyayı gördürmek"
      - yol: "Seyirci Yolu"
        mertebe: 1
        tur_burada: kabiliyet
        not: "真实之梦 — rüya ile gerçeği birbirine dokur, ikisi ayırt edilemez hâle gelir"
      - yol: "Uykusuz Yolu"
        mertebe: 0
        pay: kismi
        not: "Karanlık salahiyetinin bir ciheti sayılır; Seyirci ile aynı seviyede karşılaştığında hülya salahiyeti kâbusa meyleder. Gerçek ilahlar dahi derin uykuya sokularak hülyaya çekilebilir"
      - yol: "Uykusuz Yolu"
        mertebe: 7
        not: "梦魇 → Kabus; 入梦 (hülyaya çekmek) ve 塑梦 (hülyayı biçimlendirmek)"
      - yol: "Uykusuz Yolu"
        mertebe: 3
        not: "梦魇世界 — bir hülya dünyası kurup menzildeki herkesi içine alır"
    dogrulama: yazar_qa
    not: >-
      Kural 8 'Hülya'yı eskiden Seyirci Yolu'na ayırıyordu; 梦境 bir
      salahiyet olduğu ve Uykusuz Yolu'nda da bulunduğu için Kural 10
      gereği tek kelime kullanılır. Rezerve Kural 8'den kaldırılmıştır.
      Düş Hırsızı (窃梦家, Kapkaççı M5) ayrı kalır: o Mertebe rüyaya
      giremez, yalnız çalar, depolar ve aktarır; 'Hülya'nın
      girilebilirlik çağrışımı Mertebenin sahip olmadığı yetiyi vaat
      ederdi (bkz. o Mertebenin notu).

  - cince: 失控
    pinyin: shīkòng
    turkce: Şirazesizlik
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Seyirci Yolu"
        mertebe: 0
        pay: kismi
        not: "Aşkın için kendi zihninin çöküşü çoğu zaman şirazesizliğin başlangıcıdır"
    dogrulama: yazar_qa
    not: >-
      Fiil hâli 'şirazesini yitirmek'; Temel Kavramlar'daki girdi bu
      deyimle kurulmuştur ve ikisi tek terimdir (krş. Tereddi/Mütereddi,
      Kader/Mukadderat). Salahiyet adı olarak isim hâli kullanılır,
      çünkü deyim bileşiğe girmez.
      Kavram neredeyse her Yolda anılır fakat tasarruf beyanı yalnızca
      burada vardır; bkz. GEÇİŞ SINAMASI.

  - cince: 神圣
    pinyin: shénshèng
    turkce: Kudsiyet
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Ozan Yolu"
        mertebe: 0
        pay: tam
        not: "上位权柄 — cümle nâhemvarlığı arıtıp dağıtır; her kudsi fiili azami derecede kuvvetlendirir"
      - yol: "Ozan Yolu"
        mertebe: 1
        pay: kismi
        not: "神圣之国 — Beklend'i örtecek kadar geniş vehmî bir ülke; içinde hiç karanlık yoktur, ölümsüz varlık barınamaz, Karanlık Yolu'nun diriltmesini etkisiz kılabilir"
      - yol: "Savaşçı Yolu"
        mertebe: 0
        pay: kismi
        not: "yokoluş hayatın ve âlemin en son ve en ciddi hadisesidir, dolayısıyla kudsidir; Alacakaranlık Devi de bu yüzden arıtmada ve şer ile tereddiyi ayırt etmede mahirdir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Holiness / Divinity — 神性 ve 灵性 ile karışabilir"
    not: >-
      净化 (arıtma) bu salahiyetin tarifidir, ayrı bir salahiyet değildir;
      Mertebe 4'ün çekirdek kabiliyeti (净化) ve Mertebe 5'in 净化光环'ı
      aynı salahiyetin tezahürleridir. Bu yüzden 'Arınma' salahiyet adı
      olarak kullanılmaz.

  - cince: 光
    pinyin: guāng
    turkce: Işık
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Ozan Yolu"
        mertebe: 0
        pay: tam
        not: >-
          上位权柄 — 光在，我在: ışık varsa ben varım. Her şeyi aydınlatır,
          her şeyi yok eder. Enerjinin özüdür ve Alîm ü Kadîr'in enerji
          temelidir.
      - yol: "Ozan Yolu"
        mertebe: 2
        pay: kismi
        not: "逐光者 → Işıkperest; Mertebe adında. Işığa dönüşüp uçabilir, ışık hâlinde hasar alıp bedenini yeniden kurabilir"
      - yol: "Ozan Yolu"
        mertebe: 8
        not: "祈光人 → Işık Duacısı; Mertebe adında"
      - yol: "Ozan Yolu"
        mertebe: 5
        not: "光之祭司 → Işık Rahibi; Mertebe adında"
      - varlik: "Ebedi Yanan Güneş"
        not: "tazim ismi — 不灭之光 → 'Sönmez Işık'"
      - yol: "Savaşçı Yolu"
        mertebe: 0
        tur_burada: simge
        not: "光, 时空 ve 衰败 simgeleri birlikte 黄昏 (Alacakaranlık) salahiyetini türetir"
      - yol_grubu: "Işık Miftahı"
        not: >-
          光之钥 → Işık Miftahı. Kanon adı açıkça gerekçelendirir: ışık
          konisinin içi kaderdir; Yüce Kadim'in Işık Miftahı, Kader
          Çarkı'nın hükümranlığının Işık Konisi Âlemi diye anılması
          bundandır. İki adın ortak 光'u bağın kendisidir; yol grubu adı
          bu yüzden yükseltilmiş 'Nur' katmanını değil, salahiyetin
          kelimesini taşır (Kural 11, Kural 9'un özel ad katmanına
          üstün tutulmuştur).
    dogrulama: yazar_qa
    not: >-
      'Nur' değerlendirildi ve reddedildi. 光 bu Yolda fizikî ve enerjik
      bir kavramdır (ışın, ısı, yıldız, şehri aydınlatan parlaklık);
      'Nur' ise ilahî aydınlanmayı bildirir ve Yolun ayrı bir asli
      salahiyeti olan 神圣 (Kudsiyet) ile aynı kayda düşerdi. İki
      salahiyeti tek registere indirmek kaynağın ayrımını siler.
      BİLİNEN İSTİSNA: Müphem Sis'in tazim isminde 光与暗 çifti 'Nur ile
      Zulmet' olarak korunmuştur. Bu CoI tarafında bilinçli bir register
      tercihidir; satırla çakışması kabul edilmiştir, düzeltilmeyecektir.

  - cince: 秩序
    pinyin: zhìxù
    turkce: Nizam
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Ozan Yolu"
        mertebe: 0
        pay: tam
        not: >-
          上位权柄 — Kara İmparator'un nizamından farkı: Güneş'in nizamı
          daha müspet, daha benmerkezci ve daha dışlayıcıdır; istediği
          nizamı doğrudan kuramaz, önceden oluşturduğu adalet
          nizamnamesinden türetmek zorundadır. Kanon iki Yolun bu
          salahiyette kesiştiğini ve örtüştüğünü açıkça söyler.
      - yol: "Ozan Yolu"
        mertebe: 3
        pay: kismi
        not: "正义导师 → Adalet Üstadı; kendi adalet nizamnamesi onun için kendi 'nizamı'dır — kendisiyle, ilahla ve dünyayla kurduğu bir akit"
      - yol: "Ozan Yolu"
        mertebe: 1
        pay: kismi
        not: "秩序化身 — kendisiyle ilgili ticari faaliyet ve genel nizam bozulmadıkça buradan kuvvet devşirir"
      - varlik: "Ebedi Yanan Güneş"
        not: "tazim ismi — 秩序化身 → 'Nizamın Timsali'"
      - yol: "Arabulucu Yolu"
        mertebe: 0
        pay: tam
        not: >-
          审判者 → Yargı; salahiyetin asıl sahibi. Astları 规则 (Kaide),
          律法 (Ahkâm) ve 规律 (Mizan)'dır. Âlemin alt katman kaidelerini
          bir dereceye kadar tadil edebilir, yeni kaideler vazedebilir
          (alt katman olmayanlar kalıcı olur), mevcutları kaldırabilir
          ve muayyen kişilere muafiyet tanıyabilir. Vazedilen kaide
          ilan edilmedikçe geçerli olmaz.
      - yol: "Arabulucu Yolu"
        mertebe: 1
        pay: kismi
        not: "秩序之手 → Nizamın Eli; Mertebe adında. 秩序代行者 (Nizamın Vekili) olarak bütün bir harp meydanına yahut küçük bir ülkeye yeni kaideler vazeder"
      - yol: "Avukat Yolu"
        mertebe: 0
        not: >-
          Kara İmparator nizama tâbi değildir fakat onun üzerinden
          çalışır: gediklerini istismar eder, maksadını tahrif eder.
          Kanon Güneş ile kesişmeyi açıkça belirtir — Güneş'in nizamı
          daha müspet ve dışlayıcıdır, Kara İmparator ise asli kaideleri
          büker. Çorak ve ölü yerlerde ikisi de insanın yaşayabileceği
          bir nizam kurabilir, usulleri farklıdır.
    dogrulama: yazar_qa
    ingilizce_tuzak: "Order"
    not: >-
      Yargı ve Kara İmparator Yollarında da bulunur; Kural 10'un kurucu
      örneğidir.
      'Adalet' (正义) ayrı bir kavramdır ve salahiyet değildir: Mertebe
      3'ün kurduğu nizamname, 契约 ve 秩序 salahiyetlerini kazandıran
      şarttır, salahiyetin kendisi değil.

  - cince: 全知
    pinyin: quánzhī
    turkce: Alîm
    tur: salahiyet
    durum: tamam
    sistem_kural: [7, 10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 0
        pay: tam
        not: >-
          her şeye dair alîmdir ve bu Ruhani Âlem'den etkilenmez; alîm olmak
          kadîr olmayı gerektirdiğinden Beyaz Kule her kabiliyeti taklit
          edebilir, hatta iyileştirip aşabilir. Salahiyetler ve simgeler
          bunun dışındadır: bilgisine tam hâkim olsa dahi elde edemez,
          yalnızca dışa dönük tezahürlerini taklit eder.
      - yol: "Okur Yolu"
        mertebe: 1
        pay: kismi
        not: "全知之眼 → Külli Bâsır Göz; hedefin geçmişine, hâline ve istikbaline dair bütün malumatı görür"
      - yol: "Okur Yolu"
        mertebe: 5
        not: "Havas Müdebbiri terfi ettiğinde 全知 salahiyetinin sahibinden tabii olarak altı ilâ on üç havas edinir"
      - varlik: "Kadir-i Mutlak"
        not: "tazim ismi — 全知全能者 → 'Alîm ve Kadîr'"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Omniscience"
    not: >-
      Tazim isminde zaten kullanılan karşılıktır ve 全能 (Kadîr) ile
      Çincedeki 全知全能 çiftini Türkçede korur; Kural 7 gereği
      Esmâ-ül Hüsnâ ödünçlemesi yalnızca bu yol grubuna açıktır.
      Mertebe 1'in adı 'Külli Bâsır Göz'dür ve farklı bir kelime taşır;
      o ad 眼 imgesini ve idrak organını karşılar, salahiyeti değil
      (bkz. o Mertebenin notu).
      Kanon 全知'nin 痴愚 (Kör Ahmaklık) ve 不可思议 gibi simgelerden
      etkilendiğini belirtir.

  - cince: 全能
    pinyin: quánnéng
    turkce: Kadîr
    tur: salahiyet
    durum: tamam
    sistem_kural: [7, 10]
    gecisler:
      - varlik: "Kadir-i Mutlak"
        not: "tazim ismi — 全知全能者 → 'Alîm ve Kadîr'"
      - yol: "Hafi Talibi Yolu"
        not: "kanon Asılmış Adam'ı 全能'in temsilcisi sayar; Otlatma sayesinde başka Yolları kullanabildiği için全能, bu da全知'yi doğurur"
      - yol: "Okur Yolu"
        not: "Beyaz Kule 全知'nin temsilcisidir; 全知 ile 全能 birbirini gerektirdiğinden iki Yol karşılıklı olarak birbirinin yerine geçebilir"
    dogrulama: wiki
    ingilizce_tuzak: "Omnipotence"
    not: >-
      Asılmış Adam ile Beyaz Kule'nin "birbirinin yerine geçebilmesi"
      simge düzeyindedir: alîm olmak kadîr olmayı, kadîr olmak alîm
      olmayı gerektirir. Yol değiştirmenin kolaylığıyla karıştırılmamalı
      — aynı yol grubundaki bütün Yollar birbirine geçebilir, zira hepsi
      aynı Yüce Kadim'in ayrı cihetleridir; grubun tanımı budur.
      DOĞRULAMA UYARISI: bu satır yazar gönderilerinden değil,
      ansiklopedi maddesinden derlenmiştir. Denizci Yolu'nun gönderisi
      全能'i simge olarak teyit eder (水 salahiyeti 造物 ile 全能
      simgelerinin kesişiminden doğar), fakat Asılmış Adam–Beyaz Kule
      eşleşmesi henüz Çince kaynaktan teyit edilmemiştir.

  - cince: 智慧
    pinyin: zhìhuì
    turkce: Hikmet
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 2
        pay: kismi
        not: "智天使 → Hikmet Meleği; Mertebe adında. Vaziyetin değişimini daima önceden görür, en doğru ve en yerinde tercihi yapar"
      - yol: "Okur Yolu"
        mertebe: 0
        pay: kismi
        not: "alîm olmak en hikmetli irşadı vermeyi ve en hikmetli tercihi yapmayı gerektirir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Wisdom"
    not: "Mertebe adında (Hikmet Meleği) zaten kullanılan karşılıktır."

  - cince: 规律
    pinyin: guīlǜ
    turkce: Mizan
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 3
        pay: kismi
        not: >-
          洞悉者 → Arif. Mizana doğrudan tesir etmez; mizanın mahiyetini
          idrak ettikten sonra ona uygun bir tedbirle onu kaldıraç gibi
          kullanır. Bir dağı yıkmak için felaket kabiliyeti gerekmez,
          doğru taşı çekmek yeter.
      - yol: "Okur Yolu"
        mertebe: 0
        pay: kismi
        not: "全知'nin alt salahiyeti olarak sayılır: bilinen mizana hükmedilir ve o kullanılır"
      - yol: "Arabulucu Yolu"
        mertebe: 0
        ust_salahiyet: [秩序]
        not: "Nizam'ın astlarından biri; 规则 (Kaide) ve 律法 (Ahkâm) ile birlikte sayılır"
      - yol: "Bilgin Yolu"
        mertebe: 0
        pay: kismi
        not: "hakikate meyleden kısmı; mizan marifetin bir parçasıdır, ona hâkim olan âlemin işleyişini kendi lehine çevirir. Yargı'nın alt katman kaidelerini değiştirmesinden zayıftır, zira Ekmel yalnız fizik mizanına tesir eder"
      - yol: "Bilgin Yolu"
        mertebe: 2
        pay: kismi
        not: "知识导师 → Marifet Müdebbiri; fizik mizanını bir dereceye kadar değiştirir — yanma ateş vermeyebilir, kırağı sıcaklık getirebilir, yer ağırlık taşımaz olabilir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Law / Rule — 规则 (Kaide) ve 秩序 (Nizam) ile aynı kelimelere düşer"
    not: >-
      Üç ayrı terim, üç ayrı kelime: 规律 Mizan (eşyanın tabii
      düzenliliği), 规则 Kaide (konulmuş kural; bkz. Amon tazim ismi
      'Kaidelerdeki Gedik'), 秩序 Nizam (salahiyet; bkz. o satır).
      Kanon Mertebe 0'da 规律'yi 全知'nin alt salahiyeti sayar, Mertebe
      3'te ise müstakil bir salahiyet olarak verir; kaynak burada
      tutarlı değildir, iki geçiş de olduğu gibi kaydedilmiştir.

  - cince: 灾祸
    pinyin: zāihuò
    turkce: Musibet
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 0
        pay: kismi
        not: "başkalarına cinnet ve helâk verebilir; bazı bilgiler bizzat bu simgelerin tecessümüdür"
      - yol: "Okur Yolu"
        mertebe: 0
        tur_burada: simge
        not: >-
          知识通向灾祸 — bilginin musibete açılması Yolun alt katman
          simgesidir (yazar beyanı). Beyaz Kule'nin ilahlaşma ayini de
          buna dayanır: Mertebe 0 üstü bir varlığın getirdiği musibete
          iştirak edip sağ kalmak.
    dogrulama: yazar_qa
    ingilizce_tuzak: "Calamity / Disaster"
    not: >-
      'Afet' 灾难'ı karşılar (Şeytaniçe'nin salahiyeti); 'Felaket'
      天灾'dır. 'Musibet' başa gelen, isabet eden
      belayı bildirir ve bilginin insanı sürüklediği akıbet fikrine
      uyar.
      Yolun mitsel biçimi bu simgeyi görünür kılar: kat kat kitaplardan
      kurulu bir kule, yukarı çıktıkça karanlıklaşır ve cinnet, helâk,
      uğursuzluk, musibet kokusuyla dolar.

  - cince: 创造
    pinyin: chuàngzào
    turkce: Hâlık
    tur: salahiyet
    durum: tamam
    sistem_kural: [7, 10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 0
        pay: kismi
        not: "造物 simgesinden ve 全知全能 simgesinden doğar; alîm olan Beyaz Kule tabii olarak her şeyi halk edebilir, yalnız kendisine ait olmayan simge ve salahiyetlerden sıyrılamaz"
      - varlik: "Kadir-i Mutlak"
        not: "tazim ismi — 创造者 → 'Hâlık'"
      - varlik: "Hakiki Hâlık"
        not: "tazim ismi — 创造一切的主 → 'Mevcudatın Hâlıkı'"
    dogrulama: yazar_qa
    not: >-
      Esmâ-ül Hüsnâ'daki yaratma üçlüsü kaynaktaki üç ayrı terimi karşılar:
      创造 Hâlık (takdir eden), 造物 Bârî (yokluktan varlığa çıkaran),
      空想'ın Mertebe 0 adı Musavvir (suret veren). Üçlü, Kadir-i Mutlak
      girdisinde dizgesel olarak gerekçelendirilmiştir.
      'Sâni' değerlendirildi ve bırakıldı: üçlüyü bozuyor ve 造物 ile
      创造 arasında dördüncü bir kelime getiriyordu.

  - cince: 星界导师
    pinyin: xīngjiè dǎoshī
    turkce: Âlem-i Misal Müdebbiri
    tur: salahiyet
    durum: tamam
    sistem_kural: [2, 10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 1
        not: >-
          kısa süreliğine, dar bir sahada, Âlem-i Misal kavramlarına
          dokunup onları kullanarak hedefin bazı fiillerini tesirsiz
          kılar, hataya düşürür veya tesirini büyütür. Örneğin Külli
          Şuur-altı Deryası'nın yahut Heyûlâ Deryası'nın 'su' kavramını
          geçici olarak yeniden tarif ederek Tiran'ın onu kullanmasını
          engeller. Tadil tek bir cihete münhasırdır, aslı ilgilendiren
          kısma dokunamaz ve birden fazla kalem olamaz.
    dogrulama: yazar_qa
    not: >-
      导师 burada Kural 2'ye girer ve 'Mürşid' çıkar: hiçbir
      öğretmen-öğrenci ilişkisi yoktur. Aynı Yolun Mertebe 5'i de (秘术导师)
      bu kelimeyi taşır: Havas Müdebbiri (bkz. Kural 2). 'Müdebbir' (işleri
      çekip çeviren, tedbir eden) kavramların idaresini karşılar ve
      Kadir-i Mutlak'ın aynı Âlem üzerindeki 'Âlem-i Misal Hükümdarı'
      unvanıyla çakışmaz; biri hükmeder, diğeri tedbir eder.

  - cince: 雷霆
    pinyin: léitíng
    turkce: Sâika
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Denizci Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [造物]
        not: >-
          电与磁 — elektrik ve manyetizma. Şiddetli elektromanyetik
          fırtınalar çıkarıp bütün malumat yapılarını bozabilir.
          物质 salahiyetiyle kesişir.
      - yol: "Denizci Yolu"
        mertebe: 1
        not: "天罚 — gökten inen devasa şimşek; çözme, arıtma ve helâk kuvvetleri taşır, Karanlık/Ölüm/Tereddi/Necaset alanlarındaki hasımlara karşı hususi tesirlidir. 雷霆之舞 malumatı bozar"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Thunder / Lightning — 雷, 闪电 ve 雷霆 aynı kelimelere düşer"
    not: >-
      Üç ayrı terim ayrı tutulur: 雷霆 Sâika (salahiyet; 霆 şiddetli
      gürleyişi bildirir, kavram elektrik-manyetizmadır), 雷神 Yıldırım
      Tanrısı (Mertebe 1 adı; Thor calque'i, hava olayı kaydında kalır),
      闪电 Şimşek (kabiliyet tasvirlerinde geçen görünür çakış —
      闪电风暴, 连环闪电, 闪电海洋).
      'Şimşek' salahiyet için reddedildi: görünen çakışı bildirir, oysa
      salahiyetin tarifi kuvvetin kendisidir.

  - cince: 暴君
    pinyin: bàojūn
    turkce: Tiran
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 13]
    gecisler:
      - yol: "Denizci Yolu"
        mertebe: 0
        pay: tam
        not: "万王之王 — kralların kralı. Altında 威慑, 愤怒 ve kısmi 恐惧 salahiyetleri bulunur; 歌唱 kabiliyeti bunlardan türer"
      - yol: "Denizci Yolu"
        mertebe: 3
        pay: kismi
        not: "海域主宰 — kısmi 暴君 ve kısmi 水生生物 salahiyetleri"
    dogrulama: yazar_qa
    not: "Mertebe 0 adıdır; Kural 13 gereği tek kelimedir."

  - cince: 水
    pinyin: shuǐ
    turkce: Su
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Denizci Yolu"
        mertebe: 0
        pay: tam
        not: "造物 ve 全能 simgelerinin kesişiminden doğar; altında 海洋 ve kısmi 水生生物 salahiyetleri bulunur"
    dogrulama: yazar_qa
    not: >-
      Kanon bu salahiyetin kapsamına Külli Şuur-altı Deryası, Heyûlâ
      Deryası, Ruhaniyet Deryası, Ebedi Zulmet Nehri ve Kader Nehri'ni
      de sokar; hepsine doğrudan müdahale edilemez, bir kısmı ancak
      dolaylı ve zayıf biçimde etkilenir. Beyaz Kule'nin Âlem-i Misal
      Müdebbiri salahiyeti tam olarak bu kavramı geçici olarak yeniden
      tarif ederek Tiran'ın kullanımını engeller.

  - cince: 物质
    pinyin: wùzhì
    turkce: Madde
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Denizci Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [造物]
        not: >-
          madde enerjiye, enerji maddeye dönüşebilir; elektromanyetik,
          kuvvetli ve zayıf temel kuvvetleri kapsar. 雷霆 ile kesişir.
          Taşıyanı kısa süreliğine akıma/ışığa dönüşüp hız haddine
          yaklaşabilir ve bir gezegeni yok edebilecek azgın bir dalga
          yaratabilir.
    dogrulama: yazar_qa
    not: >-
      Sefahat Ana Tanrıça'nın 'Cismani Âlemin Hâkimi' unvanı ayrı bir
      terimdir (现实世界的主宰 — hakiki âlemin hükümdarı) ve bu satırla
      çakışmaz.

  - cince: 风
    pinyin: fēng
    turkce: Rüzgâr
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Denizci Yolu"
        mertebe: 0
        pay: tam
        not: "天灾 ile kesişir"
      - yol: "Denizci Yolu"
        mertebe: 6
        not: "风眷者 → Rüzgarkutlu; Mertebe adında"
      - yol: "Denizci Yolu"
        mertebe: 1
        not: "风暴地狱 — kısmi 天灾 ile 风 salahiyetinin birleşiminden türer"
    dogrulama: yazar_qa
    not: >-
      风暴 (fırtına) ayrı bir bileşiktir ve tazim isminde 'Fırtınalar
      Hâkimi' (风暴之神) olarak geçer; salahiyet bare 风'dır.

  - cince: 征服
    pinyin: zhēngfú
    turkce: Fetih
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          yalnız eşyayı değil, bölgeleri ve hatta bazı kavramları da
          fethedebilir. Fethedilen bir gerçek ilahın bütün salahiyet,
          kavram ve simgeleri kullanılabilir hâle gelir; fakat fetih
          kabiliyetleri doğrudan gasp etmez, ancak fethedileni asker
          yapıp kabiliyetlerini kullandırır.
      - yol: "Avcı Yolu"
        mertebe: 1
        pay: kismi
        not: "征服者 → Fatih; Mertebe adında. Hedefin bedeni, zihni ve ruhu teslim olmayı ister; tamamen fethedilen ebediyen sadık kalır"
      - yol: "Avcı Yolu"
        mertebe: 0
        tur_burada: ilahi_hukumranlik
        not: "İlahi Hükümranlık bu salahiyetin daha derin kavramsallaşmasından doğar: bir toprak, bir harp meydanı veya hususi bir saha tamamen fethedildiğinde hükümranlığa dönüşür; oraya giren korumasız her canlı doğrudan Ahmer Hünkar'ın askeri olur"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Conquest"
    not: "Ahmer Hünkar notunda zaten kullanılan karşılıktır; Mertebe 1'in adı (Fatih) aynı kökü taşır."

  - cince: 战争
    pinyin: zhànzhēng
    turkce: Harp
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 0
        pay: tam
        not: "harbi bizzat başlatmasa bile, bakışıyla veya varlığıyla hedef bölgede harp çıkarabilir; ölçeğini, şiddetini ve biçimini belirler"
      - yol: "Avcı Yolu"
        mertebe: 3
        not: "战争主教 → Harp Ruhbanı; Mertebe adında"
      - yol: "Avcı Yolu"
        mertebe: 1
        pay: kismi
        not: "战争统帅 — sınırsız sayıda geçici takım kurabilir; 以偶为兵 fetih ile harbin birleşimidir"
      - varlik: "Cenk Tanrısı"
        not: "tazim ismi — 战争主宰 → 'Harp Hükümdarı'. Kanon bu iddianın karşılıksız olduğunu belirtir; harp Ahmer Hünkar'a aittir (bkz. Harp Ruhbanı notu)"
      - varlik: "Medici"
        not: "melek adı — 战争天使 → 'Harp Meleği'"
    dogrulama: yazar_qa
    not: >-
      战 (Cenk) ayrı tutulur ve yalnızca 战神'nin adına, yani Cenk
      Tanrısı'na ayrılmıştır; gerekçe Harp Ruhbanı notundadır. Ayrım
      kanonik bir ihtilafı görünür kılar.

  - cince: 毁灭
    pinyin: huǐmiè
    turkce: Helak
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          en üst hâlinde bir gezegeni paramparça eder, en alt hâlinde bir
          gerçek ilahı öldürür; zaaf tespitini ve nihai kilitlenmeyi de
          içerir. Bu salahiyetle öldürülen, hususi ve önceden yapılmış
          bir tertip yoksa diriltilemez.
      - yol: "Avcı Yolu"
        mertebe: 1
        not: "毁灭之矛 — Biçme'nin bu Mertebedeki nitelik değişimi; tek hedefe veya bir sahaya uygulanabilir, suret ve izdüşümler üzerinden asla tesir eder"
      - yol_grubu: "Helak Felaketi"
        not: "毁灭天灾 — yol grubu adında"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Destruction — 灾难 (Yıkım) ile karışır"
    not: >-
      Yol grubunun adından (毁灭天灾 → Helak Felaketi) devralınan
      karşılıktır.
      Kanon 毁灭 ile 战斗'yi (Combat) ayırır: Combat muharebe fiiliyle
      elde edilir ve ona tâbidir, 毁灭 ise hem bir fiil hem başlı başına
      bir hâldir; ikisi Mertebe 0 salahiyeti olarak eşit sayılsa da
      Combat, 毁灭 simgesinden aşağıdadır.

  - cince: 祭祀
    pinyin: jìsì
    turkce: Kurban
    tur: salahiyet
    durum: tamam
    sistem_kural: [3, 10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          bir yıldız sistemi içindeki her kurban ayinine tesir edebilir;
          kuvvet menşelerinden (Sefirot) kudret veya izdüşüm talep
          edebilir. Bu, daima o menşenin tencîsinin eşiğinde yürümek
          demektir.
      - yol: "Avcı Yolu"
        mertebe: 3
        not: "kâfi kurban sunduktan sonra her harpte bir kez Harbin Cevherine yakarabilir"
      - yol: "Avcı Yolu"
        mertebe: 2
        not: "haftada bir kez yakarabilir; büyük bir harpte ölçüyü aşan kurban sunarak kısa süre Mertebe 1 seviyesine yaklaşabilir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Sacrifice — 牺牲 (Feda) ile aynı kelimeye düşer"
    not: >-
      祭 ailesi tek Türkçe aileyi taşır: 祭祀 Kurban, 祭司 Rahip,
      主祭 Başrahip (bkz. Kural 3). 牺牲 ise ayrı bir terimdir ve
      'Feda' ile karşılanır; o satırdaki gerekçeye bakınız.
      Ahmer Hünkar'ın Mertebe 0 adı bu salahiyetle Fetih'i birleştirir;
      'Hünkar' tercihinin gerekçesi budur.

  - cince: 魅力
    pinyin: mèilì
    turkce: Cazibe
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 0
        pay: kismi
        not: "Fetih ile ortak yaşar; her Ahmer Hünkar erkeklerin en cazibelisidir"
      - yol: "Avcı Yolu"
        mertebe: 2
        not: "insanların ona tâbi olmak ve sadık kalmak istemesi; faal bir cazibe değildir (bkz. Musahhir notu)"
      - yol: "Suikastçı Yolu"
        mertebe: 0
        pay: tam
        not: "kavram düzeyinde cazibe; her şeye karşı aşırı bir meftunluk, ayrılamama ve sahiplenme hissi doğurur. Yüce Kadimler bile tesir altında kalır"
      - yol: "Suikastçı Yolu"
        mertebe: 5
        not: "Yeis öncesinde cazibe faal bir kabiliyet hâline gelir; tek bakış veya söz yeterlidir"
    dogrulama: yazar_qa
    not: "Musahhir notunda zaten kullanılan karşılıktır."

  - cince: 天气
    pinyin: tiānqì
    turkce: Hava
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 2
        pay: kismi
        not: >-
          天气术士 → Musahhir. Bölgesel havayı değiştirir, aşırı hava
          şartları yaratır. Kudreti kendinde toplamak yerine maiyetine
          dağıtmak daha tesirlidir: bir kelebeğin kanat çırpışı kasırgaya
          döner.
    dogrulama: yazar_qa
    not: >-
      Denizci Yolu'nun 风 (Rüzgâr) salahiyetiyle karıştırılmamalı: 天气
      hava hâllerinin bütünüdür (fırtına, dolu, kar, sis), 风 ise tek
      başına rüzgârdır.

  - cince: 集众
    pinyin: jízhòng
    turkce: Toplama
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 3
        not: "üst Mertebe Ahmer Hünkar kudreti harbe aittir ve harp, kalabalığı toplama sanatıdır; bu Mertebenin salahiyeti budur"
      - yol: "Avcı Yolu"
        mertebe: 1
        not: "toplanan kuvvet belli bir sayıya ulaşınca nitelik değiştirir; en güçlü hâli Yegânelik faaliyetine yaklaşır"
    dogrulama: yazar_qa
    not: "Musahhir notunda zaten kullanılan karşılıktır."

  - cince: 男性
    pinyin: nánxìng
    turkce: Rical
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 0
        pay: kismi
        not: >-
          Aslî Yaradan'ın eril cihetini ve Yang kuvvetini temsil eder.
          Canlı cansız her şeyi erkeğe dönüştürüp değişen derecelerde
          üreme kabiliyeti verebilir; Ahmer Hünkar erkeklerin en güçlüsü
          ve en döllüdür.
    dogrulama: yazar_qa
    not: >-
      Şeytaniçe Yolu'nun 女性 (Nisvan) salahiyetiyle çift oluşturur ve
      Türkçede de çift olarak seçilmiştir: ikisi de Arapça çoğul insan
      adıdır ve aynı vezinde durur. Kaynak da ikisini 男性/女性 olarak
      simetrik verir (Kural 11 onarımı).
      Kanon Ahmer Hünkar ile Şeytaniçe'nin gerçek ilahlarından doğan
      çocukların ikiz olduğunda bir kız bir oğlan olmasını tabii sayar;
      çift bu düzeyde de işler.

  - cince: 混沌
    pinyin: hùndùn
    turkce: Heyûlâ
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Suikastçı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          çekirdek salahiyet; her şeyin heyûlâya dönmesi ve asla rücû
          etmesi. Helak ve nihayet simgesinin bir kolu olup Ölüm, Ebedi
          Zulmet, Zeval, Bozgun, Katliam ve Tefessüh gibi öbür son
          biçimlerinden ayrıdır. Dengeli ve kararlı bir hedefe doğrudan
          uygulanamaz: önce afet çöküşü, sonra Kıyamet ile tezatların
          toptan patlaması, ancak ondan sonra heyûlâ girdabı kurulur.
      - varlik: "Kadim Kadir-i Mutlak"
        not: "混沌海 → Heyûlâ Deryası; grubun Sefirot'u. 混沌原胎 → Heyûlâ Rahmi"
      - varlik: "Heyûlânın Oğlu"
        not: "混沌之子 → Heyûlânın Oğlu; adı salahiyetin kelimesini taşır"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Chaos — 混乱 (Fitne) ile aynı kelimeye düşer"
    not: >-
      混沌 ile 混乱 ayrı terimlerdir: ilki yaratılıştan önceki, biçimsiz
      ve bütün imkânları barındıran ilksel hâl, ikincisi kurulu nizamın
      bozulup karışıklığa düşmesi (Fitne, bkz. Kural 5). İngilizce
      ikisine de Chaos der.
      'Hercümerç' bırakıldı: herc ü merc, önceden düzenli olanın
      altüst olmasıdır ve 原胎 (rahim) gibi bir bileşiği taşıyamaz.
      'Heyûlâ' (hyle, ilk madde) bütün suretleri kuvve hâlinde
      barındıran biçimsiz cevheri adlandırır ve Heyûlâ Deryası'nın
      tarifine (bütün renkleri ve bütün imkânları kapsayan derya)
      birebir oturur.

  - cince: 原初
    pinyin: yuánchū
    turkce: Asliyet
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Suikastçı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Heyûlâ son ise Asliyet başlangıçtır. Aslî Yaradan'ın nisvani
          ciheti olarak hem başlangıcın hem sonun salahiyetini taşır;
          ikisi Yaradan mertebesinde tek şeye dönüşür. Şimdiki hâlinde
          sükûn, duraklama ve kudret demektir; altında Taşlaştırma ve
          Kara Büyü bulunur.
    dogrulama: yazar_qa
    ingilizce_tuzak: "Primordium"
    not: >-
      Tazim isminde geçen 'Ayinedeki Aslî Yaradan' satırı ayrı bir
      terimi (最初造物主) karşılar ve varlığı adlandırır; bu satır ise
      bir salahiyettir. 'Asliyet' aynı kökü paylaşarak aynadaki
      akrabalığı görünür kılar, fakat isim ile salahiyeti ayrı tutar.

  - cince: 疾病
    pinyin: jíbìng
    turkce: Hastalık
