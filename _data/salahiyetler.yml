    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        pay: tam
        not: "时空之王 ile 诡异 simgelerinin karışmasından doğar. Mazi değiştirilemez ve tarih çoktan gerçekleşmiştir, fakat Soytarı onu bir dereceye kadar maskaraya çevirebilir"
      - yol: "Kâhin Yolu"
        mertebe: 3
        not: "Mazinin Alimi; Mazinin Dehlizleri'nden ödünç alma, izdüşüm çağırma ve saklanma"
    dogrulama: yazar_qa
    not: >-
      'Mazi' bu yol grubunun geçmiş kelimesidir ve yükseltilmiş kayıtta
      genel olarak kullanılır: Mazinin Alimi (Mertebe 3), Mazinin
      Dehlizleri / Mazi Sisi (历史虚空), Mazi İzdüşümü (历史投影).
      Düz 'Tarih' reddedildi: nötr ve modern kalıyor, ayrıca kurulu
      terimlerle çakışıyordu.

  - cince: 命运
    pinyin: mìngyùn
    turkce: Kader
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [愚弄]
        not: "愚弄 salahiyetinin kapsadığı kısmi salahiyetlerden biri"
      - yol: "Kâhin Yolu"
        mertebe: 2
        not: "命运卡壳 — istikbale tesir edip bir şeyin ihtimalini artırıp azaltabilir; 命运道标 simgesinden türer"
      - yol: "Canavar Yolu"
        not: "命运之轮 → Kader Çarkı; Mertebe 0 adı ve tarot kartı"
      - yol: "Canavar Yolu"
        mertebe: 0
        pay: kismi
        not: >-
          "命运"象征'den türeyen çekirdek salahiyet; kanon bunun tam bir
          salahiyet olmadığını, başka Yolların da parçalarını taşıdığını
          vurgular. Kader Çarkı kaderin tecessümüdür — hem Hüsn-ü Talih
          hem Kemtalih — ve bilhassa İstişraf'ta mahirdir. Kader
          Nehri'nde serbestçe dolaşır; onu maskaraya çevirmek kaderi
          maskaraya çevirmektir.
      - yol: "Canavar Yolu"
        mertebe: 2
        pay: kismi
        not: >-
          先知 → Münadi; astları Hüsn-ü Talih, Kemtalih ve İstişraf'tır.
          福祸之言 ile otuz kilometre içindeki canlılara talih yahut
          kemtalih verir; 命运启示 ile Kader Nehri'ne bakıp ilham alır.
      - varlik: "Işık Miftahı"
        not: "tazim ismi — 'Kaderin Tecessümü'; Aslî Yaradan'dan doğrudan gelen Yüce Kadim olarak Aslî Yaradan'ın kaderini de simgeler"
    dogrulama: yazar_qa
    not: >-
      'Mukadderat' aynı kökten (ق-د-ر) gelen çoğul biçimdir ve tazim
      isimlerinde kullanılır ('Mukadderata nazar eden Gözler',
      'Backlund'daki Cümle Mukadderatın Şahidi'). Bölünme değildir;
      tek terimin iki biçimi (krş. Tereddi/Mütereddi, Mevt/Mevtâ).

  - cince: 时间
    pinyin: shíjiān
    turkce: Zaman
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
