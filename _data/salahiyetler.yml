      - yol: "Suikastçı Yolu"
        mertebe: 4
        not: "绝望魔女 → Yeis; Hastalık'ın kuvvetlenmiş hâli"
    dogrulama: yazar_qa
    not: "疾病 (Hastalık) ile ayrı tutulur; kaynak ikisini ayrı salahiyet olarak sayar."

  - cince: 愚弄
    pinyin: yúnòng
    turkce: Maskaralık
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Soytarı'nın iki çekirdek salahiyetinden biri; 盲目痴愚 simgesi
          buna karşılık gelir. Asıl tesiri 弄假成真'dır: yalanı hakikate
          çevirmek. Tarih, Zaman, Kader, Değişim ve Sırrakadem
          salahiyetlerinin bir kısmını kapsar.
      - yol: "Kâhin Yolu"
        mertebe: 0
        not: "zamanı maskaraya çevirip hadiselerin sırasını karıştırabilir; tarihi maskaraya çevirip bir saniye önceki kendisi ile sonraki kendisini ayırabilir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Fooling — 痴愚 (Ahmaklık) ve 欺瞒 (aldatma) ile karışır"
    not: >-
      Fiil hâli 'maskara etmek' / 'maskaraya çevirmek'; salahiyet adı
      isim hâlini alır ve ikisi tek terimdir (krş. Şirazesizlik).
      KABUL EDİLEN KAYIP: 愚弄, 痴愚 (Kör Ahmaklık) ve 愚者 (Soytarı)
      ile 愚 karakterini paylaşır. Türkçede bu ortaklık kurulmadı:
      ح-م-ق kökünden türetilecek bir karşılık (tahmik) 'aptallaştırmak'
      demektir, oysa 弄 oynamak, alay etmektir ve salahiyetin tarifi
      yalanı hakikat kılmaktır. İki terim ayrı iş görür; ortak kök
      birini bozardı.

  - cince: 重组
    pinyin: chóngzǔ
    turkce: Terkip
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Soytarı'nın ikinci çekirdek salahiyeti; 变化 ve 诡异
          simgelerinin karışmasından doğar. Kendisi dâhil, aralarında
          hiçbir bağ bulunmayan somut şeyleri ve soyut kavramları
          yeniden birleştirir. Doğrudan kavramın, hatta salahiyetin
          kendisinin üzerinde işler.
      - yol: "Kâhin Yolu"
        mertebe: 1
        not: "诡秘侍者 → Esrar Hadimi; 变化 alanının salahiyeti olarak tezahür eder"
      - yol: "Kâhin Yolu"
        mertebe: 7
        tur_burada: kabiliyet
        not: "伤害转移 (Hasar Nakli) bu salahiyetin astı ve hususi bir uygulamasıdır"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Reassembly / Tampering / Grafting"
    not: >-
      Kanonik ad budur; 嫁接 (Aşılama) aynı salahiyetin Klein
      tarafından konmuş adıdır (bkz. o satır).

  - cince: 嫁接
    pinyin: jiàjiē
    turkce: Aşılama
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 1
        not: "Klein'ın 重组 salahiyetine kendi verdiği ad (Bölüm 1278); henüz hakiki Esrar Hadimi olmadığı ve karşılık gelen gizemcilik bilgisine erişmediği için kendisi adlandırmıştır"
    dogrulama: metin
    not: >-
      Kelimenin sıradanlığı kasıtlıdır ve kaynaktan gelir: 嫁接 Çincede
      bahçıvanlığa ait bir kelimedir (aşı yapmak) ve Klein onu teknik
      bilgisi olmadığı için mecazen seçer. 'Rapt' gibi klasik ve teknik
      bir karşılık bu boşluğu siler; oysa Terkip ile Aşılama arasındaki
      register farkı metnin kendi kurduğu şeydir.

  - cince: 奇迹
    pinyin: qíjì
    turkce: Mucize
