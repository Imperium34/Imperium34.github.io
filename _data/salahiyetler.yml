  - cince: 海洋
    pinyin: hǎiyáng
    turkce: Derya
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Denizci Yolu"
        mertebe: 0
        ust_salahiyet: [水]
      - yol: "Denizci Yolu"
        mertebe: 3
        pay: kismi
        not: "大海之怒 — bütün deniz sahası hedefi dışlar,海啸 gibi yollarla engeller ve saldırır"
      - yol: "Denizci Yolu"
        mertebe: 9
        not: "海眷者 (kadim ad) → Derya Hâmisi"
      - yol: "Denizci Yolu"
        mertebe: 5
        not: "海洋歌者 → Derya Ozanı; Mertebe adında"
      - varlik: "Tiran"
        not: "tazim ismi — 海之皇 → 'Deryaların İmparatoru'"
    dogrulama: yazar_qa
    not: "Heyûlâ Deryası ve Külli Şuur-altı Deryası'ndaki 'Derya' bu satırın kelimesidir; o terimler 海 taşımaz fakat Türkçede aynı su-kütlesi kaydını paylaşırlar."

  - cince: 威慑
    pinyin: wēishè
    turkce: Heybet
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Denizci Yolu"
        mertebe: 0
        ust_salahiyet: [暴君]
        not: "歌唱 kabiliyeti bu ve kardeş salahiyetlerden türer"
    dogrulama: yazar_qa
    not: "Korkutarak boyun eğdiren azamet; 恐惧 (Dehşet) saf korkudur, 威慑 ise itaat doğuran haşmettir."

  - cince: 愤怒
    pinyin: fènnù
    turkce: Hiddet
