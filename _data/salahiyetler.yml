      - yol: "Kâhin Yolu"
        mertebe: 2
        not: "奇迹师 → Mucizekâr; Mertebe adında. Dilek kabiliyeti bu salahiyetten doğar"
      - yol: "Kâhin Yolu"
        mertebe: 1
        not: "alt veya aynı seviyedeki kabiliyetlere dayanmadan doğrudan tesir eder"
    dogrulama: yazar_qa
    not: "Mertebe 2'nin adında (Mucizekâr) zaten kullanılan karşılıktır."

  - cince: 历史
    pinyin: lìshǐ
