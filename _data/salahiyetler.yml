        not: "变化 simgesine ait salahiyetlerden biri"
      - yol: "Kâhin Yolu"
        mertebe: 6
        not: "Suretsiz; bedenini ve etini serbestçe biçimlendirip herkes olabilir"
    dogrulama: yazar_qa
    not: "Mertebe 6'nın adı (Suretsiz) aynı kökü taşır."

  - cince: 灵界掌控者
    pinyin: língjiè zhǎngkòngzhě
    turkce: Âlem-i Ervah Mutasarrıfı
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Hakiki Âlem-i Ervah Hâkimi Esrarın Hükümdarı'dır ve tam sütun
          simgesini o taşır; Soytarı ise salahiyetlerin çoğuna hükmeder
          ve neredeyse küçük bir Âlem-i Ervah Hâkimi sayılır. Ruhani
          Beden İplikleri ve Ruhaniyet İplikleri bu salahiyetin
          uygulamalarıdır. Âlem-i Ervah'ı mühürleyemez; bunu ancak Kapı
          ile birleşerek bir ölçüde başarır.
    dogrulama: yazar_qa
    not: >-
      Esrarın Hükümdarı'nın tazim isminde 灵界之主 → 'Âlem-i Ervah
      Hâkimi' bulunur; iki unvan ayrı tutulur. 'Mutasarrıf' tasarruf
      edeni bildirir ve hükmedenden bir derece aşağıdadır — kaynağın
      kurduğu ast-üst ilişkisini karşılar (krş. Âlem-i Misal Hükümdarı /
      Müdebbiri).

  - cince: 命运锚点
    pinyin: mìngyùn máodiǎn
    turkce: Kader Çıpası
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        ust_salahiyet: [命运道标]
        not: >-
          Kaderi son derece güç değiştirilir; kendini tutmadıkça
          söyledikleri Kader Nehri'nin istikbaldeki akışında bir düğüm
          noktasına dönüşür. Söylediği her şey gelecektir, fakat
          gerçekleşme biçimi ve nihai netice istediği gibi olmayabilir,
          hatta fena hâlde çarpılabilir.
    dogrulama: yazar_qa

  - cince: 隐秘
    pinyin: yǐnmì
    turkce: Sırrakadem
    tur: salahiyet
    durum: tamam
    sistem_kural: [8, 10, 11]
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [愚弄]
        not: >-
          愚弄'un kapsadığı kısmi salahiyetlerden biri; ayrıca 诡异
          simgesi kavranamazlığı içerdiği için kendiliğinden bir miktar
          Sırrakadem barındırır ve Soytarı sembolündeki gizlilik unsuru
          buradan gelir. 诡秘之境 (Esrar Diyarı) bu salahiyetin
          tecessümüdür.
      - yol: "Kâhin Yolu"
        mertebe: 4
        not: "Garabet Efsuncusu kendi Mertebesini aynı veya alt seviyedeki Yargı Yolu Aşkınlarından gizleyebilir; Aşkın olduğunu gizleyemez"
      - yol: "Uykusuz Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Cümlenin Vahdeti simgesine bağlıdır; her cihetten izleri
          gizler, ilgili gözetleme ve kehaneti yanıltır, her şeyi sır edip
          yahut sırrı kaldırabilir. Gizli mahalleri Sırrî Âleme
          çevirebilir; bu hem İlahi Hükümranlık hem mühür mahalli olur.
      - yol: "Uykusuz Yolu"
        mertebe: 2
        not: "隐秘之仆 → Sır Hadimi; Mertebe adında. Hedefi dışarıdan sezilemeyen bir sır hâline sokar, tersini de yapar (逆隐秘化)"
      - yol: "Uykusuz Yolu"
        mertebe: 4
        not: "Gece Bekçisi hedefin mistik bağlarını ve suretini karanlıkla örterek sır edebilir"
      - yol: "Okur Yolu"
        not: "洞察 (Temyiz) ile karşılıklı men ilişkisi: Temyiz bazen Sırrakadem'in örtüsünü deler, bazen ona takılır"
      - yol: "Çırak Yolu"
        mertebe: 0
        not: "kendisiyle ilgili şeylerin doğrudan söylenememesini sağlar; kanon bunu Karanlık'ın Sırrakadem salahiyetine benzetir"
      - yol: "Çırak Yolu"
        mertebe: 4
        not: "秘法师 → Sır Efsuncusu; 守秘 (sır tutma) ile sırları gizler, sezgiyi perdeler, kristal küreyi kırarak bizzat sır hâline gelir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Concealment"
    not: >-
      Fiil hâli 'sır etmek' (izlerini sır etti); salahiyet adı isim
      hâlini alır ve ikisi tek terimdir (krş. Maskaralık / maskara
      etmek, Şirazesizlik / şirazesini yitirmek).
      'Sır' kökü Kural 8 gereği zaten Esrarın Hükümdarı grubuna ve o
      gruba doğrulanmış bağla bağlı Mertebelere ayrılmıştır; 隐秘之仆
      (Sır Hadimi) bu terimin kendisini taşır, dolayısıyla karşılık
      icat değil, kurulu adla tutarlılıktır (Kural 11 onarımı).
      'İhfa' ve خ-ف-ي kökünden gelen karşılıklar reddedildi: 'Hafi'
      Kural 8 gereği Kadir-i Mutlak grubunundur. 'Gizleme', 'Setr' ve
      'Ketm' de değerlendirildi; hiçbiri kurulu 'Sır' adıyla bağ
      kurmuyordu. 'Ketm' sonradan ayrı bir terime, 隐匿'ya verildi.

  - cince: 伤害转移
    pinyin: shānghài zhuǎnyí
    turkce: Hasar Nakli
    tur: kabiliyet
    durum: tamam
    gecisler:
      - yol: "Kâhin Yolu"
        mertebe: 7
        tezahuru: [重组]
        not: "Hokkabaz'ın dokuz büyü-benzeri kabiliyetinden biri; kanon bunu 重组 salahiyetinin astı ve hususi bir uygulaması sayar"
      - yol: "Kâhin Yolu"
        mertebe: 4
        not: "yaralar ve hastalıklar kâğıt bedele nakledilebilir"
      - yol: "Kâhin Yolu"
        mertebe: 3
        not: "illet, lanet, tenebbü, saldırı ve nazarın bir kısmı kâğıt bedele nakledilir"
    dogrulama: yazar_qa

  - cince: 窃取
    pinyin: qièqǔ
    turkce: Sirkat
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Yolun çekirdek salahiyetlerinden biri ve başlıca simgelerinden.
          Kusur bir gerçek ilahla karşılaştığında salahiyetin tamamını,
          astları dâhil, çalabilir. Kanon Sirkat'i 不可思议 (Garabet)
          simgesinin içinde sayar; bu yüzden suretten çalmak asıldan
          çalmakla aynıdır.
      - yol: "Kapkaççı Yolu"
        mertebe: 2
        pay: kismi
        not: "kader, bağ, kimlik, benlik idraki ve Aşkın Hasletleri çalınabilir; Kader Aşılaması ile iki hedefin kaderi takas edilir"
      - yol: "Kapkaççı Yolu"
        mertebe: 1
        not: "zaman, çıpa ve salahiyet çalınabilir; bir salahiyet çalındığında bütünüyle çalınır"
      - yol: "Kapkaççı Yolu"
        mertebe: 6
        not: "盗火人 → Ateşçalan; elli metre içinde hedefin aşkın kabiliyetini on dakikalığına çalar"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Theft / Stealing"
    not: >-
      Fiil hâli 'çalmak'. 'Gasp' reddedildi: açık ve zorla el koymayı
      bildirir, oysa 窃 gizlice almaktır ve Yolun karakteri doğrudan
      çatışma değil zamanlamadır (bkz. Kapkaççı notu). 'Sirkat'
      Mertebe adlarının kurduğu hat ile aynı registerdedir.

  - cince: 欺诈
    pinyin: qīzhà
    turkce: Tedlis
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          tabiat kanunlarını, dünyanın kaidelerini ve mistik bağları
          tedlis edebilir; kendi kendini dahi tedlis ederek içgüdüsünü
          kandırabilir
      - yol: "Kapkaççı Yolu"
        mertebe: 2
        not: "meleklerin uymak zorunda olduğu gizemcilik kanunlarını dahi yanıltabilir; Sirkat ile birlikte kullanılabilir"
      - yol_grubu: "Esrarın Hükümdarı"
        not: "grubun simgelerinden biridir"
      - varlik: "Amon"
        not: "tazim sıfatı — 狡诈之神 ve 恶作剧之神 → 'Hilekârlık ve Aldatmaca İlahı'; 狡诈 bu salahiyetle 诈 karakterini paylaşır"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Deceit / Deception / Fraud — 欺瞒 ile aynı kelimelere düşer"
    not: >-
      تدليس klasik hukukta satılan maldaki kusuru gizleyip sağlam gibi
      göstermektir; Kusur'un 以假代真 (sahteyi hakikatin yerine koymak)
      mekanizmasını doğrudan karşılar ve kaide açığı istismarına dayanan
      bir Yol için hukukî kayıt isabetlidir.
      Astı olan 欺瞒 'Tadlil' ile karşılanır; iki kelime Türkçede yakın
      vezindedir ve kaynağın 欺 üzerinden kurduğu ast-üst ilişkisini
      taşır.
      AD KATMANI: 诈 ailesi Çincede salahiyeti, Amon'un sıfatını (狡诈)
      ve Mertebe 8'i (诈骗师) birbirine bağlar. Türkçede bağ kelime
      düzeyinde değil tema düzeyinde taşınır: salahiyetler klasik
      kayıttadır (Tedlis, Tadlil), ad ve sıfatlar okunaklı 'hile'
      ailesindedir (Hile Mürşidi, Hilekârlık ve Aldatmaca İlahı).
      'Hile' Çırak Yolu'nda da bulunur (Hilebaz). İki Yol Esrarın
      Hükümdarı altında komşudur ve komşu Yolların alt Mertebelerde
      ortak bir dağarcık taşıması beklenir; Hilebaz'ın rol ifası
      ilkesinin aldatma olması bu komşuluğun tezahürüdür.
  - cince: 错误
    pinyin: cuòwù
    turkce: Kusur
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 13]
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          错误 → Kusur; Mertebe 0 adı. Kaidelerdeki gediğin kendisi,
          dünyadaki bütün hataların tecessümü. Şartları: vasıta ile
          hedefin yeterince benzemesi, aralarında bir bağ bulunması,
          mantıkî çelişki olması, kaidenin eksik olması, yahut doğrudan
          tesir yerine kusurlu bir çevre (İlahi Hükümranlık) kurulması.
          Esrarın Hükümdarı'nın 变化 simgesinin köşe taşlarından biridir:
          tabii değişim, kusurlu değişim ve kavranamaz değişim.
    dogrulama: yazar_qa
    not: >-
      'Bug' çevrilmez: kaynakta menşei meçhul, yabancı bir kelime olarak
      takdim edilir ve Amon'un Dünya kökenini ele veren olay örgüsü
      unsurudur (bkz. Kusur girdisi).

  - cince: 漏洞
    pinyin: lòudòng
    turkce: Gedik
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 2
        not: "dünyanın nizamındaki ve kaidelerindeki gedikleri istismar eder; her şey nispîdir ve hepsinin gediği vardır"
      - yol: "Kapkaççı Yolu"
        mertebe: 1
        not: "zaman haddi veya şartı bulunan her yerde istismar edilebilir bir gedik vardır"
      - yol: "Kapkaççı Yolu"
        mertebe: 0
        not: "Kusur, kaidelerdeki gediğin kendisidir"
      - varlik: "Amon"
        not: "tazim ismi — 规则的漏洞 → 'Kaidelerdeki Gedik'"
    dogrulama: yazar_qa
    not: >-
      Tazim isminde zaten kullanılan karşılıktır. 规则 → Kaide ile
      birlikte okunur; 秩序 (Nizam) ve 规律 (Mizan) ayrı terimlerdir.

  - cince: 空间
    pinyin: kōngjiān
    turkce: Mekan
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [时空之王]
        not: "zaman ve mekan salahiyetleri tamamen ayrılamadığı için kısmî olarak bulunur"
      - yol: "Çırak Yolu"
        mertebe: 0
        pay: tam
        not: "Kapı'nın asli salahiyeti; mekan kafesi yaratır, mekanı çökertip yok eder, her mekâna anında varır, yeni ayrı âlemler açar. Astı 传送 (Tayy-ı Mekân)"
      - yol: "Çırak Yolu"
        mertebe: 4
        not: "空间隐藏 — bir sahayı ikiye bölüp bir kısmını gizler; çıkış ancak kapıdan yahut gizlemeyi kaldırarak olur"
      - yol: "Çırak Yolu"
        mertebe: 3
        not: "撕裂空间 — temasla boşlukta tehlikeli bir yarık açar"
    dogrulama: yazar_qa
    not: "Esrarın Hükümdarı'nın tazim isminde 时空之王 → 'Zaman ve Mekan Sultanı'; terim oradan gelir."

  - cince: 门
    pinyin: mén
    turkce: Kapı
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 13]
    gecisler:
      - yol: "Çırak Yolu"
        mertebe: 0
        pay: tam
        not: >-
          门 → Kapı; Mertebe 0 adı. Kapı kavramının kendisi; Mekan,
          Mühür ve ayrı âlemler salahiyetlerini kapsar. Dünyadaki kapı
          kavramına bağlı her şeyi açıp kapatabilir, böylece mühürleri
          belli bir süre için bozar yahut kuvvetlendirir.
      - yol: "Çırak Yolu"
        mertebe: 9
        not: "开门 — duvarlardan ve engellerden simgesel bir kapı açarak geçmek"
      - yol: "Çırak Yolu"
        mertebe: 3
        not: "Müstekşif hususi kabiliyetler dışında neredeyse bütün bariyerleri aşabilir"
    dogrulama: yazar_qa

  - cince: 封印
    pinyin: fēngyìn
    turkce: Mühür
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Çırak Yolu"
        mertebe: 0
        pay: tam
        not: >-
          mekan kafesiyle sınırlı değildir; zaman ve labirent unsurlarını
          da kapsar. Direnmediği takdirde bir Yüce Kadim'i kısa süre
          mühürleyebilir. Kavramlara da tatbik edilir: bir salahiyeti
          mühürleyip hedefi zayıflatmak, bağları mühürleyerek
          kuvvetlendirmek, hatta muharebe sahasının kaidelerini
          mühürlemek.
      - yol: "Çırak Yolu"
        mertebe: 1
        not: "星之匙 → Yıldız Miftahı; mühürler yıldız ışığı biçimindedir, hasara uğradığında kendini onarır"
      - yol: "Çırak Yolu"
        mertebe: 3
        not: "空间隐藏 geçici bir mekan kafesine dönüşür; bu bir tür mühürdür"
    dogrulama: yazar_qa
    not: "'Mühürlü Eşya' teriminde zaten kullanılan karşılıktır."

  - cince: 复制
    pinyin: fùzhì
    turkce: İstinsah
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Çırak Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Âlem-i Ervah'a bağlı, 不可思议 (Garabet) simgesinden doğan
          salahiyet. Bir gerçek ilahın salahiyetlerini, karşılık gelen
          simgelerini istinsah etmeden kopyalayabilir. Yegânelik
          istinsah edilemez.
      - yol: "Çırak Yolu"
        mertebe: 2
        pay: kismi
        not: "旅法师 → Âlem Seyyahı; kâfi derecede anlaşılmış nesneler doğrudan istinsah edilir, kayda gerek kalmaz. Salahiyetleri dahi istinsah edebilir — Keşiş'in Marifet salahiyeti ve Beyaz Kule'nin Taklidi bunu yapamaz"
      - yol: "Gizem Avcısı Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [神秘知识]
        not: "Gizem Marifeti'nin astlarından biri"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Replication / Recreation"
    not: >-
      'İstinsah' bir nüshayı aynen çıkarmaktır ve Mertebe 6'nın adı
      (Kâtip ← 记录官) ile aynı kayıtta durur; kanon 记录 ile 复制'yi
      'kopyala-yapıştır' benzetmesiyle birlikte anar ve ikisini Beyaz
      Kule'nin 模仿'sinden (tersine mühendislik) ayırır.

  - cince: 记录
    pinyin: jìlù
    turkce: Kayıt
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Çırak Yolu"
        mertebe: 6
        not: >-
          记录官 → Kâtip; Mertebe adında ve çekirdek kabiliyeti. Ruhu
          kalem, Ruhani Bedeni kâğıt gibi kullanır; gördüğü aşkın
          kabiliyetin gizemci sembollerini kaydeder ve bir kez
          kullanmak üzere saklar. Efsunu "Geldim, gördüm, kaydettim"dir.
      - yol: "Çırak Yolu"
        mertebe: 4
        not: "yalnız kabiliyetleri değil, varlıkların 'hâl'lerini de kaydedebilir"
    dogrulama: yazar_qa
    not: >-
      复制 (İstinsah) ile ayrı tutulur: Kayıt önce görmeyi ve saklamayı
      gerektirir, İstinsah ise kâfi anlayış varsa doğrudan yapılır.
      Beyaz Kule'nin 模仿'si (Taklit) her ikisinden de ayrıdır.

  - cince: 定位
    pinyin: dìngwèi
    turkce: Mevki
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Çırak Yolu"
        mertebe: 1
        pay: tam
        not: >-
          星之匙 → Yıldız Miftahı; kendi mevkisini asla yitirmez, hasmın
          mevkisini bulmasını engeller ve onu mevkisiz bırakır. Âlem-i
          Ervah'taki malumat yahut eşya arasındaki mistik bağlar
          üzerinden istediği her şeyin mevkisini tespit eder.
      - yol: "Çırak Yolu"
        mertebe: 5
        not: "旅行家 → Gezgin; bulunduğu mevkiyi teşhis eder"
      - yol: "Çırak Yolu"
        mertebe: 0
        not: "Mevki salahiyeti yalnız Mekan alanını değil, Zaman, Kader ve Zihin alanlarını da kapsar; Kaderin Mihenk Taşı simgesinin köşe taşıdır"
    dogrulama: yazar_qa

  - cince: 厄难
    pinyin: ènàn
    turkce: Şeamet
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Uykusuz Yolu"
        mertebe: 1
        pay: tam
        not: "厄难骑士 → Şeamet Süvarisi; Mertebe adında. Hasma şeamet verir; ülke çapında şeamet mümkündür — bir ulusun talihinin tabii afetlerle birlikte çökmesi yahut her vatandaşını saran uğursuzluk"
      - varlik: "Ebedi Gece Tanrıçası"
        not: "tazim ismi — 'Şeamet ve Dehşet Ecesi'"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Misfortune — 厄运 (Kemtalih) ile aynı kelimeye düşer"
    not: >-
      厄难 ile 厄运 ayrı terimlerdir ve İngilizce ikisine de Misfortune
      der. 厄难 = 厄 (sıkıntı) + 难 (afet); ikinci karakter Şeytaniçe'nin
      灾难'ında (Afet) da bulunur. 厄运 = 厄 + 运 (talih) ve düz
      uğursuzluktur, 'Kemtalih' ile karşılanır.
      Şeamet Süvarisi'nin notu bu bağı Tanrıça'nın tazim ismi üzerinden
      gerekçelendirir; iki yer aynı terimi taşır.

  - cince: 厄运
    pinyin: èyùn
    turkce: Kemtalih
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Uykusuz Yolu"
        mertebe: 0
        pay: tam
        not: "厄运和灾难 — kemtalih yoluyla afet getirir; salahiyeti Şeytaniçe, Ahmer Hünkar ve Kader Çarkı Yollarınınkiyle örtüşür"
      - yol: "Uykusuz Yolu"
        mertebe: 4
        not: "守夜人 → Gece Bekçisi; bir dereceye kadar başkalarına kemtalih verebilir, kendi talihindeki değişimi sezer"
      - yol: "Canavar Yolu"
        not: "厄运法师 → Kemtalih Sahiri; Mertebe adında"
      - yol: "Canavar Yolu"
        mertebe: 2
        ust_salahiyet: [命运]
        not: "Kader salahiyetinin üç astından biri"
      - yol: "Canavar Yolu"
        mertebe: 5
        not: "赢家 → Galip; hasma sınırlı kemtalih verir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Misfortune / Bad Luck — 厄难 (Şeamet) ile aynı kelimeye düşer"

  - cince: 灵体
    pinyin: língtǐ
    turkce: Ruh Bedeni
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Uykusuz Yolu"
        mertebe: 0
        pay: tam
        not: "灵体灵性 — ruhların varacağı yer ve onların hükümdarı. Sefahat Ana Tanrıça ile Ölüm'ün salahiyetleriyle örtüşür; Ölüm ölülere, Karanlık tabiat ruhlarına meyleder"
      - yol: "Uykusuz Yolu"
        mertebe: 5
        not: "灵巫 → Ruh Efsuncusu; tabiat ruhlarını ve gazap ruhlarını dişlerine mühürleyip salabilir"
    dogrulama: yazar_qa
    not: >-
      精神体 (Ruhani Beden) ile ayrı tutulur. 魂/灵 ayrımı gereği 灵 →
      Ruh'tur (bkz. Nüve Teskincisi notu); 'Ruh Bedeni' o partisyonu
      doğrudan izler. Ruhani Beden girdisinde reddedilmiş olan bu
      karşılık burada asıl yerini bulur.
      'Latif Beden' değerlendirildi ve reddedildi: el-Latîf
      Esmâ-ül Hüsnâ'dandır ve Kural 7 o kaynağı Kadir-i Mutlak grubuna
      ayırır.

  - cince: 死亡
    pinyin: sǐwáng
    turkce: Mevt
    tur: salahiyet
    durum: tamam
    sistem_kural: [9, 10]
    gecisler:
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          死神 → Ölüm; Mertebe 0 adı. Salahiyet kavram düzeyine çıkar:
          hayat ölür, hafıza ölür, eşya arasındaki bağlar ölür, varlığın
          bıraktığı damga dahi ölür. Aşkın Hasletleri yok edilemez olsa
          da bu salahiyet karşısında kısa süreliğine ölürler.
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 3
        pay: kismi
        not: "摆渡人 → Berzah Kayıkçısı; göz göze geldiği canlı anında ölür, ilahiyet taşısa bile ağır hasar alır. Sol eli ölüme götürür, sağ eli geri getirir"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 2
        pay: kismi
        not: "完全的死亡 — bir sahadaki bütün canlılığı söker; çoğu diriliş ve bedel kabiliyeti karşısında tesirsiz kalır"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 1
        pay: kismi
        not: "死亡宣告 — gördüğü yahut işaret ettiği hedef anında ölür; gerçek ilah altındaki her varlıkta işler"
      - yol: "Çiftçi Yolu"
        mertebe: 0
        pay: kismi
        not: >-
          根源之神 ve 污秽的母巢 simgelerinden türer. 'Anadan geldin, anaya
          dönersin' — meâd ölümdür. Kovan simgesi aynı zamanda tencîse,
          şirazesizliğe ve bedenin meshine de işaret eder.
      - yol: "Çiftçi Yolu"
        mertebe: 3
        not: "抬棺人 → Tabut Hamili; 剥夺生命 (Hayat Selbi) — her vuruş hedefi ölüm imtihanına sokar"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Death"
    not: >-
      Mertebe 0 adı 'Ölüm'dür ve Kural 9 gereği ayrı bir yuvadadır
      (Kural 13: Mertebe 0 adları sade ve yerli kelimelerdir). Bölünme
      değildir.
      'Mevt' ile 亡灵 (Mevtâ) Türkçede aynı kökü paylaşır; kaynak da
      死亡 ile 亡灵 arasında 亡 karakterini paylaşır (Kural 11 onarımı).
      Ebedi Gece Tanrıçası'nın tazim isminde 'Emvatın Hükümdarı' aynı
      kökün çoğul biçimidir.

  - cince: 亡灵
    pinyin: wánglíng
    turkce: Mevtâ
    tur: salahiyet
    durum: tamam
    sistem_kural: [9, 10]
    gecisler:
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 0
        pay: tam
        not: "mevtânın varlık menşei, bütün mevtânın efendisi. Salahiyeti Sefahat Ana Tanrıça ve Karanlık'ınkiyle örtüşür; Ölüm mevtâya, Karanlık tabiat ruhlarına meyleder"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 2
        not: "亡者之王 — kendi küçük Âlem-i Berzah'ında kudretli bir mevtâ ordusu barındırır; melek seviyesindeki habis ruhlar dahi karşısında kırılgandır"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 6
        not: "亡者之语 — Mevtâ Lisanı; bedenin koruduğu eti aşıp doğrudan Ruh Bedene seslenir, iletişimi sevke ve isti'bada çıkarır"
    dogrulama: yazar_qa
    not: >-
      Çoğul biçim 'Emvat' tazim isminde kullanılır ('Emvatın
      Hükümdarı'); aynı terimin iki biçimidir (Kural 9).
      'Ölümsüz' (不死者, Mertebe 4) ayrı bir terimdir ve çakışmaz.

  - cince: 苍白
    pinyin: cāngbái
    turkce: Solgun
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 0
        pay: tam
        not: "solmanın nihayeti, her şeyin rengini yitirmesi; zihin, irade ve aşkın kabiliyetler solgunluk altında yavaş yavaş susar ve ölüm sükûnetine gömülür. Güneş'in arıtması bunu men eder"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 1
        pay: tam
        not: "苍白皇帝 → Solgun İmparator; Mertebe adında. 苍白世界 — bütün renklerin öldüğü, aşkın kabiliyetlerin solduğu bir ülke kurar"
    dogrulama: yazar_qa
    not: >-
      Yalın biçim tercih edildi; bileşiklerde 'Solgun Dünya' gibi
      doğrudan kullanılır, isim gerektiğinde 'solgunluk' türetilir.

  - cince: 奴役
    pinyin: núyì
    turkce: İsti'bad
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 11]
    gecisler:
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 0
        pay: tam
        not: "ruh taşıyan her şeyin isti'bad edicisi"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 1
        not: "灵之主宰 — Ruhların Hükümdarı; kabiliyet değil, isti'bad salahiyetinden türeyen bir hassadır. Ruh taşıyan her varlığı bastırabilir ve kul edebilir"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 2
        not: "Mertebe 2 altındaki aynı Yol Aşkınları emrine karşı koyamaz"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Enslavement"
    not: >-
      'Teshir' değerlendirildi ve reddedildi: تسخير kökü Musahhir'in
      (天气术士, Avcı M2) kelimesidir ve o Mertebenin notu doğrudan bu
      köke dayanır. 奴役 ile 术士 Çincede hiçbir ortaklık taşımadığı
      için bağ icat edilmiş olurdu (Kural 11).
      'Esaret' ve 'Kölelik' kulun hâlini bildirir, efendinin
      salahiyetini değil; 'İsti'bad' fiilin kendisidir.

  - cince: 终点
    pinyin: zhōngdiǎn
    turkce: Menzil
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          her şeyin varacağı yer, bütün hayatın müşterek menzili.
          Salahiyeti Sefahat Ana Tanrıça ve Karanlık'ınkiyle örtüşür.
          Âlem-i Berzah bu salahiyetten, Kapı Yolu'nun kudretine
          dayanılarak türetilmiştir.
      - varlik: "Ölüm"
        not: "tazim ismi — 'Cümle Zîhayatın Nihai Menzili'"
      - varlik: "Toprak Ana"
        not: "tazim ismi — 最终的归宿 → 'Nihai Menzil'; 归宿 burada 终点 ile aynı kelimeyle karşılanır"
    dogrulama: yazar_qa
    not: >-
      归宿 ile 终点 ayrı karakterlerdir fakat Türkçede bilinçli olarak tek
      kelimeyle karşılanır: yazar salahiyeti tarif ederken birini
      öbürüyle açıklar (一切的归宿，所有生命共同的终点) ve kanon bu
      salahiyetin Sefahat Ana Tanrıça ve Karanlık'ınkiyle örtüştüğünü
      belirtir. İkiye bölmek, iki tanrıçanın farklı şeylere sahip
      olduğunu ima ederdi. 归宿 salahiyet değil, yalnız tazim sıfatıdır.
      KABUL EDİLEN KAYIP: 归宿'deki 归, 回归 (Meâd) ile ortaktır; eve
      dönüş nüansı 'Menzil'de taşınmaz. 'Müstakar' değerlendirildi.

  - cince: 冥界
    pinyin: míngjiè
    turkce: Âlem-i Berzah
    tur: salahiyet
    durum: tamam
    sistem_kural: [9, 10]
    gecisler:
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 5
        not: "看门人 → Serhad Bekçisi; Âlem-i Berzah'ın girişini sezer, içindeki mevtâyı sevk eder, 冥界之门'ü kullanır. Ayrıca bedenini kafes yaparak kendine ait küçük bir Âlem-i Berzah kurar"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 4
        not: "不死者 → Ölümsüz; Âlem-i Berzah'a daha sıkı bağlanır, kuvvetini mühürleme ve Âlem-i Ervah geçişi için kullanır"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 2
        not: "terfi ayini: Âlem-i Berzah'ın katlarından birinin hükümdarı olmak yahut bir ülkeyi tamamen mevtâ dünyasına çevirip kapıyı oraya sabitlemek"
      - yol: "Naaş Toplayıcı Yolu"
        mertebe: 0
        not: "终点 (Menzil) salahiyetinden, Kapı Yolu'nun kudretiyle türetilmiştir; içinden Berzah Nehri (冥河) geçer ve o da Ebedi Zulmet Nehri'nin bir kolunun izdüşümüdür"
      - yol: "Çırak Yolu"
        mertebe: 2
        not: "Âlem Seyyahı vasıtasız olarak Âlem-i Berzah'a kapı açabilir; Serhad Bekçisi'nin kabiliyetini istinsah ederek de girebilir"
    dogrulama: yazar_qa
    not: >-
      'Berzah' klasik tasnifte ölüm ile diriliş arasındaki ara âlemdir
      ve 冥界'nin kanonik konumunu karşılar. Âlem adlarındaki kalıba
      uyar (krş. Ruhani Âlem / Âlem-i Ervah, Astral Âlem / Âlem-i
      Misal).
      冥河 → Berzah Nehri; kaynak da iki terimde 冥 karakterini paylaşır
      (Kural 11 onarımı).
      'Ahiret' bu Yolda hiç kullanılmaz: berzahın ötesini bildirir ve
      hiçbir Mertebe oraya geçmez.
      Mertebe 5'in adında 冥 bulunmadığı için orada 'Berzah'
      kullanılmaz; gerekçe Serhad Bekçisi notundadır.

  - cince: 战斗
    pinyin: zhàndòu
    turkce: Cenk
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Savaşçı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          en dehşetli Kudret, en Cesametli suret, en kuvvetli Tahrip,
          en sağlam Muhafaza — bunlar maharet ve tecrübeyle birleşince
          ferdin cengini kurar. Hepsine hükmeden 战神'dir ve hasmını
          maharetinden mahrum bırakıp yalnız içgüdüyle dövüşmeye
          mecbur edebilir. Mertebe 0 salahiyeti olarak Helak ile aynı
          seviyededir fakat Helak'in simgesinden aşağıdadır.
      - yol: "Savaşçı Yolu"
        mertebe: 2
        pay: kismi
        not: "荣耀者 → Şan; sadeleşmiş Cenk salahiyetiyle Mertebe 2 melekleri arasında cephe muharebesinde en mahiridir"
      - varlik: "Cenk Tanrısı"
        not: "战神 — varlığın adı salahiyetin kelimesinden türer"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Combat — 战争 (Harp) ile karışır"
    not: >-
      战 ile 战争 ayrı terimlerdir: 战争 Ahmer Hünkar'ın salahiyetidir ve
      'Harp' ile karşılanır. Cenk Tanrısı'nın tazim isminde 'Harp
      Hükümdarı' (战争主宰) satırının bulunması kanonik bir ihtilaftır ve
      Türkçe ayrım bunu korur (bkz. Cenk Tanrısı ve Harp Ruhbanı
      notları).
      Varlığın adı salahiyetin kelimesini taşır; kaynak da 战神'yi
      "hepsine hükmeden" diye tarif eder (Kural 11 onarımı).

  - cince: 黄昏
    pinyin: huánghūn
    turkce: Alacakaranlık
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 13]
    gecisler:
      - yol: "Savaşçı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          黄昏巨人 → Alacakaranlık Devi; Mertebe 0 adı. 光 (Işık),
          时空 ve 衰败 (Zeval) simgelerinin birlikte türettiği
          salahiyet. Maddeyi, iradeyi ve hatta boşluğu zevale, çöküşe
          ve yokluğa sürükler. Alacakaranlığı dondurabilir, zamanın
          akışını yavaşlatabilir, hedefi hızla yaşlandırıp
          çürütebilir; ömür haddi olan her varlığın dirilişini men eder.
          Güneş Yolu'nun Işık, Kudsiyet ve Güneş salahiyetlerini men
          eder, zira alacakaranlık hepsinin sonudur.
      - yol: "Savaşçı Yolu"
        mertebe: 2
        pay: kismi
        not: "sadeleşmiş Alacakaranlık — kendini hızla yaşlandırıp Âlem-i Ervah'ta yeniden doğabilir; hedefi yaşlandırıp ömrünü azaltabilir. 黄昏巨剑 (Alacakaranlık Kılıcı) Gümüş Şövalye'nin Sim Meçi'nin ileri hâlidir"
      - yol: "Savaşçı Yolu"
        mertebe: 1
        not: "İlahın Eli'nin sağ eli efendisinin hassalarını taşır; Alacakaranlık Devi'ne bağlıysa el turuncu alacakaranlıktan görünür"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Twilight"
    not: >-
      黎明 (Şafak) ile çift oluşturur: kanon Alacakaranlık Devi'nin
      Şafak salahiyetini de taşıdığını, zira sonların başlangıçlara
      tabii olarak bağlı olduğunu belirtir.
      衰败 → Zeval ayrı bir terimdir ve bu salahiyeti türeten üç
      simgeden biridir (bkz. Zeval Hâkimi ve Sefahat Ana Tanrıça tazim
      isimleri).

  - cince: 黎明
    pinyin: límíng
    turkce: Şafak
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Savaşçı Yolu"
        mertebe: 0
        pay: tam
        not: "sonlar başlangıçlara tabii olarak bağlı olduğu için Alacakaranlık Devi bu salahiyeti de taşır. Aşkın Hasletlerini doğrudan arıtabilir, fakat bu arıtma eşit ölçüde tahrip ve zeval yoluyla olur"
      - yol: "Savaşçı Yolu"
        mertebe: 6
        not: "黎明骑士 → Şafak Şövalyesi; Mertebe adında. 黎明铠甲 (Şafak Zırhı), 晨曦之剑 (Şafak Kılıcı), 光之风暴 (Işık Kasırgası)"
    dogrulama: yazar_qa
    not: >-
      晨曦 (şafak vakti aydınlığı) kabiliyet adlarında geçer ve aynı
      kelimeyle karşılanır; 黎明 ile aynı kayıtta durur.

  - cince: 代行
    pinyin: dàixíng
    turkce: Vekâlet
    tur: salahiyet
    durum: tamam
    sistem_kural: [2, 10]
    gecisler:
      - yol: "Savaşçı Yolu"
        mertebe: 0
        pay: kismi
        not: >-
          Ebedi Zulmet Nehri'nin İsti'bad simgesinin bu Yoldaki
          tecellisi. Sermedi Zulmet'in üç Yolu arasında Sefirot'un
          özüne en yakın olan Ölüm, dışına en çok benzeyen Karanlık'tır;
          fakat onu bir parça kullanabilen Alacakaranlık Devi'dir.
      - yol: "Savaşçı Yolu"
        mertebe: 1
        not: >-
          神明之手 → İlahın Eli; Mertebe adında. Biat ettiği ilahı,
          Yegâneliği yahut Yüce Kadim'i temsilen kudret gösterir ve
          ilahî ceza indirir. Bu salahiyet yüzünden başka salahiyet
          edinemez. Kısa ve ölçülü kullanılmalıdır, yoksa aklını
          yitirip hakiki bir kul hâline gelir.
    dogrulama: yazar_qa
    ingilizce_tuzak: "Proxy"
    not: >-
      'Niyabet' değerlendirildi ve reddedildi: 'Naib' bu sözlükte
      神官'ı karşılar (Güneş Naibi, Ozan M7) ve ortak kök kaynakta
      bulunmayan bir bağ kurardı (Kural 11).
      'Zevalin Sol Eli' (衰败左手) aynı alandaki muadilidir.

  - cince: 束缚
    pinyin: shùfù
    turkce: Pranga
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 11]
    gecisler:
      - yol: "Mahkûm Yolu"
        mertebe: 0
        pay: tam
        not: >-
          被缚者 → Prangalı; Mertebe 0 adı aynı kökü taşır. Cinnetin,
          arzuların, nesnelerin, canlıların ve Aşkın Hasletlerinin
          temayüllerini bağlayabilir yahut mühürleyebilir. Mühür
          derecesine varmayan hususlarda Kapı'dan üstündür; mühürde ise
          Kapı ondan üstündür. Tersine, başkalarını prangasız bırakıp
          itidali terk ettirebilir — bu, 放纵 (Sefahat) salahiyetinin
          Pranga içinde toplanmış hâlidir.
      - yol: "Mahkûm Yolu"
        mertebe: 4
        not: "木偶 → Kukla; 物化 (nesneleşme) ile içindeki cinneti ve arzuyu zorla bağlar; Yakınsama temayülünü de bu Mertebede dizginleyebilir"
      - yol: "Mahkûm Yolu"
        mertebe: 9
        not: "zihin bedenin, beden ise âlemin mahkûmudur — Yolun kurucu imgesi"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Binding / Restraint"
    not: >-
      束缚 ile 被缚者 kaynakta 缚 karakterini paylaşır; Türkçede
      Pranga/Prangalı aynı ortaklığı taşır (Kural 11 onarımı).
      Kanon bu salahiyeti 节制 (İtidal) ile aynı şey sayar ve karşıtı
      olan 放纵'u (Sefahat) onun içinde toplar. İki kelime de sözlükte
      zaten kuruludur (İtidal Fırkası, Sefahat Fırkası); Pranga
      salahiyetin kendi adıdır.

  - cince: 物品
    pinyin: wùpǐn
    turkce: Nesne
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Mahkûm Yolu"
        mertebe: 0
        pay: tam
        not: "ruhlu yahut ruhsuz bütün nesnelere hükmeder. Sahipsiz bir Sefirot da nesne sayılabildiği için onunla bağ kurup dolaylı tesir edebilir"
      - yol: "Mahkûm Yolu"
        mertebe: 4
        not: "木偶 → Kukla; belirli bir menzildeki bütün cansız nesneleri uyandırıp sevk eder, sahipsiz mühürlü eşyalar dâhil"
    dogrulama: yazar_qa
    not: "'Eşya' tercih edilmedi: 'Mühürlü Eşya' teriminde kuruludur ve çakışma yaratırdı."

  - cince: 独裁者
    pinyin: dúcáizhě
    turkce: Cebbar
    tur: salahiyet
    durum: tamam
    sistem_kural: [7, 10]
    gecisler:
      - yol: "Avukat Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Kara İmparator'un çekirdek salahiyeti ve 秩序阴影 simgesine
          bağlıdır. Altında Tahrif, İstismar, Tarif ve Tabaka
          salahiyetleri bulunur. Tabaka dışındakiler nizama dayanır:
          nizamın gediklerini istismar ederek yahut asli maksadını
          tahrif ederek nizamı kendi gayesine hizmet ettirir. Ölüm
          hakikatin nizamının en alt ve en çekirdek parçası olduğu için
          Kara İmparator dirilebilir.
    dogrulama: yazar_qa
    ingilizce_tuzak: "Autocrat"
    not: >-
      'Müstebid' reddedildi: ع-ب-د kökündendir ve İsti'bad (奴役, Ölüm
      Yolu) ile Türkçede bağ kurardı; oysa 独裁者 ile 奴役 Çincede
      hiçbir ortaklık taşımaz (Kural 11).
      'Tagallüb' de reddedildi: galebe/fetih alanına yakındır ve
      征服 (Fetih, Ahmer Hünkar) ile yanlış bir yakınlık doğururdu.
      KURAL 7 HAKKINDA: el-Cebbâr Esmâ-ül Hüsnâ'dandır, fakat burada
      ilahî bir isim olarak değil, zorba idareyi bildiren sıradan bir
      sıfat olarak kullanılır. Yolun kendi kaydı da siyasîdir (Kara
      İmparator, Tasfiye Prensi, İnhilal Dükü). Tahsis, ismin tazim
      maksadıyla kullanılmasına dairdir.

  - cince: 混乱
    pinyin: hǔnluàn
    turkce: Fitne
    tur: salahiyet
    durum: tamam
    sistem_kural: [5, 10]
    gecisler:
      - yol: "Avukat Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Kara İmparator'un iki çekirdek salahiyetinden biri ve büyük
          kısmına sahiptir. Artık nizamın asalağı, yorumcusu yahut
          tahrifçisi değildir: nizamdan bütünüyle sıyrılıp nizamın ve
          kaidelerin kavramlarını fitneye düşürür. Bir kişinin
          düşüncelerini fitneye sürükleyip faal ve zapt edilemez
          kılabilir.
      - yol: "Avukat Yolu"
        mertebe: 5
        not: "混乱导师 → Fitne Mürşidi; Mertebe adında. Hedefte yahut çevrede fitne yaratır — saldırılar isabet etmez, hasım yanlış tercihe sürüklenir, mesafe ölçüsü karışır"
      - yol: "Avukat Yolu"
        mertebe: 3
        pay: kismi
        not: "狂乱法师 → Mecnun Sahiri; 狂乱 (cinnet dalgalanması) bu salahiyetten doğar — kendi kabiliyetleri rastgele değişir, hasmınkiler de"
      - yol: "Avukat Yolu"
        mertebe: 2
        pay: kismi
        not: "熵之公爵 → İnhilal Dükü; İnhilal kabiliyeti bu salahiyetten türer"
      - yol: "Arabulucu Yolu"
        mertebe: 0
        pay: kismi
        not: "fitneyi eski hâline döndürebilir, yatıştırabilir, söndürebilir; nizam da fitne doğurur"
      - yol: "Arabulucu Yolu"
        mertebe: 3
        pay: kismi
        not: "混乱猎手 → Fitne Avcısı; Mertebe adında. Fitneyi doğrudan sezer, kilitler, izler ve çevredeki fitneyi hızla yatıştırır"
      - varlik: "Will Auceptin"
        not: "tazim ismi — 混乱与疯狂的看守 → 'Fitne ve Cinnetin Muhafızı'"
      - yol: "Canavar Yolu"
        mertebe: 0
        pay: kismi
        not: "kaderin özü fitnedir ve Aslî Yaradan'ın cinnetine dayanır; Kader Çarkı bu fitneyi hem bekler hem kullanır"
      - yol: "Canavar Yolu"
        mertebe: 3
        pay: kismi
        not: "混乱行者 → Fitne Sâliki; Mertebe adında. Mukadder kaderi yeniden fitneye düşürür, hedefin ruhunu ve kaderini daha çılgın bir yöne sürer"
      - varlik: "Işık Miftahı"
        not: "tazim ismi — 'Nihayetsiz Fitne'"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Chaos / Disorder — 混沌 (Heyûlâ) ile aynı kelimeye düşer"
    not: >-
      混沌 (Heyûlâ) ile ayrı terimlerdir: biri kurulu nizamın bozulup
      karışıklığa düşmesi, öbürü yaratılıştan önceki biçimsiz ilksel
      hâl (bkz. o satır ve Kural 5).
      Fitne bir yayıcı gerektirmez; Kara İmparator'un salahiyeti
      nizamın kendiliğinden karışıklığa düşmesidir.

  - cince: 腐化
    pinyin: fǔhuà
    turkce: Fesat
    tur: mertebe_adi
    durum: tamam
    sistem_kural: [5]
    gecisler:
      - yol: "Avukat Yolu"
        mertebe: 6
        not: "腐化男爵 → Fesat Baronu; Mertebe adında"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Corruption — 污染 (Tencîs) ve 堕落 (Tereddi) ile aynı kelimeye düşer"
    not: >-
      SALAHİYET DEĞİLDİR. Hiçbir kaynakta 掌握/拥有/部分"腐化"权柄
      biçiminde bir tasarruf beyanı yoktur; Kara İmparator'un Mertebe 0
      listesi Cebbar (ve astları) ile Fitne'den ibarettir. Terim yalnızca
      Mertebe adında geçer. Satır, ileride salahiyet olarak yeniden
      kaydedilmesin diye tutulur; Kural 10'un listesinden çıkarılmıştır.
      Mertebenin kabiliyeti 【腐蚀】, 腐蚀 (Aşındırma) salahiyetinin
      kullanımıdır ve 腐 karakterini Mertebe adıyla paylaşır.
      KABUL EDİLEN KAYIP: bu 腐 bağı Türkçede taşınmaz (Fesat /
      Aşındırma). Onarım ya Kural 5'in dikkatle gerekçelendirdiği
      Fesat'ı ya da Hâviye'nin salahiyet kelimesini değiştirmeyi
      gerektirirdi; bağ ise ince — bir Mertebe adının yaygın bir
      bileşiği yankılamasıdır, yazarın kurduğu bir dizge değil.

  - cince: 审判
    pinyin: shěnpàn
    turkce: Yargı
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Arabulucu Yolu"
        mertebe: 0
        pay: tam
        not: >-
          审判者 → Yargı; Mertebe 0 adı. Nizama muhalefet eden herkes
          yargılanabilir; her yargıya bütün âlemin iradesi ve kuvveti
          eşlik eder, uzaktan da yakından da uygulanabilir.
      - yol: "Arabulucu Yolu"
        mertebe: 3
        pay: kismi
        not: "混乱猎手 → Fitne Avcısı; 审判之剑 (Yargı Kılıcı) fitneye düşmüş olana kaçınılmaz bir yargı indirir. Hedef ne kadar fitne içindeyse tesir o kadar kuvvetlidir"
      - varlik: "Xio Derecha"
        not: "tarot kod adı aynı kelimedir; Çincede ayrım yoktur (bkz. Yargı notu)"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Judgment / Justiciar — İngilizce Mertebe 0 adını ve salahiyeti ayrı kelimelere böler"

  - cince: 平衡
    pinyin: pínghéng
    turkce: Muvazene
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Arabulucu Yolu"
        mertebe: 0
        pay: tam
        not: "zorla muvazene kurar; soyut şeyleri de dengeleyebilir — akıl ile cinneti belli bir süre (en çok üç dakika) muvazeneye getirmek gibi"
      - yol: "Arabulucu Yolu"
        mertebe: 2
        pay: kismi
        not: >-
          平衡者 → Muvazenedar; Mertebe adında. Harp meydanını bölüp
          tarafları ayrı sahalara dağıtır ve her sahanın kuvvetini
          kabaca denkleştirir. Teke tekte hasmın kuvvetini bir dakika
          içinde kendi seviyesine indirip çıkarabilir; hasım ne kadar
          kuvvetliyse muvazene o kadar kısa sürer.
      - yol: "Arabulucu Yolu"
        mertebe: 3
        not: "混乱猎手 → Fitne Avcısı; muvazeneyi başlangıç düzeyinde kullanıp harp meydanını bölebilir, fakat nizamın yeniden fitneye kaymasını engelleyemez"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Balance"
    not: >-
      İnhilal Dükü'nün Tahrif'i bu salahiyetin kurduğu kaideyi
      çarpıtabilir; kanon iki Yol arasındaki bu karşıtlığı doğrudan
      işler.

  - cince: 律法
    pinyin: lǜfǎ
    turkce: Ahkâm
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Arabulucu Yolu"
        mertebe: 0
        ust_salahiyet: [秩序]
        not: "Nizam'ın astlarından biri; 规则 (Kaide) ve 规律 (Mizan) ile birlikte sayılır"
      - yol: "Arabulucu Yolu"
        mertebe: 2
        not: "平衡者 → Muvazenedar; ahkâm ve ferman koyma kabiliyetinin üst hâlini kazanır, çevreyi tarif ederek birden çok Men yahut Takviye'yi aynı anda yürürlüğe sokar"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Laws — 定律 (Kanun) ve 规律 (Mizan) ile aynı kelimeye düşer"
    not: >-
      律 ailesi Türkçede ayrı tutulur: 律法 Ahkâm (vazedilmiş, icrası
      zorlayıcı hukuk), 定律 Kanun (sabit, değişmez kanun — bkz. Aşkın
      Hasletlerin Yakınsama Kanunu), 规律 Mizan (eşyanın tabii
      düzenliliği), 规则 Kaide (konulmuş kural), 律令 Ferman (Ferman
      Sahiri'nin vazettiği süreli kısıtlama), 秩序 Nizam (salahiyetin
      kendisi). İngilizce bunların çoğunu 'Law' ile karşılar.

  - cince: 定律
    pinyin: dìnglǜ
    turkce: Kanun
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol_grubu: "Marifet İfriti"
        not: "知识之妖 — kanunların kendisine bir marifet olarak ağırlık verir"
      - yol_grubu: "Nizamın İnhilali"
        not: "混沌之子 → Heyûlânın Oğlu — kanunlara ve kâinata ağırlık verir"
      - yol: "Arabulucu Yolu"
        mertebe: 0
        not: "Heyûlânın Oğlu Aşkın Hasletlerin yok olmazlık, yakınsama ve ayrışma kanunlarını bir dereceye kadar etkileyebilir; sınırlı, düşük düzeyde ve dar kapsamlı tadiller yapabilir"
      - varlik: "Aslî Yaradan"
        not: "Aşkın Hasletlerin Yakınsama Kanunu — yazarın kendi örneği; hasletlerin üç kanunu bu simgeye aittir"
    dogrulama: yazar_qa
    not: >-
      Yazar teyidi (soru-cevap): 定律 simgesi hem 知识之妖'ya hem
      混沌之子'ya aittir — biri kanunlara ve kâinata, öbürü kanunların
      kendisine bir marifet olarak ağırlık verir; örnek olarak Aşkın
      Hasletlerinin üç kanunu anılır. Hangi vurgunun hangi Yüce
      Kadim'e ait olduğunu yazar açıkça eşleştirmez; 'marifet olarak
      kanun' açıkça 知识之妖'nınkidir, geriye kalan 混沌之子'ya düşer ve
      Yargı Yolu'nun Mertebe 0 metni bunu destekler (çıkarım).
      律 ailesinde ayrı tutulur: 律法 Ahkâm, 定律 Kanun, 规律 Mizan,
      规则 Kaide, 律令 Ferman (bkz. 律法 satırı).
  - cince: 知识
    pinyin: zhīshi
    turkce: Marifet
    tur: simge
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Bilgin Yolu"
        mertebe: 0
        not: >-
          完美者'in bütün salahiyetleri bu simgeden türer; Ekmel onun
          hakikate meyleden kısmını taşır. Simge, iki ast Yolun
          ilahlarının ve hatta Mertebe 1-2'lerinin uçsuz bucaksız bir
          malumat seline dönüşmesini mümkün kılar. Marifet keşfedilir,
          icat edilmez; marifet aynı zamanda mahiyettir, mizan da
          öyledir.
      - yol: "Bilgin Yolu"
        mertebe: 2
        not: "知识导师 → Marifet Müdebbiri; Mertebe adında"
      - yol: "Gizem Avcısı Yolu"
        mertebe: 0
        not: "Keşiş simgenin gizeme meyleden kısmını taşır; Ekmel hakikate meyleden kısmını"
      - yol: "Gizem Avcısı Yolu"
        mertebe: 1
        not: "知识皇帝 → Marifet İmparatoru; Mertebe adında"
      - yol_grubu: "Marifet İfriti"
        not: "知识之妖 — yol grubunun adında"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Knowledge / Information"
    not: >-
      Yol grubunun kendi kelimesidir. 'Bilgi' düz karşılık olurdu fakat
      grubun adı zaten 'Marifet'tir ve Kural 10 gereği aynı terim tek
      kelime taşır.

  - cince: 现实知识
    pinyin: xiànshí zhīshi
    turkce: Cismani Marifet
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Bilgin Yolu"
        mertebe: 0
        pay: tam
        not: >-
          hakiki âlemde keşfedilmiş bütün marifete sahiptir ve onu bir
          dereceye kadar tadil edebilir: kıta ölçeğinde derhal, gezegen
          ölçeğinde hızla, yıldız sistemi ölçeğinde tedricen tesir
          eder, ötesinde etmez. Hedefi kısa süre karşılık gelen
          marifetten mahrum bırakabilir, yahut onun sahip olduğu
          marifeti kendi lehine bir sızıntıcıya çevirebilir.
    dogrulama: yazar_qa
    not: >-
      现实 için 'Cismani' Sefahat Ana Tanrıça'nın tazim isminde zaten
      kullanılır (现实世界的主宰 → 'Cismani Âlemin Hâkimi').

  - cince: 文明
    pinyin: wénmíng
    turkce: Medeniyet
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Bilgin Yolu"
        mertebe: 0
        pay: tam
        not: >-
          medeniyetlerin yükselişi ve çöküşü, medeniyetin ağırlığı ve
          onun biriktirdiği uçsuz marifet. Bir kavmi, bir ülkeyi, bir
          kıtayı yahut bir gezegeni ebediyen vahşet ve cehalet hâlinde
          tutabilir, yahut medeniyetini hızla ilerletebilir.
      - yol: "Bilgin Yolu"
        mertebe: 1
        pay: kismi
        not: >-
          启蒙者 → Münevver; heyûlânın bir parça nizam çökeltmesini,
          helâkin cılız bir yeniden doğuş vermesini, karanlığın ilk
          ışığı fışkırtmasını sağlayabilir. Medeniyetin ağırlığıyla
          hedefi bağlar, ezer, çarpar.
    dogrulama: yazar_qa

  - cince: 教化
    pinyin: jiàohuà
    turkce: Tehzib
    tur: salahiyet
    durum: tamam
    sistem_kural: [2, 10]
    gecisler:
      - yol: "Bilgin Yolu"
        mertebe: 0
        pay: kismi
        not: "başkasına marifet verme salahiyeti; Keşiş'inkinden farkı tenvir, irşat, imtihan ve dizgeleştirmeye ağırlık vermesidir"
      - yol: "Bilgin Yolu"
        mertebe: 2
        not: "'导师' (Müdebbir) kabiliyeti bu salahiyetten türer: başkasını imtihan edebilir ve öğretmekte pek mahirdir"
      - yol: "Bilgin Yolu"
        mertebe: 1
        pay: kismi
        not: "hedefin zekâsını yükseltebilir, ilham ve tenvir verebilir, hasmı riyazi bir labirente hapsedebilir"
      - yol: "Gizem Avcısı Yolu"
        mertebe: 0
        pay: kismi
        not: >-
          Keşiş bu Yolun bütün Aşkınlarının zihnine müspet yahut menfi
          marifeti doğrudan akıtabilir; hazmedemeyenler ya tadilini
          kabul eder, ya inatla direnir, ya da şirazesini yitirip ölür.
          Kanon iki payı karşılaştırır: Ekmel'in tehzibi tenvire
          (启蒙), Keşiş'inki telkine (灌输) meyleder.
      - yol: "Gizem Avcısı Yolu"
        mertebe: 1
        not: "知识皇帝 → Marifet İmparatoru; gözlerinde karmaşık simgeler yoğunlaştırıp hedefin zihnine muazzam miktarda faydasız marifet akıtarak kafasını patlatabilir"
      - yol: "Gizem Avcısı Yolu"
        mertebe: 2
        pay: kismi
        not: "贤者 → Bilge; baktığı hedefe marifet telkin eder, marifeti somutlaştırıp saldırtabilir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Education"
    not: >-
      教 (öğretmek) + 化 (dönüştürmek); kavram, öğretim yoluyla insanı ve
      cemiyeti dönüştürmedir — malumat aktarımı değil. 文明 (Medeniyet)
      ile aynı Yolda bulunması tesadüf değildir: tehzib vahşeti
      medeniyete çeviren şeydir.
      'Talim' reddedildi: aktarımı bildirir, dönüşümü değil. 'Maarif'
      reddedildi: م-ع-ر-ف kökündendir ve 知识 (Marifet) ile kaynakta
      bulunmayan bir bağ kurardı. 'Terbiye' reddedildi: Türkçede hayvan
      eğitimini de bildirir ve Menşe Tanrıçası grubundaki muhtemel bir
      Mertebe adıyla çakışabilir.
      Kural 2'nin Mürşid ekonomisiyle karıştırılmamalı: o kural 导师
      unvanının Mertebe adlarındaki karşılığını düzenler, bu ise
      salahiyetin adıdır.

  - cince: 制造
    pinyin: zhìzào
    turkce: İmal
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Bilgin Yolu"
        mertebe: 0
        ust_salahiyet: [知识]
        not: "marifet birleşerek mucize mertebesinde, ilaha yakın ve olağanüstü şeyler kurar"
      - yol: "Bilgin Yolu"
        mertebe: 6
        not: "机械专家 → Zanaatkâr; mühürlü eşya ve mekanik harika imal eder"
      - yol: "Bilgin Yolu"
        mertebe: 2
        not: "zayıflamış hâliyle: tahayyül ettiği eşyanın çoğunu imal edebilir, malzeme yoksa geçici bedeller kurar"
      - yol: "Bilgin Yolu"
        mertebe: 1
        not: "启蒙者 → Münevver; sanat ve kültür medeniyetin parçası olduğu için mekanik imalatla musiki ve resim dahi ortaya koyabilir"
    dogrulama: yazar_qa

  - cince: 灵界导师
    pinyin: língjiè dǎoshī
    turkce: Âlem-i Ervah Müdebbiri
    tur: salahiyet
    durum: tamam
    sistem_kural: [2, 10]
    gecisler:
      - yol: "Bilgin Yolu"
        mertebe: 0
        not: "Âlem-i Ervah her türden malumatın toplandığı yerdir ve malumat marifettir; bu yüzden tabii olarak Marifet Yollarının tesiri altındadır"
      - yol: "Gizem Avcısı Yolu"
        mertebe: 0
        not: "Keşiş bu salahiyeti Ekmel ile paylaşır"
    dogrulama: yazar_qa
    not: >-
      星界导师 (Âlem-i Misal Müdebbiri, Okur Yolu M1) ile aynı 导师'yı
      taşır ve Türkçede de aynı kelimeyi alır (Kural 11 onarımı).
      Âlem-i Ervah'ın üç unvanı ayrı tutulur: 灵界之主 Hâkimi (Esrarın
      Hükümdarı), 灵界掌控者 Mutasarrıfı (Soytarı), 灵界导师 Müdebbiri
      (Ekmel ve Keşiş).
      Aynı Yolun Mertebe 2'si 知识导师 de 'Müdebbir'i taşır (Marifet
      Müdebbiri); 导师 böylece Bilgin Yolu'nda tek kelimeyle okunur.
  - cince: 神秘知识
    pinyin: shénmì zhīshi
    turkce: Gizem Marifeti
    tur: salahiyet
    durum: tamam
    sistem_kural: [8, 10]
    gecisler:
      - yol: "Gizem Avcısı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          隐者 → Keşiş; Gizem Marifeti'nin bizzat tecessümüdür. Çekirdek
          tatbiklerinden biri rakamlara kuvvet vermektir: '0' heyûlâyı,
          meçhulü, her şeyden önceyi; '1' başlangıcı ve âlemi kuran
          Yaradan'ı temsil eder. İkisi uç uca eklendiğinde bir rakam
          âlemi doğar ve Keşiş 1'i 0'a çevirerek onu yokluğa
          döndürebilir. Astları Yedek, İstinsah, Hazf ve Tadil'dir.
      - yol: "Gizem Avcısı Yolu"
        mertebe: 2
        pay: kismi
        not: "贤者 → Bilge; kendini malumata dönüştürebilir, bedenini çözüp saf bir malumat seli hâline gelir ve sonra yeniden kurar"
      - yol: "Gizem Avcısı Yolu"
        mertebe: 1
        not: "知识皇帝 → Marifet İmparatoru; soyut marifete maddi kuvvet verebilir — yeterli bilgi varsa o marifeti kendi malumat seline katıp başka Mertebelerin kabiliyetlerini kazanır"
    dogrulama: yazar_qa
    not: >-
      'Gizem' Kural 8 gereği Marifet İfriti grubunun kelimesidir;
      'Marifet' ise 知识'nin karşılığıdır (bkz. o satır). Terkip iki
      kelimeyi birleştirir ve grubun kendi dağarcığında kalır.
      Ekmel'in 现实知识'i (Cismani Marifet) bunun karşıtıdır: aynı
      simgenin hakikate ve gizeme meyleden iki yarısı.

  - cince: 窥秘
    pinyin: kuīmì
    turkce: İttıla
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Gizem Avcısı Yolu"
        mertebe: 0
        pay: tam
        not: >-
          sır ne olursa olsun bir marifet türüdür, Gizem Marifeti'nin
          parçası yahut ittıla edilebilir olanıdır. Kanon bu salahiyet
          ile Karanlık'ın Sırrakadem'ini karşılıklı men hâlinde sayar;
          netice tarafların hâline ve ipucu bulunup bulunmadığına
          bağlıdır.
      - yol: "Gizem Avcısı Yolu"
        mertebe: 3
        pay: kismi
        not: "预言大师 → Durugören; gizli sırlara, marifetlere ve varlıklara ittıla ettiği gibi kaderin sırlarına da ittıla eder"
      - yol: "Gizem Avcısı Yolu"
        mertebe: 1
        pay: kismi
        not: "ilahların ve hatta Yüce Kadimlerin sırlarına doğrudan ittıla edebilir"
      - yol: "Gizem Avcısı Yolu"
        mertebe: 9
        not: "窥秘人 → Gizem Avcısı; 窥秘之眼 (Gizem Avcısı Gözü) Mertebenin en belirgin kabiliyetidir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Mystery Prying"
    not: >-
      Mertebe 9'un adı (Gizem Avcısı) salahiyetin kelimesini taşımaz;
      ad, Mertebenin mahiyetini karşılar (krş. Ateş Müptelası,
      Musavvir). 窥 gizlice bakmayı, görülmemesi gerekene göz atmayı
      bildirir; 'avcılık' kaynakta bulunmayan bir kasıt ve takip
      unsuru ekler.
      'Tecessüs' anlamca en yakınıydı fakat 'tecessüm' ile karışacak
      kadar benzerdir ve o kelime tazim isimlerinde sık geçer. 'Keşf'
      reddedildi: hem tamamlanmış bir keşfi bildirir hem de ك-ش-ف kökü
      Müstekşif'te (Çırak M3) kullanılır.
      İttıla, gizli olana vâkıf olmayı bildirir ve bu registerde
      komşusu yoktur.

  - cince: 隐匿
    pinyin: yǐnnì
    turkce: Ketm
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Gizem Avcısı Yolu"
        mertebe: 0
        pay: tam
        not: "kendi malumatını yahut başkasınınkini ketmedebilir; öyle ki başka gerçek ilahlar dahi izini süremez ve yerini tespit edemez"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Hiding — 隐秘 (Sırrakadem) ile karışır"
    not: >-
      隐秘 (Sırrakadem, Karanlık ve Soytarı) ile ayrı bir terimdir.
      'Ketm' bilgiyi saklamayı, açıklamamayı bildirir (ketm-i hakikat)
      ve bu salahiyetin konusu tam olarak malumattır.

  - cince: 母亲
    pinyin: mǔqīn
    turkce: Ana
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 13]
    gecisler:
      - yol: "Çiftçi Yolu"
        mertebe: 0
        pay: tam
        not: >-
          母亲 → Ana; Mertebe 0 adı. 万物之母 (Cümle Varlığın Anası)
          simgesinden türer. Ana her şeyi doğurur: ilahları, kavramları
          ve âlemleri. Cansız bir Yegâneliğin canlanmasını
          hızlandırabilir.
      - yol: "Çiftçi Yolu"
        mertebe: 1
        pay: kismi
        not: "自然行者 → Tabiat Sâliki; kısmi Tabiat ve kısmi Ana salahiyeti"
      - varlik: "Toprak Ana"
        not: "tazim ismi — 万物的母亲 → 'Cümle Varlığın Anası'"
    dogrulama: yazar_qa

  - cince: 大地
    pinyin: dàdì
    turkce: Arz
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Çiftçi Yolu"
        mertebe: 0
        pay: tam
        not: >-
          万物之母 ve 污秽的母巢 simgelerinden türer. Aslen Tabiat'ın
          parçasıyken hayatın menşei, cümlenin kovanı ve nihai dönüş
          yeri anlamları yüklendiği için ondan müstakil hâle gelmiştir
          ve hakikat çevrimini tamamlar. Arzı çatlatıp hedefi
          gezegenin merkezindeki Heyûlâ Deryası'na düşürebilir — bu da
          bir tür meâddır.
      - yol: "Çiftçi Yolu"
        mertebe: 2
        pay: kismi
        not: "荒芜主母 → Çorak Mader; kısmi Arz, Çoraklık, Hasat ve Hayat salahiyetleri"
      - varlik: "Toprak Ana"
        not: "tazim ismi — 托起丰饶的大地 → 'Bereketli Arzın Hâmili'"
    dogrulama: yazar_qa

  - cince: 自然
    pinyin: zìrán
    turkce: Tabiat
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Çiftçi Yolu"
        mertebe: 0
        pay: tam
        not: >-
          根源之神 (Menşe Tanrıçası) simgesinden türer. Ana hakikatin bir
          parçasıdır; kendi rızası olmadıkça, hakiki Ana Tanrıça'ya
          dönmedikçe yahut yerine biri geçmedikçe tamamen yok edilmesi
          yahut mühürlenmesi güçtür. Bitkileri çılgınca büyütüp gerçek
          ilahların saldırısını kesecek tabii bariyerler kurabilir.
      - yol: "Çiftçi Yolu"
        mertebe: 1
        pay: kismi
        not: >-
          自然行者 → Tabiat Sâliki; 自然之子 (Tabiatın Evladı) — çevreyi
          yeniden biçimlendirir, menzildeki toprak, orman, su, dağ ve
          madenle hakiki manada bir olur ve onlar üzerinden geçer.
          Cümlenin anası kavramların da anası olduğu için ateş,
          yıldırım, güneş ve ay gibi geniş manada tabiata giren her şey
          ona muvafakat eder.
    dogrulama: yazar_qa
    not: >-
      Mertebe 1'in adı (自然行者 → Tabiat Sâliki) salahiyetin kelimesini
      taşır. 行者 → 'Sâlik', Canavar Yolu'nun 混乱行者'ı (Fitne Sâliki) ile
      paylaşılır; 'seyr' kökü Çırak Yolu'na ayrılmıştır.

  - cince: 生命
    pinyin: shēngmìng
    turkce: Hayat
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Çiftçi Yolu"
        mertebe: 0
        pay: kismi
        not: >-
          万物之母 ve 根源之神 simgelerinden türer. Varlığı bile bitkileri
          başkalaştırıp azgınca büyütür; canlıları başkalaştırıp çiçek
          açan bitkilere çevirip arza döndürebilir. Birini anında
          gebe bırakmak hayat verme kabiliyetinin nitelik değiştirmiş
          hâlidir.
      - yol: "Çiftçi Yolu"
        mertebe: 6
        not: "生物学家 → Hayatşinas; Mertebe adında"
      - yol: "Aktar Yolu"
        mertebe: 0
        pay: kismi
        not: "ebedi hayata sahiptir; hayat bahşeder yahut geri alır, yarayı ve hastalığı iyi eder, hayata yapışan necaseti temizler, canlı yaratır yahut değiştirir. Kan Zümresi bu yolla yaratılmıştır"
      - yol: "Aktar Yolu"
        mertebe: 2
        pay: kismi
        not: >-
          创生者 → Hayat Bahşedici; 创造之力 (Hilkat Kuvveti) Hayat'ın bir
          kısmından türer (bkz. o satır). Ölü olmayan her şeyi ilaçsız iyi eder,
          Beklend büyüklüğünde bir toprağa yeni hayat verir, kulluk
          gerektirmeyen geniş ölçekli bir Kan Kulu dönüşümü doğurur.
      - varlik: "Toprak Ana"
        not: "tazim ismi — 生命的源泉 → 'Hayatın Menşei'"
    dogrulama: yazar_qa

  - cince: 召唤
    pinyin: zhàohuàn
    turkce: Celp
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Aktar Yolu"
        mertebe: 0
        pay: tam
        not: "Ay'ın çağrısı çok dehşetli şeyleri celbedebilir — Sefahat Ana Tanrıça'yı yahut Kovan'ı. Kanon bu salahiyeti Zedus'un ablası tarafından öldürülmesinin sebeplerinden biri sayar"
      - yol: "Aktar Yolu"
        mertebe: 3
        pay: kismi
        not: >-
          召唤大师 → Ulu Celbedici; Mertebe adında. Ay'ın Âlem-i Ervah
          üzerindeki tesirinden faydalanıp oranın derinliklerinden
          kudretli mahlukat celbeder; akit imzalamışsa melekleri dahi.
          Celp ara sıra başkalaşır ve ne Âlem-i Ervah'tan gelen ne de
          akit imzalamış tuhaf mahlukatı hakikate indirir.
      - yol: "Aktar Yolu"
        mertebe: 1
        not: "Güzellik Tanrıçası'nın celbini daha aşağı Mertebeden kimse reddedemez"
    dogrulama: yazar_qa

  - cince: 美
    pinyin: měi
    turkce: Güzellik
    tur: salahiyet
    durum: tamam
    sistem_kural: [9, 10]
    gecisler:
      - yol: "Aktar Yolu"
        mertebe: 0
        pay: tam
        not: "Ay her görüldüğünde en unutulmaz güzellik hatırlanır; kâinatın Kovan'dan sonraki en güzel şeyidir"
      - yol: "Aktar Yolu"
        mertebe: 1
        pay: kismi
        not: >-
          美神 → Güzellik Tanrıçası; Mertebe adında. Güzellik simgesinin
          ve kavramının tecessümüdür; onu gören düşük mertebeliler
          aklını yitirir, Yüce Kadimler bile incitmekten çekinip bir an
          seyre dalar. Güzellik, Ay ile dişil kuvvetin türevidir.
    dogrulama: yazar_qa
    not: >-
      魅力 (Cazibe, Şeytaniçe) ile ayrı tutulur ve kanon farkı kurar:
      Güzellik Tanrıçası'nınki saf, yüce ve ilahîdir, yaklaşmaya
      cüret ettirmez; Şeytaniçe'ninki dişil ve baştan çıkarıcıdır,
      ayartmada daha güçlü fakat daha az ilahîdir.
      'Cemal' değerlendirildi: el-Cemîl Esmâ-ül Hüsnâ'dandır (Kural 7).

  - cince: 灵性
    pinyin: língxìng
    turkce: Ruhaniyet
    tur: salahiyet
    durum: tamam
    sistem_kural: [10, 11]
    gecisler:
      - yol: "Aktar Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Ruhaniyetin kökü, cümle ruhani kuvvetin anası; Kovan'ın 根源之神
          ve 万物之母 simgelerinden türer. Hedef topluluğun ruhaniyetini
          patlatıp şirazesinden çıkarabilir, yahut yenilenmesini durdurup
          tüketimini olağanüstü hızlandırabilir.
      - yol: "Aktar Yolu"
        mertebe: 2
        pay: kismi
        not: "创生者 → Hayat Bahşedici; bütün hedeflerin ruhaniyetine müdahale eder — hızlı yenilenme, artan tüketim yahut istikrarsızlık verir"
      - yol: "Uykusuz Yolu"
        mertebe: 0
        pay: tam
        not: "灵体灵性 — Ruh Bedeni ile birlikte; ruhların varacağı yer ve hükümdarı"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Spirituality"
    not: >-
      Salahiyet, her Aşkının taşıyıp harcadığı gündelik ruhaniyetin
      kendisidir; ayrı bir terim değildir (krş. 光 / Işık).
      ر-و-ح ailesi: 灵 Ruh, 灵体 Ruh Bedeni, 灵性 Ruhaniyet, 灵界
      Âlem-i Ervah. 精神体'nin 'Ruhani Beden' olması da bir onarımdır:
      ansiklopedi Ruh Bedeni'ni (精神体) herkesin temel ruhaniyeti diye
      tanımlar (doğrulama: wiki).

  - cince: 概率
    pinyin: gàilǜ
    turkce: İhtimal
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Canavar Yolu"
        mertebe: 0
        pay: tam
        not: >-
          Kader simgesinden türeyen ikinci çekirdek salahiyet. Her şey
          ihtimale dökülebilir; bu, kaderin fitneden ibaret mahiyetinin
          tezahürlerinden biridir. İhtimale hâkim olan her şeyin
          kaderine hâkimdir. Bir hedefin aleyhine olan ihtimali son
          sınırına kadar büyütüp nadir talihsizlikleri sıradan
          kılabilir, yahut tersini yapabilir.
    dogrulama: yazar_qa
    ingilizce_tuzak: "Probability"

  - cince: 循环
    pinyin: xúnhuán
    turkce: Deveran
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Canavar Yolu"
        mertebe: 0
        pay: tam
        not: >-
          回归 (Meâd) simgesinden türer: ana rahmine, menşeye, en eski
          başlangıca dönüş, kâinatın içgüdüsü. Tenasüh alanını da
          kapsar ve bu alanı Ana ile paylaşır. Astları Hıfz ve Tercih'tir.
      - yol: "Canavar Yolu"
        mertebe: 1
        pay: kismi
        not: >-
          水银之蛇 → Cıva Yılanı; 命运循环 (Kader Deveranı) ile hedefi
          zamanın belli bir aralıkta dönüp durduğu, nispî bir
          sükûnete hapseder; 重启 ile bir sahanın hâlini önceden hıfz
          edilmiş bir hâlin üstüne yazar — bu zamanı geri çevirmek
          değildir. Kaçınılmaz tehlikede deveranı yeniden başlatıp ceninine
          döner.
    dogrulama: yazar_qa
    ingilizce_tuzak: "Cycle"
    not: >-
      'Devir' değerlendirildi; 'Deveran' dönüp dolaşmayı, bir akışın
      kendi içinde çevrilmesini bildirir ve salahiyetin kurduğu nispî
      sükûnete daha yakındır.

