  - cince: 血肉
    pinyin: xuèròu
    turkce: Kan ve Et
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10, 12]
    gecisler:
      - yol: "Hafi Talibi Yolu"
        mertebe: 3
        ust_salahiyet: [异变]
        not: "血肉不灭 — tek hücre kalsa ve çevrede beslenecek et bulunsa beden yeniden kurulur; üç başın çıkması da aynı salahiyetin tezahürü. Astlık kanonda açıkça belirtilir"
      - yol: "Hafi Talibi Yolu"
        mertebe: 6
        not: "血肉魔法 — hücrelerin derin denetimi; 血肉炸弹, 血肉诅咒, 血肉仆役. Ruh yok olmadıkça ölümcül bölge kalmaz"
      - yol: "Hafi Talibi Yolu"
        mertebe: 4
        not: "灵肉之刃 — kan-eti aşındıran, ruhu söndüren bıçak"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Flesh and Blood"
    not: >-
      Diğer salahiyet adları tek kelimedir; buradaki bileşik istisna
      değildir, çünkü 血肉 Çincede de bir bileşiktir ve iki unsuru da
      kabiliyet adlarında ayrı ayrı işler. 'Lahm' tek kelimeyle karşılardı
      fakat kanın yarısını düşürürdü.
      Yolun mitsel biçimi 黑色阴影与蠕动的血肉'dır: kan-et, gölgeyle birlikte
      Yolun iki kurucu unsurundan biridir.

  - cince: 太阳
    pinyin: tàiyáng
    turkce: Güneş
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Ozan Yolu"
        mertebe: 0
        ust_salahiyet: [神圣, 光]
        not: >-
          iki asli salahiyetin karışımından doğar. Hem hakikate hem
          gizemcilik tarifine uyan gerçek bir güneş: bütün dünyayı hatta
          yıldız sistemini aydınlatıp yok edebilecek kızgın ışık saçar,
          enerji dağıtır, çok yüksek harareti ateş yaratır ve necaseti,
          şerri arıtır.
    dogrulama: yazar_qa
    not: >-
      Yolun kendi adı bir alt salahiyettir; asli salahiyetler 神圣, 光 ve
      秩序'dir. Bu yapı kaynağın kendisinden gelir ve tuhaflık Türkçede
      düzeltilmez.

  - cince: 契约
    pinyin: qìyuē
    turkce: Akit
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Ozan Yolu"
        mertebe: 0
        ust_salahiyet: [秩序]
        not: "akit bir kez imzalandığında, karşılık gelen simgeyi taşımayan bir Yüce Kadim dahi güçlü biçimde bağlanır"
      - yol: "Ozan Yolu"
        mertebe: 3
        ust_salahiyet: [秩序]
        not: "astlık ilk burada beyan edilir: 契约权柄是秩序权柄的下位. 神圣契约 — meleklerin bile ihlale cesaret edemediği akit; Mertebe 0 bulunmasa dahi Yegânelik akdin icrasını tabii olarak gözetir"
      - yol: "Ozan Yolu"
        mertebe: 6
        not: "公证人 → Kâtibiadil; akit hazırlamada mahirdir, imzaladığı akdi Mertebe 5 dahi ihlal edemez"
      - varlik: "Ebedi Yanan Güneş"
        not: "tazim ismi — 'Akitlerin Tanrısı'"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Contract"
    not: >-
      Düz metinde 'sözleşme' de kullanılır ve bu çakışma değildir: romanın
      kendisi ayrımı sahneler (Bölüm 17 — Dunn bir 'akit' çıkarır, sonra
      insanların artık 'sözleşme' demeyi tercih ettiğini söyler). Salahiyet
      adı ve 神圣契约 gibi terimler 'Akit' alır; ticari bağlamda anlatı
      'sözleşme' diyebilir. Tek terimin iki kaydı (krş. Tereddi/Mütereddi).

  - cince: 信仰
    pinyin: xìnyǎng
    turkce: İman
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Ozan Yolu"
        mertebe: 0
        ust_salahiyet: [神圣]
        not: "bedenin ve zihnin arınması, ruhun coşkunluğu — hem başkalarında hem kendinde"
      - yol: "Ozan Yolu"
        mertebe: 1
        not: "信仰之仆 — kendini veya müminlerini coşturur; hedefi kudsiyet hissiyle doldurup nihayetinde Ebedi Yanan Güneş'in mümini yapar"
    dogrulama: yazar_qa
    not: >-
      Astlık yazarın soru-cevabında doğrudan beyan edilir: 神圣有个下位
      权柄是"信仰". Güneş Yolu mühürlü eşyalarının taşıyıcıyı Ebedi Yanan
      Güneş'e inandırma yolundaki umumi menfi tesiri de buradan gelir.

  - cince: 学习
    pinyin: xuéxí
    turkce: Tahsil
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [全知, 智慧]
      - yol: "Okur Yolu"
        mertebe: 2
        not: "Hikmet, 学习 ve 解析 kabiliyetlerini salahiyeti az miktarda kullanabilecek dereceye çıkarır"
      - yol: "Bilgin Yolu"
        mertebe: 0
        ust_salahiyet: [知识]
        not: "kendisi bir bakışta öğrenir, başkasına ise hiçbir şekilde öğrenememe hâli verebilir"
    dogrulama: yazar_qa
    not: >-
      'Tahsil'in modern Türkçedeki mektep çağrışımı burada kayıp değil
      kazançtır: Mertebe 5'in terfi ayini elli umumi veya beş hususi
      Aşkın yetiştirmektir, Mertebe 2'ninki ise bin ayrı zîşuurdan
      'hoca' yahut 'üstat' hitabı toplamaktır. Yol, Marifet Kilisesi'nin
      Yoludur.
      'Mütalaa' reddedildi: metin okumaya özgüdür, oysa Hezarfen
      kabiliyetleri muharebe içinde müşahede ederek de öğrenir.

  - cince: 解析
    pinyin: jiěxī
    turkce: Tahlil
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Okur Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [全知, 智慧]
      - yol: "Okur Yolu"
        mertebe: 6
        not: "博学者 → Hezarfen. Ön bilgi varsa hasmın kullandığı kabiliyeti tahlil eder, kuvvetli ve kusurlu yanlarını tespit eder; tahlil yanılabilir de"
      - yol: "Okur Yolu"
        mertebe: 2
        not: "salahiyeti az miktarda kullanabilecek dereceye çıkar"
      - yol: "Bilgin Yolu"
        mertebe: 0
        ust_salahiyet: [知识]
        not: "eşyanın mahiyetini hızla tahlil eder, hatta doğrudan görür. Aldatmaya dayanan Kusur'u ve vehme dayanan Musavvir'i şiddetle men eder"
      - yol: "Bilgin Yolu"
        mertebe: 3
        not: "奥秘学者 → Gizem Alimi; 解离 (Ayrıştırma) ışını Tahlil ile Mizan salahiyetlerinin ortak uzantısıdır"
    dogrulama: yazar_qa
    not: >-
      Yazar, 解析'nin tezahürlerinden birinin hesap/işlem olduğunu ayrıca
      beyan eder; 'Teşrih' bu ciheti taşımadığı için tercih edilmedi.
      'Tahsil' ile aynı vezinde olmaları Türkçenin kendi kazancıdır;
      Çincede 学习 ile 解析 hiçbir karakter paylaşmaz ve kaynağa dair
      bir iddia taşımaz.

  - cince: 天灾
    pinyin: tiānzāi
