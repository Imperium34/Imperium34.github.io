  - cince: 扭曲
    pinyin: niǔqū
    turkce: Tahrif
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avukat Yolu"
        mertebe: 0
        ust_salahiyet: [独裁者]
        not: >-
          Ruhani Beden İpliklerinin uzanma yönünü, tayy-ı mekânın
          varış noktasını, mühürlü eşyaların kullanım kaidelerini,
          sırrî mahallerin kaidelerini tahrif edebilir. Terfi yahut
          diriliş esnasında hakikatte kendiliğinden tahrifler belirir.
      - yol: "Avukat Yolu"
        mertebe: 6
        not: "腐化男爵 → Fesat Baronu; hedefin sözünü, fiilini ve maksadını tahrif ederek kendine uygun bir nizam kurar, saldırının yönünü ve hedefini çevirir"
      - yol: "Avukat Yolu"
        mertebe: 1
        pay: kismi
        not: "弑序亲王 → Tasfiye Prensi; Tarif ile birlikte mevcut nizamı kendi lehine yeniden kurar. Tahrif alt katman olmayan nizam ve kaideleri doğrudan büker"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Distortion"
    not: >-
      'Tahrif' bir metni çarpıtarak bozmaktır ve salahiyetin işi de
      söz, fiil, maksat ve kaide üzerinde aynı ameliyedir.

