        not: >-
          Soytarı zamanı maskaraya çevirir: hadiselerin sırasını
          karıştırır, aşkın kabiliyetlerin tesirini geciktirir, donmuş
          bir çevrede gerçek veya kavramsal gediklerden geçerek hareket
          eder. Hata Yolu'nun zaman salahiyetinden farkı, hızlandırma
          veya yavaşlatma yapmamasıdır; zamanın o anki tecellisini bozar.
    dogrulama: yazar_qa

  - cince: 变形
    pinyin: biànxíng
    turkce: Suret Değiştirme
    tur: salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kâhin Yolu"
