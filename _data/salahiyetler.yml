        mertebe: 0
        ust_salahiyet: [暴君]
      - yol: "Denizci Yolu"
        mertebe: 8
        not: "暴怒之民 → Hiddet Halkı; Mertebe adında. 暴怒一击 kabiliyeti"
      - yol: "Denizci Yolu"
        mertebe: 2
        not: "愤怒之源 — düşünmeyi bırakarak kısa süre bir üst Mertebe kuvvetine çıkar; kendine veya hedefe uygulanabilir"
    dogrulama: yazar_qa

  - cince: 恐惧
    pinyin: kǒngjù
    turkce: Dehşet
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Denizci Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [暴君]
      - yol: "Denizci Yolu"
        mertebe: 2
        not: "恐惧之音 — yüz kilometre çapındaki canlıları ve mühürlü eşyaları dehşete düşürüp itaate sürükler"
      - yol: "Uykusuz Yolu"
        mertebe: 3
        not: "恐惧主教 → Dehşet Piskoposu; Mertebe adında. 恐惧灵光 salahiyetin alt tezahürüdür — ona doğrudan bakan titrer, zayıf Aşkınlar korkudan ölebilir yahut şirazesini yitirebilir"
      - yol: "Uykusuz Yolu"
        mertebe: 0
        pay: tam
        not: "dehşet duygusunun tecessümü; salahiyeti Arzuların Ana Şeceresi'ninkiyle örtüşür"
    dogrulama: yazar_qa
    not: >-
      Uykusuz Yolu'ndaki Mertebe adından devralınan karşılıktır; iki Yol
      ayrı gruplardadır (Kadir-i Mutlak ve Sermedi Zulmet) fakat terim
      aynıdır, dolayısıyla Kural 10 tek kelime gerektirir.

  - cince: 水生生物
    pinyin: shuǐshēng shēngwù
    turkce: Su Mahlukatı
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Denizci Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [水]
      - yol: "Denizci Yolu"
        mertebe: 3
        pay: kismi
        not: "海域主宰 — o deniz sahasındaki her türlü canlıyı sevk edebilir, kendisi de su canlısına dönüşebilir"
    dogrulama: yazar_qa
    not: >-
      'Su' unsuru korunur: terim üst salahiyeti olan 水 (Su) ile aynı
      karakteri paylaşır ve bu bağ Türkçede de görünür kalmalıdır
      (Kural 11 onarımı). 'Bahrî Mahlukat' ve 'Derya Canavarları'
      reddedildi: ikisi de 水 bağını koparır, ayrıca 'Derya' kardeş
      salahiyet olan 海洋'ı karşılar ve iki astın aynı kelimeyi
      paylaşması kaynağın yapısını bozardı.

  - cince: 人性
    pinyin: rénxìng
    turkce: Beşeriyet
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Seyirci Yolu"
        mertebe: 0
        ust_salahiyet: [心灵]
        not: >-
          beşeriyet hem iyidir hem kötü, hem akıldır hem cinnet; kendiliğinden
          doğar, fakat Musavvir tarafından imal de edilebilir
    dogrulama: yazar_qa
    ingilizce_tuzak: "Humanity"
    not: >-
      Temel Kavramlar'daki 'Ulûhiyet ve Beşeriyet' girdisinde zaten
      kullanılan karşılıktır; Kural 10 gereği satır onunla aynı kelimeyi
      taşır.
      Kanonik yön farkı kayda değer: o girdide Beşeriyet, Aşkının
      yükseldikçe yitirdiği şeydir; burada ise Musavvir'in imal
      edebildiği şeydir. Aynı terim, iki karşıt yönde.
      'Nâsût' reddedildi: lâhût/nâsût çifti ilahiyata ait bir çerçeve
      getirir, kaynağın tarifi ise psikolojiktir. 'Fıtrat' reddedildi:
      yaratılıştan geleni bildirir, oysa 人性 burada imal edilebilir.

  - cince: 灾害
    pinyin: zāihài
    turkce: Bela
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 0
        ust_salahiyet: [毁灭]
        not: "各种各样灾祸的主宰 — her türden belanın hükümdarı"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Disaster / Calamity"
    not: >-
      Dördüncü 灾 terimidir ve dördü de ayrı tutulur: 灾难 Afet,
      天灾 Felaket, 灾祸 Musibet, 灾害 Bela. 'Afet' Suikastçı Yolu'nun
      salahiyetidir.
      Kaynak bu terimi 灾祸 ile açıklar (各种各样灾祸); iki terim
      yakındır, ayırt edici yanı çoğulluk ve çeşitliliktir.

  - cince: 勇气
    pinyin: yǒngqì
    turkce: Cesaret
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Avcı Yolu"
        mertebe: 0
        ust_salahiyet: [战争]
        not: "zihnin cesareti korkmamak, bedenin cesareti kolay kolay yıkılmamaktır"
      - yol: "Avcı Yolu"
        mertebe: 4
        not: "铁血骑士 → Demirkan Akıncısı; çelik gibi cesaret, zihinsel saldırılara yüksek mukavemet"
    dogrulama: yazar_qa
    not: >-
      Ozan Yolu'nda da cesaret bolca geçer (歌颂者'nin şarkısı cesaret
      getirir) fakat orada 权柄 beyanı yoktur; bkz. GEÇİŞ SINAMASI.

  - cince: 腐蚀
    pinyin: fǔshí
    turkce: Aşındırma
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [5, 10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        ust_salahiyet: [污秽, 污染]
        not: "万物皆可腐蚀 — her şey aşındırılabilir"
      - yol: "Suçlu Yolu"
        mertebe: 1
        not: "污秽君王'ın taşıdığı dört salahiyetten biri; 侵蚀者 sıfatı ve 深渊之火'in bileşenlerinden"
      - yol: "Suçlu Yolu"
        mertebe: 4
        tur_burada: kabiliyet
        not: "腐蚀毒雾 — Şeytan'ın büyülerinden"
      - yol: "Hafi Talibi Yolu"
        mertebe: 6
        tur_burada: kabiliyet
        not: "血肉炸弹 nesneleri aşındırabilir"
      - yol: "Hafi Talibi Yolu"
        mertebe: 5
        tur_burada: kabiliyet
        not: "掌控阴影 — hedefi gölgede sıkıştırıp aşındırarak eritir"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Corrosion"
    not: >-
      Kaynak 侵蚀 ile 腐蚀'yi yan yana cümlelerde birbirinin yerine kullanır;
      bu bir ayrım değil, yazarın gevşekliğidir ve Türkçede ikiye bölünmez.
      Sıfat hâli 'aşındırıcı'. Kaynakta yalnızca kabiliyet ve salahiyet
      tasvirlerinde geçer, Mertebe adlarında bulunmaz; bu yüzden register
      yükü düşüktür ve okunurluk tercih edilmiştir ('te'kîl' reddedildi).

  - cince: 恶意
    pinyin: èyì
    turkce: Habâset
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        ust_salahiyet: [堕落, 欲望]
        not: "恶意掌控者 — habâsetin sahibi ve timsali"
      - yol: "Suçlu Yolu"
        mertebe: 2
        not: "鲜血大公'ın taşıdığı iki salahiyetten biri; 恶意化身 — 'habâset ölmez, gulyabani de ölmez'"
      - yol: "Suçlu Yolu"
        mertebe: 6
        tur_burada: kabiliyet
        not: "恶意感知 (预知危险) — habâset sezişi"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Malice"
    not: "Sıfat hâli 'habis'. 恶意的种子 → 'Habis Tohum' kabiliyet adı olarak korunur; isim/sıfat farkı bağı zedelemez."

  - cince: 毒素
    pinyin: dúsù
    turkce: Sem
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [污秽]
        not: "gulyabaniler zehirle birlikte var olur; zehir türlerinin çoğuna ve 恶魔 Yoluna özgü zehirlere hâkimdir"
      - yol: "Suçlu Yolu"
        mertebe: 6
        tur_burada: kabiliyet
        not: "剧毒蒸汽, 操纵毒焰 — Gulyabani'nin büyülerinden"
    dogrulama: yazar_qa
    not: >-
      'Sem' (سم) klasik kayıtta zehrin kendisidir ve Necaset'in astı
      olarak aynı registerde durur. Düz 'Zehir' reddedildi: salahiyet
      adları arasında tek öztürkçe kelime olarak kalıyordu.

  - cince: 火焰
    pinyin: huǒyàn
    turkce: Ateş
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [异类, 诅咒]
        not: "堕落之火, 污染之火, 毒素之火, 腐蚀之火 — dört bileşenli"
      - yol: "Suçlu Yolu"
        mertebe: 1
        not: "污秽君王'ın taşıdığı dört salahiyetten biri; 深渊之火 yanma, aşındırma, zehir ve tencîsi birleştirir"
      - yol: "Suçlu Yolu"
        mertebe: 6
        tur_burada: kabiliyet
        not: "硫磺火球, 岩浆之剑, 火焰囚笼, 火山爆发"
      - yol: "Avcı Yolu"
        mertebe: 0
        ust_salahiyet: [毁灭]
        not: "biçimsiz ve renksiz ateş; her şeyi yakar, her şeyi küle çevirir. Felaket Şehri'ne kurban sunularak alınan kuvvetle kan kırmızısına döner"
    dogrulama: yazar_qa
    not: >-
      火焰 alev ailesinden Yollarda da bulunabileceği için kelime
      hepsinde nötr kalabilmelidir. 'Nâr' bu Yolun cehennem kaydına uyar
      fakat diğer Yollarda yanlış yük taşır; bileşiklerde (Hâviye Nârı)
      serbest bırakılabilir, salahiyet adı olarak değil.
      Ozan Yolu sınandı ve engel çıkarmadı: orada ateş bolca geçer
      (光明之火, 阳炎, 超高温火焰) fakat hiçbiri 权柄 beyanı değildir,
      hepsi 神圣 ve 光'un tezahürüdür.
      Ahmer Hünkar Yolu da sınandı ve kapandı: orada 火焰, 毁灭'in alt
      salahiyetidir (biçimsiz ve renksiz, her şeyi yakıp küle çeviren
      ateş) ve işaretli bir kelime talep etmez. İşlenen Yollarda başka
      bir 火焰 tasarruf beyanı çıkmadı; 'Ateş' bütün Yollarda nötr kalır.

  - cince: 身体
    pinyin: shēntǐ
    turkce: Beden
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10, 11]
    gecisler:
      - yol: "Suçlu Yolu"
        mertebe: 0
        pay: kismi
        ust_salahiyet: [异类]
        not: "bedenin denetimi ve değişimi"
      - yol: "Suçlu Yolu"
        mertebe: 2
        not: "鲜血大公'ın taşıdığı iki salahiyetten biri"
    dogrulama: yazar_qa
    not: >-
      Dört okült beden katmanıyla (精神体, 星灵体, 心智体, 以太体, 肉体)
      'Beden' kelimesini paylaşması kasıtlıdır ve icat değildir: kaynak da
      体 karakterini hepsinde kullanır, salahiyetin tarifi ise doğrudan
      bedenin denetimi ve değişimidir (Kural 11).

  - cince: 欺瞒
    pinyin: qīmán
    turkce: Tadlil
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 3
        ust_salahiyet: [欺诈]
        not: >-
          欺瞒导师 → Hile Mürşidi; Mertebe adı salahiyetin kelimesini taşımaz (bkz. not). Dolandırıcı'nın
          derinleşmiş hâli; hasmı yanıltır, hüküm hatası yaptırır, hatta
          tabiat kaidelerini aldatabilir. Kanon bunu açıkça 欺诈
          salahiyetinin astı sayar.
    dogrulama: yazar_qa
    ingilizce_tuzak: "Deceit — 欺诈 (Tedlis) ile aynı kelimeye düşer; İngilizce wiki bu ayrımı ayrıca not eder"
    not: >-
      تضليل yoldan çıkarmak, saptırmaktır ve Mertebenin belgelenmiş
      işini doğrudan karşılar: hasmı yanıltmak, hüküm hatası yaptırmak,
      onu hakikatten ve doğru tercihten uzaklaştırmak. 'Hile' genel
      bir kurnazlığı bildirir ve bu istikamet unsurunu taşımaz.
      'Tedlis' (欺诈) ile Türkçede yakın bir vezin paylaşır; bu bir icat
      değil, kaynağın kurduğu ast-üst ilişkisinin taşınmasıdır — iki
      terim Çincede de 欺 karakterini paylaşır ve kanon 欺瞒'ı açıkça
      欺诈'nın astı sayar (Kural 11 onarımı).
      'Hile' bu sözlükte 戏法'ya aittir (Hilebaz ← 戏法大师); o Mertebenin
      rol ifası ilkesi doğrudan "oynamak, kandırmak ve aldatmak"tır,
      dolayısıyla ad düz anlamı değil Mertebenin fiilen yaptığını
      karşılar (krş. Ateş Müptelası).
      Mertebe 3'ün adı bilinçli olarak 'Hile Mürşidi' kalır: okurun erken
      karşılaştığı bir unvan için 'Tadlil' kapalı bir kelimedir ve 'Hile'
      Hilebaz ile paylaşılırken kaynakta gerçek bir bağa işaret eder —
      iki komşu Yolun iki Mertebesi de aldatma üzerine kuruludur.
      Mertebe adının salahiyet kelimesini taşımaması bu sözlükte
      olağandır (krş. Gizem Avcısı / İttıla). Kaybedilen, 'Tadlil
      Mürşidi'nin taşıyacağı rüşd/dalâlet zıtlığıdır.
      Amon'un 狡诈之神 sıfatı 'Hilekârlık' ile karşılanır; Mertebe adı ile
      Yolun ilahının sıfatı böylece aynı kelime ailesini paylaşır.
  - cince: 寄生
    pinyin: jìshēng
    turkce: Tufeylilik
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 4
        ust_salahiyet: [窃取]
        not: >-
          寄生者 → Tufeyli; Mertebe adında. Sirkat'in bir türüdür ve
          çalınan şey hayatın kendisidir. İki derecesi vardır: konağın
          içinde saklanıp onun duyularıyla algılamak, yahut derin
          tufeylilikte Ruhani Bedenle neredeyse kaynaşıp bedeni
          devralmak.
      - yol: "Kapkaççı Yolu"
        mertebe: 2
        not: "Zaman Kurtçukları Ruhani Beden İplikleri üzerinden gizlice sokulur; canlı hususiyeti taşıyan mühürlü eşyalara da tufeyli olunabilir"
    dogrulama: yazar_qa
    not: "'Parazit' ve 'Asalak' reddedildi; gerekçe Tufeyli girdisindedir."

  - cince: 解密
    pinyin: jiěmì
    turkce: Sırbozma
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [8, 10]
    gecisler:
      - yol: "Kapkaççı Yolu"
        mertebe: 7
        not: "解密学者 → Sırbozan; Mertebe adında. Kehanet veya tenebbü değildir; çıkarım için kâfi malumat gerekir"
      - yol: "Kapkaççı Yolu"
        mertebe: 0
        not: "Âlem-i Ervah'tan kaynaklanır; cüzi malumattan çok şeyin sırrını çözebilir"
    dogrulama: yazar_qa
    not: "密 karakteri Kural 8'in Sır ekonomisine girer; Sırbozan adının gerekçesi o Mertebenin notundadır."

  - cince: 传送
    pinyin: chuánsòng
    turkce: Tayy-ı Mekân
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Çırak Yolu"
        mertebe: 2
        pay: kismi
        ust_salahiyet: [空间]
        not: >-
          旅法师 → Âlem Seyyahı; hedef mevkiye doğrudan varan kapılar
          açar, aynı anda farklı yerlerde bulunabilir. Ayine Âlemi'ne,
          Âlem-i Berzah'a ve rüyalara ayna yahut vasıta olmadan kapı
          açabilir.
      - yol: "Çırak Yolu"
        mertebe: 5
        not: "旅行家之门 — Âlem-i Ervah'a kapı açıp oradan seyahat eder; 闪现 (kısa mesafeli tayy) bunun astıdır"
      - yol: "Çırak Yolu"
        mertebe: 1
        not: "üst boyutlara kapı açabilir"
    dogrulama: yazar_qa
    not: >-
      'Tayy-ı mekân' klasik tasavvufta mesafeyi dürüp anında başka yere
      varmaktır; 传送'un hem mekanî hem mistik cihetini karşılar.
      空间 (Mekan) salahiyetinin astıdır ve kanon bunu açıkça belirtir.

  - cince: 力量
    pinyin: lìliàng
    turkce: Kudret
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Savaşçı Yolu"
        mertebe: 0
        ust_salahiyet: [战斗]
        not: "en dehşetli kudret"
      - varlik: "Cenk Tanrısı"
        not: "tazim ismi — 'Kudret ve Şanın Timsali'"
    dogrulama: yazar_qa

  - cince: 巨大
    pinyin: jùdà
    turkce: Cesamet
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Savaşçı Yolu"
        mertebe: 0
        ust_salahiyet: [战斗]
        not: "en cesametli suret; Yolun mitsel biçimi tek gözlü devdir"
    dogrulama: yazar_qa

  - cince: 摧毁
    pinyin: cuīhuǐ
    turkce: Tahrip
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Savaşçı Yolu"
        mertebe: 0
        ust_salahiyet: [战斗]
        not: >-
          cenk fiilinden doğan tahriptir, bu yüzden Cenk'in astıdır.
          Boşlukta insaniyeti (人性) etkisiz kılabilir fakat kökünden
          silemez; aşındırarak bastırır.
      - yol: "Savaşçı Yolu"
        mertebe: 2
        not: "黄昏巨剑 Alacakaranlık'ın zaman-mekan cihetini kullanıp hedefin durduğu yerden çıkar; bu Cenk'in astı olan Tahrip'in tezahürüdür"
    dogrulama: yazar_qa
    ingilizce_tuzak: "Devastation — 毁灭 (Helak) ile karışır"
    not: >-
      毁灭 (Helak) ile ayrı tutulur ve kanon farkı açıkça kurar: Tahrip
      cenk fiiliyle elde edilir ve ona tâbidir; Helak ise hem bir fiil
      hem başlı başına bir hâldir ve kavram düzeyinde dayatılır.
      Helak, Tahrip'ten çok daha kuvvetlidir.

  - cince: 守护
    pinyin: shǒuhù
    turkce: Muhafaza
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [4, 10]
    gecisler:
      - yol: "Savaşçı Yolu"
        mertebe: 0
        ust_salahiyet: [战斗]
        not: "en sağlam muhafaza"
      - yol: "Savaşçı Yolu"
        mertebe: 5
        not: "守护者 → Muhafız; Mertebe adında. Diz çöküp kılıcını önüne saplar, sağında ve solunda kırılmaz görünmez duvarlar belirir"
      - yol: "Savaşçı Yolu"
        mertebe: 2
        not: "muhafaza bu Mertebede kafese dönüşür; savunmaya ek olarak mühür tesiri kazanır — Alacakaranlık'ın zeval kuvvetiyle kaynaşmıştır"
    dogrulama: yazar_qa
    not: >-
      Kural 4'ün 'Muhafız' kısıtı burada engel çıkarmaz: Mertebe
      gerçekten koruyucu bir işleve sahiptir, kelime bir savaş tarzını
      değil muhafaza edileni bildirir.

  - cince: 荣耀
    pinyin: róngyào
    turkce: Şan
    tur: alt_salahiyet
    durum: tamam
    sistem_kural: [10]
    gecisler:
      - yol: "Savaşçı Yolu"
        mertebe: 2
        ust_salahiyet: [神圣]
        not: >-
          荣耀者 → Şan; Mertebe adında. Kanon şanı kudsiyetin bir
          parçası sayar: ölüm de hayatın en kudsi ve en ciddi
          hadiselerinden biridir, bu yüzden Şan hem şafaktır hem
          alacakaranlık, hem tahriptir hem arıtma.
      - varlik: "Cenk Tanrısı"
        not: "tazim ismi — 'Kudret ve Şanın Timsali'"
