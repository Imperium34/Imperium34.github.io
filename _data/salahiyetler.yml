        not: "疾病女士 (kadim ad) → Hastalık Hanımefendisi"
    dogrulama: yazar_qa
    not: "Maraz (痛苦) ayrı bir terimdir ve Mertebe 5'in asıl adıdır; gerekçe o Mertebenin notundadır."

  - cince: 镜中世界
    pinyin: jìngzhōng shìjiè
