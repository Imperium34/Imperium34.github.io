          Ayine Âlemi'nin tamamına ve ondan türeyen her kabiliyete
          hükmeder; ölümsüzlük ve diriliş buna dâhildir. O, Ayine
          Âlemi'dir. Bütün Ayine Âlemleri yok edilmedikçe gerçekten
