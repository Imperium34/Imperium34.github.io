- terim: "Ebedi Gece Tanrıçası"
  ingilizce: "Evernight Goddess"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Sermedi Zulmet (Eternal Darkness)"
  aciklama: "Yıldızlı Gökkubbe'nin fevkinde, bekadan daha baki olan Ebedi Gece Tanrıçası;<br>Kızılın Hâkimesi,<br>Gizlilik Anası,<br>Şeamet ve Dehşet Ecesi,<br>Sükûnet ve Sükûtun Sahibesi."
  cevirmen_notu: "'Ece', sözlükteki diğer tüm hükümranlık kelimelerinden (Sultan, Hükümdar, Hakim, Kral) farklı olarak bilinçli şekilde öz Türkçe/eski Türkçe kökenlidir. Bu tercih üç katmanlıdır.\n\nBirinci katman kimlikle ilgilidir: Ebedi Gece Tanrıçası kanonik olarak bir insan değil bir Zebani Kurt'tur. 'Ece' seçimi eski Türk kültüründeki kurt-atalık ilişkisine (Asena/Bozkurt) bilinçli bir gönderme içeren, bilgiye dayalı bir 'headcanon'dır.\n\nİkinci katman ise daha işlevseldir. Tanrıça panteonun en 'yeni' üyelerinden biridir ve bu, hem kendisinde hem inananlarında gerçek bir meşruiyet kompleksi yaratır (bkz. Bölüm 18): Yaradan'ın ruhundan doğrudan doğan İlahlarla kıyaslandığında, o yalnızca İkinci Çağ'ın sonunda uyanmıştır 'kim daha kadimse kim daha muteber' mantığında açıkça geride kalan taraf odur. Ne var ki Tanrıça'nın kendi tazim ismi bu hiyerarşiye sessizce boyun eğmez; 'bekadan daha baki' gibi ifadelerle doğrudan zamanın kendisini aşan bir iddiada bulunur. Yani unvan, gerçekte daha genç olan birinin daha kadim görünme çabasıdır.\n\n'Ece' de tam olarak aynı hamleyi, kelime düzeyinde tekrarlar. Sözlükteki diğer tüm hükümranlık kelimeleri Osmanlı/tasavvuf kayıtına aitken, 'Ece' bilinçli olarak daha eski bir Türkçe katmana çekilmiştir. Bu seçimdeki amaç, bizzat unvanının yaptığı şeyi, kelimenin kendi yaşıyla sessizce taklit etmektir. Tazim ismi nasıl retorik olarak kıdemden daha eski görünmeye çalışıyorsa, 'Ece' de dilsel olarak sözlüğün geri kalanından daha eski durarak aynı telafi hareketini bir kez daha, bu sefer çeviri katmanında sahneler.\n\nÜçüncü bir katman ise doğrudan Çince orijinaldeki morfolojik tercihtir. Yazar, unvanın bu satırında kraliçe/kral eşi anlamına gelen 王后 (Wánghòu) veya standart kraliçe anlamına gelen 女王 (Nǚwáng) yerine, spesifik olarak 女皇 (Nǚhuáng - Kadın İmparator) kelimesini seçmiştir. Çin tarihinde bu nadir unvan, göğün iradesini bir erkeğe bağlı olmadan kendi başına taşıyan mutlak kadın hükümdarları (örn. Wu Zetian) tanımlar. İngilizcedeki 'Empress' bu ayrımı kısmen verse de, Türkçeye 'İmparatoriçe' olarak aktarıldığında Batılı ve daha güncel bir tını yaratır. 'Ece', hem Nǚhuáng kelimesinin talep ettiği o mutlak, arkaik egemenliği karşılar hem de sözlüğün klasik dokusunu bozmadan kelimeyi 'kraliçe' mefhumunun bir adım ötesine, asıl ait olduğu yere taşır."
  cevirmen_notu_sinir: 18
  bolum_siniri: 1
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

