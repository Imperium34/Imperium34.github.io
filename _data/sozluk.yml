- terim: "Kadir-i Mutlak"
  ingilizce: "God Almighty"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Kadir-i Mutlak (God Almighty)"
  aciklama: "Kadir-i Mutlak,<br>Hâlık,<br>Bârî,<br>Alîm ve Kadîr,<br>Alem-i Misal Hükümdarı."
  cevirmen_notu: "'Kadir-i Mutlak', seride İbrahimî tektanrıcılık tasavvurunun kozmolojik karşılığını temsil eden bu yol grubunun adı olarak tercih edildi. God Almighty; yaratıcı, her şeyi bilen ve her şeye gücü yeten mutlak ilah, Âdem ve Düşüş gibi açık biçimde İbrahimî teolojik unsurlar etrafında kurulmuştur. Bu nedenle Türkçede sıradan bir 'Yüce Tanrı' veya 'Mutlak Tanrı' karşılığı yerine, İslamî ilahiyatın yerleşik terminolojisinden yararlanmak bilinçli bir tercihtir.<br><br>Bu kapsamda Hâlık, Bârî, Alîm ve Kadir-i Mutlak gibi ifadeler Esmâ-ül Hüsnâ'dan ödünçlenmiştir. Bu kullanım, bu kelimelerin yalnızca kulağa görkemli veya mistik gelmesi sebebiyle yapılmaz; her biri kaynak metindeki yaratma, ilim ve kudret gibi belgelenmiş ilahî niteliklerle ilişkilidir. Bu sebeple Esmâ-ül Hüsnâ'ya başvurma hakkı yalnızca Kadir-i Mutlak yol grubuna tanınmış, diğer hiçbir Yol veya Mertebe için aynı kaynak kullanılmamıştır.<br><br>Buradaki amaç karakteri 'İslamî bir tanrı' olarak yeniden yorumlamak değil, kanonda zaten bulunan İbrahimî tektanrıcılık tasavvurunu Türkçede tarihî ve teolojik karşılıkları bulunan bir terminolojiyle muhafaza etmektir. Böylece Kadir-i Mutlak, yalnızca bir isim değil, sözlüğün geri kalanından ayrılan belirli bir kozmolojik ve teolojik dilin de işareti hâline gelir."
  sistem_kural: [esma]
  bolum_siniri: 1260
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

