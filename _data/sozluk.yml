  cevirmen_notu: "Aslî Yaradan'ın üçüncü çocuğu; Sefahat Ana Tanrıça ve Arzuların Ana Şeceresi'nin kardeşidir. Adı ('Chaos'un Oğlu/Çocuğu') 混沌之子'nin doğrudan çevirisidir; 'Hercümerç' kelimesi bilinçli olarak 'Hercümerç Deryası' (Chaos Sea) maddesiyle aynı kökten (混沌, hùndùn) geldiği için tercih edildi, böylece bu varlığın kökeninin Kadir-i Mutlak grubunun Aslî Menşesiyle aynı ilksel karmaşa olduğu Türkçede de görünür kalır.<br><br>Bu varlık artık tek bir bütün olarak faal değildir: aslen Kara İmparator ve Yargı Yollarını (bugünkü Nizamın İnhilali) ve Hercümerc Sisi Yolu'nu (bugünkü Müphem Sis) birlikte elinde tutarken, ilk ikisini Dünya'ya kaybetmiş ve geriye kalan parçası Müphem Sis olarak kozmosta varlığını sürdürmüştür. Yukarıdaki altı satır, bu ikiye bölünmeden önceki, kaynakta hâlâ tek parça olarak alıntılanan özgün tazim ismidir (bkz. Bölüm 1270, Iesus'un nakli). Bu nedenle yalnızca Nizamın İnhilali'nin kanonik iki satırını ve Müphem Sis'in tam dört satırını içerir; Nizamın İnhilali maddesindeki tamamlama satırları (Kara İmparator'un Tahtı vd.) bu bileşik alıntının bir parçası değildir, yalnızca o maddenin kendi bağımsız girişine aittir."
  bolum_siniri: 1270
  kaynak: metin
  mudahale: ceviri
  denetim: tamam
  ilk_gecis: 1270

- terim: "Zeval Hâkimi"
  ingilizce: "Monarch of Decay"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Zeval Hâkimi (Monarch of Decay)"
  aciklama: "Cümle Mevcudatın Çürüyüşünün Timsali,<br>Zaman Nehri'nin Payanı,<br>Taaffün ve Zevalin Hâkimi,<br>Geri Dönüşü Olmayan İnhilal,<br>Fenanın Arta Bıraktığı,<br>Zaman ile Zevalin Doğurduğu Kat'i Ölüm."
  cevirmen_notu: "Kaynak, yazarın WeChat paylaşımında ve ardından İngilizce wikideki Symbols/Authorities sayfasında bu tazim isminin Zeval, Zaman ve Hastalık Yolları'nın (Pathway of Decay, Pathway of Time, Pathway of Disease) birleşimi olduğunu doğrudan belirtir. İlk dört satır bu üçlü kelime ayrımını korur.<br><br>1. satır (万物终朽/朽 xiǔ): 'Çürüyüş', Zeval Yolu'nun kendi tasvirindeki düz çürüme kelimesi.<br><br>3. satır, ilk kelime (腐烂/fǔlàn): 'Taaffün', Hastalık Yolu'nun tasvirinden ödünçlenmiştir; kokuşma/irinlenme çağrışımı taşıyan gerçek bir Osmanlıca tıbbi terimdir.<br><br>3. satır, ikinci kelime (衰败/shuāibài): 'Zeval', Zeval Yolu'nun adında ve 'Zevalin Sol Eli' unvanında geçen özel isim kelimesidir. Daha önce 'İnhilal Dükü' maddesinde structural çöküşü yeterince taşımadığı için reddedilmişti; 衰败 düz 'zeval/gerileme' anlamına geldiğinden burada doğru yerdedir.<br><br>4. satır (不可逆转之熵): 'İnhilal', 'İnhilal Dükü' maddesinde 熵 (entropi) için kurulmuş kelimenin tekrarıdır.<br><br>5-6. satırlar, wikinin Termination ve Time bölümlerinden gelen ek bilgiye dayanır: Bu varlık, Helak Felaketi ile Sermedi Zulmet'in yakınlaşmasından oluşacak 'Dördüncü Sütun'un artık malzemesidir; ayrıca Zaman ile Zeval'in birleşiminden 'Kesinlik/Sureness' (Certain Death, Sol Eli aracılığıyla kullandığı bir sembol) doğduğu belirtilir.<br><br>5. satır ('Fenanın Arta Bıraktığı'): Bu iki Yüce Kadim'i (Helak Felaketi, Sermedi Zulmet) doğrudan adlandırmamak bilinçli olarak tercih edilmiştir. Bunun yerine 'Fena' (tasavvufta varlığın kendi özünde yok oluşu/fenâ fillâh) tercih edildi; bu kelime iki Yüce Kadim'in yakınlaşıp kendi ayrı benliklerini kaybederek yeni bir varlığa dönüşmesi fikrini, doğrudan isim vermeden taşır. Genealojik bağlantının kendisi bu notta belgelenmiştir.<br><br>6. satır: Zaman+Zeval'in birleşiminden doğan 'Certain Death/Sureness' sembolüne karşılık gelir."
  bolum_siniri: 1270
  kaynak: metin
  mudahale: tamamlama
  denetim: tamam
  ilk_gecis: 1270

