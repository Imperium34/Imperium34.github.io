      cevirmen_notu: "Çince aslı 牧羊人 (Mùyáng rén), düz anlamıyla koyun güden kişidir ve karşılığı doğrudandır. Ancak bu Mertebede kelimenin taşıdığı yük, düz anlamının ötesindedir.<br><br>Çoban–sürü imgesi Kadir-i Mutlak grubunun ait olduğu tektanrıcı/ibrani gelenekte ruhbanî bir eğretilemedir: din adamı çobandır, cemaat sürüdür, ilişki koruma ve gütme üzerine kuruludur. Hafi Talibi Yolu bu imgeyi devralır fakat tersine çevirir. Bu Mertebenin tanımlayıcı yetisi olan Otlatma (放牧), bir sürüyü gütmek değil yutmaktır: Aşkın, hedefin ruhunu ve Aşkın Hasletini bedenine alır ve onların güçlerini kendisi için kullanır. Otlatılan ruh zamanla aşınır, kalıcı olarak muhafaza edilemez; yutulmadan önce hasar görmesi gerekir. Dahası bu ilişki tek yönlü de değildir: Aşkın, Otlatma yetisini yitirdiğinde bedenindeki ruhların etkileşimi yüzünden şirazesini yitirir. Yani sürü hem gıdadır hem de çobanı ayakta tutan şeydir.<br><br>Bu tersine çevirme, Yolun kendi tanımlı alanlarıyla (Günah Taşıma, Kurban, Gölge) tutarlıdır ve Yolun başlıca hâmisi olan Fecir Tarikatı'nın öğretisinde de karşılığını bulur: tarikat, her canlının içinde ilahî bir öz bulunduğunu ve mensuplarının bu öz sayesinde iksir içip nihayetinde melekleşebileceğini savunur. Cemaat burada da hem korunan hem tüketilen bir kaynaktır.<br><br>'Çoban' bu yüzden başka bir karşılıkla değiştirilmemiştir. Kelimenin taşıdığı ruhbanî ve koruyucu çağrışım, Mertebenin gerçek işleyişiyle çelişmez; bilakis, bu çelişkinin kendisi kanonun kurduğu şeydir. Bu, bu sözlükte iyi görünen bir unvanın kötücül bir Mertebeye verilmesi tercihinin (bkz. Felaket Müjdecisi, Fitne Arıtan) kaynağın kendisinden gelen bir örneğidir."
