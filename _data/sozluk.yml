    - seviye: 2
      isim: "İnhilal Dükü (Duke of Entropy)"
      sistem_kural: [fitne_fesat_mufsit]
      cevirmen_notu: "İlk tercih olan 'Zeval', bu Mertebenin ruhuna değil, yalnızca genel 'çöküş/geçicilik' temasına hitap ediyordu. Çince orijinali 熵 (shāng) doğrudan termodinamik 'entropi' kelimesidir ve kanon bunu süs olarak kullanmaz: Mertebenin gücü, düşmanın yeteneklerini, düşüncelerini ve bütünlüğünü zamanla rastgeleleştirip bir 'çamura' dönüştürüp tuhaf bir dinginlik/sönümlenme haline sokar; hedef yalnızca bir kişi değil, bir çevre veya kural sistemi de olabilir. Terfi ayini ise en az on milyon kişilik bir ulusu, hiçbir dış müdahale olmaksızın, yalnızca içeriden çürüyerek çökmeye zorlamaktır. Bu 'dış müdahale olmaksızın kendiliğinden düzensizleşme' şartı, entropinin fiziksel tanımının (kapalı bir sistemin kendi haline bırakıldığında düzensizliğe evrilmesi) doğrudan metne işlenmiş halidir; yani kanon burada 'entropi'yi mecazi değil yapısal olarak kullanır. 'Zeval' bu mekanik/yapısal çöküşü kaybedip yerine dinî-şiirsel bir 'geçicilik/fanilik' okuması koyuyordu.<br><br>'Entropi' teriminin doğrudan alınması ise sözlüğün genel kayıt ilkesine (Batı bilimsel jargonundan kaçınma, karşılığı Türkçenin kendi dağarcığında arama) aykırı düşerdi. 'İnhilal' (bir yapının, düzenin veya devletin dışarıdan bir darbe almadan, kendi içinden çözülüp dağılması) bu boşluğu dolduruyor: hem Osmanlı siyasi düşüncesinde gerçek bir karşılığı var ('devletin inhilali'), hem de 'bütünlüğü kaybetmek' anlamı doğrudan Mertebenin 'çamura dönüştürme' tasvirine ve terfi ayinindeki 'kendiliğinden içten çöküş' şartına örtüşüyor. Böylece Fesat/Sakıtlar/Tasfiye gibi diğer Avukat Yolu unvanlarıyla aynı klasik registerde kalırken, gücün fiziksel/yapısal doğası da korunmuş oluyor."
      bolum_siniri: 323
      metinde: true
      kaynak: metin
      ilk_gecis: 323
    - seviye: 1
      isim: "Tasfiye Prensi (Prince of Abolition)"
      cevirmen_notu: "Başlangıçta İngilizce 'Abolition' çevirisine sadık kalınarak 'İlga Prensi' kullanılmıştı. Ancak 'ilga' yalnızca yasa veya kurumları iptal eden soğuk ve pasif bir hukuki terimdir. Çince orijinal olan 弑序亲王 (Shìxù qīnwáng) ise çok daha şiddetli ve kanlı bir mefhumu imler: 'Xù' (序) nizam ve düzen anlamına gelirken, 'Shì' (弑) doğrudan 'hükümdarı katletmek, vatana ihanetle tahtı devirmek veya üstünü öldürmek' gibi şiddet ve kan barındıran spesifik bir fiildir. İngilizce çeviri bu vahşi, ihtilalci şiddeti metinden tamamen silmiştir. Bu kanlı başkaldırıyı Avukat yolunun politik ve devletleşme temasına oturtmak için 'Tasfiye' kelimesi tercih edildi. Tasfiye, sadece kâğıt üzerindeki eski yasaların iptalini değil; eski nizamın, kurumların ve onların savunucularının da acımasızca, sistematik bir şekilde sökülüp atılmasını ifade eder."
      bolum_siniri: 237
      metinde: true
      kaynak: metin
      ilk_gecis: 237
