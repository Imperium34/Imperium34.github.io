- terim: "Kapkaççı Yolu"
  ingilizce: "Marauder Pathway"
  kategori: "Aşkın Yolları"
  yol_grubu: "Esrarın Hükümdarı (Lord of the Mysteries)"
  mertebeler:
    - seviye: 9
      isim: "Kapkaççı (Marauder)"
      cevirmen_notu: "İlk tercih olan 'Yağmacı', İngilizce 'Marauder' ile doğrudan örtüşüyordu ancak bu Mertebenin gerçek profiliyle örtüşmüyordu: kanon, bu mertebedeki bir Aşkını sıradan bir hırsızdan ayırt etmenin güç olduğunu belirtir. Hatta tam olarak kalabalık bir yağmacıdan çok, fırsatı ve zamanlamayı bilen sessiz bir hırsız olarak tasvir edilirler. 'Yağmacı' askerî/kaotik bir yağma imgesi taşıdığından bu inceliği aşırı büyütüyordu. 'Kapkaççı' (birinin çantasını kapıp kaçan, doğrudan çatışmaya girmeyen soyguncu) hem bu Mertebenin ruhuna hem de Mertebenin zamanlamayla kazanan, doğrudan çatışmada kırılgan kalan doğasının çok daha isabetli bir karşılığıdır."
      bolum_siniri: 21
      metinde: true
      kaynak: metin
      ilk_gecis: 21
    - seviye: 8
      isim: "Dolandırıcı (Swindler)"
      bolum_siniri: 65
      metinde: true
      kaynak: metin
    - seviye: 7
      isim: "Sırbozan (Cryptologist)"
      cevirmen_notu: "Başlangıçta bu mertebe için akademik ve mesleki bir tınısı olan 'Rumuzcu' tercih edilmişti. Ancak yolun genel kötücül ve yıkıcı temasına uyum sağlaması amacıyla 'Sırbozan' olarak revize edildi: 'Rumuzcu' pasif bir okuyucuyu imlerken, 'Sırbozan' bu yolun kural tanımaz, yıkıcı ve asalak karakterini ('bozmak' eylemi üzerinden) yansıtır. Çince orijinali 解密学者 (Jiěmì xuézhě) içindeki 密 (mì) karakterinin Soytarı/Çırak yollarındaki 秘 (Mì) ile eşsesli olmasının genel sistemi için bkz. Sistem Kuralları #8 (Sır / Esrar / Gizem / Hafi Sistemi)."
      sistem_kural: [sir_esrar_gizem_hafi]
      bolum_siniri: 697
      metinde: true
      kaynak: metin
      ilk_gecis: 697
    - seviye: 6
      isim: "Ateşçalan (Prometheus)"
      cevirmen_notu: "Çince orijinali '盗火人' tam olarak 'Ateş Hırsızı' (Fire Stealer) demektir. 'Ateş Hırsızı' yerine birleşik yapıdaki 'Ateşçalan' tercih edildi. Bu birleştirme eylemi, kelimeyi sıradan bir hırsızlıktan çıkarıp mitolojik ve folklorik bir arketipe (tıpkı Yelkovan veya Kardelen gibi) dönüştürür. İngilizcedeki Prometheus'un taşıdığı mitik ağırlığı, Batı mitolojisine yaslanmadan, Türkçenin kendi yapısal imkânlarıyla karşılar."
      bolum_siniri: 697
      metinde: true
      kaynak: metin
      ilk_gecis: 697
    - seviye: 5
      isim: "Düş Hırsızı (Dream Stealer)"
      cevirmen_notu: "Bu Mertebe için önce 'Hülya Hırsızı' kullanılmıştı. Gerekçe, çalınan şeyin sıradan bir uyku rüyasından daha kişisel, iç dünyaya ait bir şey olduğu hissini vermekti. Mertebenin düşünce, niyet, anı ve ideal çalabildiği düşünülürse bu sezgi yersiz değildi. Ancak iki sebeple 'Düş Hırsızı' olarak revize edildi.<br><br>Birincisi işlevseldir. 'Hülya' Türkçede yerleşilebilir bir iç âlemi, dalıp gidilen ve içinde vakit geçirilen bir hâli imler. Bu Mertebe ise kanonda tam olarak bundan yoksundur: rüyalara giremez, yalnızca çalar, depolar ve aktarır. Rüya burada girilecek bir mekân değil, taşınabilir bir nesnedir. 'Hülya'nın en güçlü çağrışımı, Mertebenin sahip olmadığı yetiyi vaat ediyordu.<br><br>İkincisi dizgeseldir. 'Hülya', Seyirci Yolu'nun kendi kelimesidir ve orada tam da yukarıdaki sebeple isabetlidir: Hülya Gezgini rüyalara girer, birinden diğerine atlar, içeriden değiştirir; Hülya Dokuyan ise sıfırdan bir rüya kurar. O yolda rüya bir mekândır. Bir grubun kelimesinin başka bir gruba ödünç verilmemesi ilkesi gereği (bkz. Sistem Kuralları #8), Kusur Yolu'nun kendi kelimesini taşıması gerekir.<br><br>'Rüya Hırsızı' da değerlendirildi ancak 'Hülya'ya karşı bir üstünlük sağlamadığı gibi, Seyirci Yolu'ndan ayrışmayı da yeterince duyurmuyordu. 'Düş' ise uykuda görülenin karşılığını tam olarak verirken hayal/arzu katmanını da bütünüyle yitirmez; yani ilk tercihteki kişisellik sezgisi, Mertebenin sahip olmadığı mekânsallığı vaat etmeden korunmuş olur. Sesçe de kısalığıyla Kapkaççı–Dolandırıcı–Ateşçalan hattının tonuna daha iyi oturur."
      bolum_siniri: 697
      metinde: true
      kaynak: metin
      ilk_gecis: 697
    - seviye: 4
      isim: "Tufeyli (Parasite)"
      cevirmen_notu: "'Parazit' ve 'Asalak' karşılıkları biyolojik/tıbbi bir tını taşır; ikisi de canlı bilimine ait, insan ilişkilerine sonradan aktarılmış kelimelerdir. Bu Mertebede ise asalaklık biyolojik değil, kişisel ve toplumsal bir ilişkidir: Tufeyli bir konağın Ruhani Bedenine yerleşir, onun duyularıyla görür ve işitir, ömrünü onun üzerinden uzatır, derin düzeyde ise doğrudan onun yerine geçer. Yani bir organizmaya değil, bir kişiye musallat olur.<br><br>'Tufeyli' (Ar. طفيلي) tam olarak bu ilişkiyi adlandırmak için vardır: Osmanlı Türkçesinde davetsiz olarak sofraya oturan, başkasının kazancıyla geçinen, varlığını konuğu olduğu kişiye borçlu olan kimseyi imler. Doğrudan insanlar için kullanılan bir kelimedir ve olumsuz ahlaki yükünü de beraberinde taşır ki bu Mertebenin konak seçimindeki hesapçılığı, konağını bir kaynak olarak görmesi ve ayrılırken mutlaka bir şey çalması bu yükü hak eder.<br><br>Kelimenin arkaik oluşu bilinçli bir tercihtir: Mertebe 4, yolun ölümlü mesleklerinden (Kapkaççı, Dolandırıcı) koparak yarı tanrılığa geçtiği yerdir ve adın da gündelik dilden çıkması bu eşiği duyurur. Zaman Kurtçukları'nın metindeki fiziksel varlığı ise biyolojik okumayı zaten metnin kendisinde tutar; bunun ayrıca adda tekrarlanmasına gerek yoktur."
      bolum_siniri: 633
      metinde: true
      kaynak: metin
    - seviye: 3
      isim: "Hile Mürşidi (Mentor of Deceit)"
      cevirmen_notu: "Bu Mertebe, 'Mürşid'in geçerli olduğu iki koşulu (gerçek bir öğretmen-öğrenci ilişkisi + Yolun ahlaki gerilim taşıyabilmesi) birlikte sağlayan çapa örnektir: 'Hile' (aldatma) ile sıcak/saygın 'Mürşid'i birleştirmek bilinçli bir gerilim yaratır. Genel kural ve istisnaları için bkz. Sistem Kuralları #2 (Mürşid Kuralı)."
      sistem_kural: [murshid]
      bolum_siniri: 1162
      metinde: true
      kaynak: metin
      ilk_gecis: 1162
    - seviye: 2
      isim: "Kaderin Truva Atı (Trojan Horse of Destiny)"
      bolum_siniri: 1005
      metinde: true
      kaynak: metin
      ilk_gecis: 1005
    - seviye: 1
      isim: "Zaman Kurtçuğu (Worm of Time)"
      bolum_siniri: 393
      metinde: true
      kaynak: metin
      ilk_gecis: 393
    - seviye: 0
      isim: "Kusur (Error)"
      bolgesel:
        kultur: "Alternatif İsim"
        isim: "Bug (Bug)"
      cevirmen_notu: "'Error' için 'Kusur' tercih edildi; Çince kanonik ad 错误 (cuòwù), doğrudan 'hata, kusur, yanlışlık' anlamına gelir. 'Kusur', hem bu temel anlamı karşılar hem de Mertebenin kurallardaki açıkları, istisnaları ve gerçekliğin mantığındaki bozuklukları kullanma doğasını taşır.<br><br>Ancak Mertebenin diğer adı olan 'Bug' çevrilmemiştir. Bunun nedeni 'Bug'ın yalnızca Error'ın eşanlamlısı olmaması, kaynak metinde özellikle İngilizce ve kökeni bilinmeyen yabancı bir kelime olarak sunulmasıdır. Amon'un babası bu kelimeyi 错误'u adlandırmak için kullanmış; Amon'un 'Bug' demesi ise Klein'ın onun Dünya kökenini fark etmesini sağlayan doğrudan bir ipucudur. Klein'ın kelimeyi özellikle kullanmaktan kaçınması ve İngilizceyi doğal telaffuz etmesinin kimliğini açığa çıkarabileceğinden endişe etmesi, kelimenin yabancı niteliğinin olay örgüsünde işlevsel olduğunu açıkça gösterir. Bu nedenle 'Kusur' kanonik Sequence adının Türkçeleştirilmiş karşılığı, 'Bug' ise özellikle korunması gereken İngilizce bir adlandırmadır."
      bolum_siniri: 1152
      metinde: true
      kaynak: metin
  kaynak: metin

