  cevirmen_notu: "İlk tercih 'Meşale' idi ama Çince '道标' (yol işareti) ışıktan çok yön göstermeyle ilgilidir. 'Mihenk Taşı' (mihenk/dokunma taşı, kıymet ölçüm standardı) tercih edildi çünkü Aslî Kale Yollarının en üstünde bulunun bu varlık temelde hakikati sahteden ayırır hatta gerçek ve sahtenin ne olduğuna karar verendir. 'Beacon' burada yön göstermekten çok kader/hakikatin sınandığı bir ölçüt olarak okunabilir. Poetik nesne-imge korunmuş, anlam yönü kesinlik/doğrulama eksenine kaydırılmıştır.<br><br>'Sultan' bilinçli seçildi çünkü Soytarı Yolu'nun Mertebe 1 ismi 'Esrar Hadimi'dir (İngilizce: Attendant of Mysteries) ve bu iki unvan arasında saltanat temalı bir tutarlılık istendi."
