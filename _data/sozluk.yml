    - seviye: 5
      isim: "Maraz (Afflictions)"
      bolgesel:
        kultur: "Kadim İsim"
        isim: "Hastalık Hanımefendisi (Lady of Diseases)"
      cevirmen_notu: "'Maraz' Türkçede iki katmanlı bir anlam taşır: eski kullanımda hastalık, illet demektir; günlük dilde ise başkalarının talihsizliğinden zevk alan, kötü niyetli bir kişi anlamına gelir. Bu Mertebenin gücü tam olarak bu iki anlamı birleştirir: toplumsal bir hastalık gibi yayılan gerçek bir illet ile kötücül, manipülatif bir toplumsal karakter aynı kelimede birleşir. Kelime bilerek bu çift anlam için seçilmiştir.<br><br>Çince ad 痛苦魔女 (Tòngkǔ mónǚ) 'Izdırap/Acı Şeytaniçesi' anlamına gelirken, bu Mertebenin alternatif adı 疾病女士 (Jíbìng nǚshì), literal olarak 'Hastalık Hanımefendisi'dir. Dolayısıyla kanonun kendisi bu Mertebede 'ıstırap' ile 'hastalık' arasında bir anlam alanı kurmaktadır. 'Maraz', Türkçede bu iki kavramı tek kelimede birbirine bağlayabildiği için tercih edildi. Böylece İngilizcedeki 'Afflictions'ın doğrudan sözlük karşılığını vermek yerine, özgün adlandırmadaki acı-hastalık ilişkisini Türkçenin kendi anlam katmanlarıyla yeniden kurar."
      bolum_siniri: 249
      metinde: false
      kaynak: yazar_beyani
    - seviye: 4
      isim: "Yeis (Despair)"
      bolum_siniri: 836
      metinde: true
