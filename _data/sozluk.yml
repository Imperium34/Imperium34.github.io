    - seviye: 3
      isim: "Ahiret Kayıkçısı (Ferryman)"
      cevirmen_notu: "'Ferryman' doğrudan 'kayıkçı' veya 'sandalcı' olarak çevrilebilirdi; ancak bu Mertebenin anlam alanı yalnızca bir kayık kullanan kişiden ibaret değildir. Çince 摆渡人 (bǎidù rén), insanları veya ruhları bir kıyıdan diğerine geçiren 'karşıya geçirici' anlamını taşır ve ölüm bağlamında özellikle ölüleri öte yakaya götüren figür (Yunan mitolojisindeki Charon ve diğer mitolojilerdeki benzer varlıklar) çağrışımına sahiptir. 'Ahiret Kayıkçısı' bu iki katmanı birlikte korur: 'kayıkçı' klasik öte-dünya kayıkçısı imgesini, 'ahiret' ise geçilen yerin sıradan bir kıyı değil ölümün ötesindeki âlem olduğunu belirtir. Tercih aynı zamanda Mertebenin önceki basamaklardaki 'ruhlara iletişim / yönlendirme / kapıda bekleme' çizgisinin doğal sonucunu da görünür kılar: Ruh Aracısı ruhlar ile iletişime geçer, Ruh Rehberi ona yol gösterir, Berzah Bekçisi eşiği tutar ve Ahiret Kayıkçısı onu karşıya geçirir. Böylece mertebe adları yalnızca ayrı ayrı meslekleri değil, ruhun ölümden sonraki yolculuğunu adım adım anlatan bir doku oluşturur."
      bolum_siniri: 900
      metinde: true
      kaynak: metin
      ilk_gecis: 900
    - seviye: 2
      isim: "Ölüm Veliahdı (Death Consul)"
      cevirmen_notu: "Doğrudan 'Konsolos' yerine 'Veliaht' tercih edildi. 'Consul' burada modern diplomatik anlamda değil, Roma'nın İmparatorluk öncesi/geçiş dönemi konsüllüğü anlamında kullanılmış görünüyor. Kanonun kendisi de bu yorumu birkaç yönden destekler:<br><br>(1) Bu Mertebenin bir üstü olan Sequence 1 doğrudan 'Solgun Hükümdar (Pale Emperor)' unvanını taşır; yolun kendi numaralandırması zaten 'Konsül → İmparator' sırasını birebir yansıtıyor.<br><br>(2) Kanonda bu Mertebeye ulaşmış yalnızca iki isimli figür vardır ve ikisi de doğrudan Ölüm'ün makamının verasetiyle ilgilidir: Azik Eggers, Ölüm'ün (Salinger) öz oğludur ve Ölüm'ün kendi ruhunu bilinçli olarak ikiye bölerek onu gelecekteki dirilişi için bir 'yedek/veliaht' olarak bıraktığı bir figürdür. Haiter ise doğrudan 'Ölüm'ü geri getirmeye çalışan bir başka figürdür. Yani mevcut örneklerin tamamı bu Mertebeyi bir veraset/diriliş meselesiyle ilişkilendiriyor, yalnızca biri değil.<br><br>(3) Ayrıca (doğrudan bu Mertebeyle ilgili olmasa da) Roselle Gustav karakterinin kendi biyografisi de aynı 'Konsül → İmparator' geçişini işler ve kendini açıkça 'Caesar' olarak adlandırır; yazarın Roma konsül-imparator ilişkisini evrende bilinçli bir motif olarak kullandığını gösterir.<br><br>'Veliaht' ile 'Vali' arasında tercih 'Veliaht'tan yana kullanıldı: Osmanlı'da şehzadelerin tahta geçmeden önce sancak valisi olarak gerçek idari yetkiyle görevlendirilmesi geleneği, bu Mertebenin hem gerçek gücü elinde tutması hem de bir üst mertebeye (Solgun Hükümdar) geçişin canlı bir adayı olması ikiliğini aynı anda taşır; salt 'Vali' bu veraset boyutunu kaybederdi."
      bolum_siniri: 588
      metinde: true
      kaynak: metin
      ilk_gecis: 588
