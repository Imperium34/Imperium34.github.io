- terim: "Ruhani Alem (Alem-i Ervah)"
  ingilizce: "Spirit World"
  kategori: "Temel Kavramlar"
  aciklama: "Fiziksel alemin üzerine örtülmüş, kavramların, ruhların ve efsanelerin var olduğu kaotik boyut. Aşkınlar burayı hızlı seyahat etmek, ruhani varlıklar çağırmak veya kehanetlerde bulunmak için kullanır. Ayinlerde ve kadim yakarışlarda 'Alem-i Ervah' olarak zikredilir."
  cevirmen_notu: "'Alem-i ervah', İslam kozmolojisinde ruhlar alemini karşılayan yerleşik bir tabirdir ve bu boyutun romandaki muhtevasıyla (ruhlar, kavramlar, efsanevi varlıklar) birebir örtüşür. Başlık iki katmanlıdır: modern Türkçe bileşik ('Ruhani Alem') madde başı, klasik tabir ise parantez içinde karşılığı olarak durur. Bu, alem adlarında bilinçli bir kalıptır; okuyucu terimi modern haliyle tanır, ayin ve tazim isimlerinde ise klasik haliyle karşılaşır. Düz 'Ruhlar Alemi' karşılığı da anlaşılır olurdu; tercih edilmemesinin sebebi, bu sözlükte kozmoloji ve ulûhiyet alanının bütününde klasik kaydın esas alınmasıdır. Sözcük, ait olduğu kavram dünyasından seçilir."
  cevirmen_notu_ek:
  - sinir: 1345
    baslik: "Alem-i Misal ile ilişkisi"
    metin: "Bu terim tek başına değil, bir çift olarak düşünülmelidir. Astral Alem için 'Alem-i Misal' kullanılmıştır ve iki tercih birlikte alınmıştır. Klasik tasnifte âlem-i misal (berzah), âlem-i ervah'ın ALTINDA; cisimler alemiyle ruhlar alemi arasındaki geçiş bölgesinde durur. Romanda ise sıralama terstir: Astral Alem, Ruhani Alem'in üzerindedir. Yani ikili, klasik dizilişe göre ters çevrilmiştir. Bu bilinçli bir tercihtir; gerekçesi Astral Alem girdisinde ayrıntılı olarak açıklanmıştır. Kısaca: tekil doğruluk yerine dizgesel tutarlılık esas alınmış, 'misal' kelimesinin 'suret/sembol' anlamı, mutlak kavramların bulunduğu alem için klasik sıralamaya sadakatten daha belirleyici sayılmıştır."
  bolum_siniri: 14
  kaynak: metin
  mudahale: ceviri
  denetim: tamam
  ilk_gecis: 96

- terim: "Astral Alem (Alem-i Misal)"
  ingilizce: "Astral World"
  kategori: "Temel Kavramlar"
  aciklama: "Ruhani Aleminin de ötesinde, fiziksel evrenin dış çeperini oluşturan ve mutlak kavramların (sembollerin) bulunduğu nihai boyut. Gerçek İlahların (Mertebe 0) ilahi krallıkları bu alemde bulunur. Dışarıdan gelen Yüce Kadimlerin tehditlerine karşı evrenin bariyeri işlevini görür. Ayinlerde ve kadim yakarışlarda 'Alem-i Misal' olarak zikredilir."
  cevirmen_notu: "Bu terim, klasik tasavvuf kozmolojisiyle bilerek çelişen tek tercihtir. 'Misal' kelimesi 'suret, benzer, sembol' demektir ve Astral Alem tam olarak mutlak kavramların, yani sembollerin bulunduğu boyuttur. Anlam örtüşmesi kusursuzdur. Ne var ki klasik tasnifte âlem-i misal (Berzah) âlem-i ervah'ın ALTINDA, cisimler alemiyle ruhlar alemi arasındaki geçiş bölgesinde durur. Romanda ise Astral Alem, Ruhani Alem'in üzerindedir. Yani sıralama tersine dönmüştür. Tasavvufa aşina bir okuyucu bunu fark edecektir. Buna rağmen 'misal' tercih edildi, çünkü bu sözlükte tekil doğruluk değil dizgesel tutarlılık esas alınmıştır: okuyucu tek tek girdileri değil, terimlerin birbiriyle kurduğu ilişkiler ağını öğrenir. Kavramlar alemini 'suretler alemi' olarak adlandırmak, klasik sıralamaya sadık ama anlamca opak bir karşılık kullanmaktan daha çok iş görür.<br><br>İlgili bir not: 'Berzah' bu sözlükte Styx nehri ve Naaş Toplayıcı yolundaki mertebeler için kullanılmıştır. 'Berzah' ile 'Alem-i Misal' klasik kozmolojide birbirine yakın kavram alanlarına sahip olsa da bu sözlükte bilinçli olarak ayrıştırılmıştır. 'Berzah', iki varoluş hâli arasındaki eşik ve ara âlem anlamıyla hayat ile ölüm arasındaki geçişi karşılar. 'Alem-i Misal' ise 'misal'in suret, temsil ve kavramsal biçim anlamlarından hareketle, ilahların temsil ettikleri Yol'un kavramsal mahiyetinin bulunduğu âlem için kullanılır."
  bolum_siniri: 1345
  kaynak: metin
  mudahale: ceviri
  denetim: tamam
  ilk_gecis: 1345

