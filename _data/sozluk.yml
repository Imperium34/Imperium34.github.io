- terim: "Aşkın"
  ingilizce: "Beyonder"
  cince: "非凡者"
  kategori: "Temel Kavramlar"
  aciklama: "Sıradan insanların ötesinde güçlere sahip olan, iksir içerek evrilmiş varlıklar."
  cevirmen_notu: "'Beyonder' (非凡者) İngilizcede 'Beyond' kökünden gelir ve sınırların ötesindeki kişiyi imler. Bu mantığın doğrudan kopyalanması ('Ötedekiler', 'Sınır Aşanlar') kelimeyi mistik ağırlığından ederek tarif edici bir unvana indirger; çoğu çeviri bu yüzden kelimeyi İngilizce bırakır. 'Aşkın' aynı kökü korur ama zaten yerleşik bir terimdir: nefsin sıradan tabiatını aşıp yeni bir hâle geçmek. Sâlik bu hâle doğuştan sahip değildir; disiplinle, çileyle ve dönüşerek kazanır. Bir Aşkın'ın iksirle kazandığı gibi. Bedeli de aynı yerden gelir: sülûk sırasında nefis nasıl yanılıp sapabiliyorsa, Aşkın da güç yolunda şirazesini yitirebilir.<br><br>Kelimenin gündelik Türkçede 'fazla/üzeri' anlamında kullanılması (yüzü aşkın kişi) bilinen bir itirazdır. O kullanım niteleyicidir ve daima bir sayıya bağlanır; terim ise isim olarak ve büyük harfle geçer. Metin içinde ikisi çakışmaz."
  bolum_siniri: 0
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

