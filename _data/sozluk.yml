- terim: "Melekler Beyi"
  ingilizce: "King of Angels"
  kategori: "Temel Kavramlar"
  aciklama: "Bir Gerçek İlah olmanın sadece bir adım gerisinde duran varlıklar. Genellikle en az bir Mertebe 1 hasleti ile o Yol'un Yegânelik parçasını barındıran veya birden fazla Mertebe 1 hasleti taşıyan eşsiz figürleri tanımlar."
  cevirmen_notu: "Çince aslı 天使之王 (Tiānshǐ zhī wáng) ve 王 (wáng) düz anlamıyla 'kral'dır. Buna rağmen 'Kral' tercih edilmedi; bunun sebebi bu varlıkların kanondaki konumudur. <br><br>Unvan, Üçüncü Çağ'da Kadim Güneş Tanrısı'nın buyruğundaki, sıradan meleklerden güçlü olan sekiz melek için kullanılmaya başlanmıştır. Yani doğduğu andan itibaren bir tâbiiyet ilişkisini içerir: bu varlıkların üstünde emir veren biri vardır. Sonradan terim, Başmeleklikten ileri fakat gerçek tanrılığa erişmemiş bütün varlıklar için genelleşse de aynı yapı korunur; kanon bu konumu açıkça bir eksiklikle tanımlar. Yegânelik ve üç adet Mertebe 1 Hasletinden herhangi biri eksikse Aşkın gerçek bir ilah sayılmaz ve yalnızca Melekler Beyi olarak anılır. 'Kral' ise Türkçede hiyerarşinin tepesini imler ve tam olarak bu eksikliği görünmez kılardı.<br><br>'Bey' ise kendi mertebesindekilerin arasından sivrilmiş, fakat üstünde daha yüksek makamlar bulunan kişiyi adlandırır. Melekliğin zaten Mertebe 1 ve 2'nin genel adı olduğu düşünülürse, unvan yeni bir basamak değil, aynı basamak içindeki bir üstünlüktür; 'Bey' bu yapıyı doğrudan karşılar. Ayrıca 'Kral' bu sözlükte başka Mertebe adlarında kullanılmaktadır (Denizlerin Kralı); unvanın ayrı bir kelimeyle karşılanması bu çakışmayı da önler.<br><br>Tercihin ikinci bir getirisi vardır. Serinin sonlarına doğru, bu varlıkların da üzerine çıkmış fakat tanrılığa bir adım kalmış bir hasmın karşısında Klein'ın zihninden geçen unvanlar ardı ardına yığılır: 神之左手, 天国副君, 天使之王中的天使之王 (Tanrı'nın Sol Eli, Melekût Naibi, meleklerin beylerinin beyi). Üçü de tırmanan bir dehşetin basamaklarıdır; sonuncusu ise sistemin kendi tavanının aşıldığını ilan eder: Melekler Beyi zaten meleklik basamağının en üstüdür, dolayısıyla onun da bir üstünün bulunması basamağın kendisinin yetersiz kaldığı anlamına gelir. İngilizcede 'King of King of Angels' bu yükü kaldıramaz; ifade dilbilgisel olarak bozuk durduğu için ağırlık yerine bir tuhaflık üretir. Türkçede ise 'Beylerbeyi' gerçek bir tarihî unvandır ve 'beylerin üstündeki bey' yapısını doğal biçimde taşır; rütbe üstüne rütbe bindiren bu yapı, kaynaktaki tırmanışı bozulmadan verir."
  cevirmen_notu_ek:
  - sinir: 1051
    baslik: "Eski tercihler"
    metin: "Bu Mertebe için önce 'Melekler Hanı' kullanılmıştı. Gerekçe, unvanı ilk taşıyanların Kadim Güneş Tanrısı'na bağlı olması ve bu varlığın modern dünyadan gelen, Rus veya o coğrafyaya ait bir insan olmasıydı; unvanın da bu coğrafi kökenle örtüşen bir kelimeyle karşılanması düşünülmüştü. İlk akla gelen 'Melekler Çarı' bu bağı fazla doğrudan kurduğu ve unvanı tek bir ulusal geleneğe hapsettiği için elenmiş, 'Melekler Voyvodası' gibi ara seçenekler denendikten sonra 'Han'da karar kılınmıştı.<br><br>Bu bağdan bütünüyle vazgeçildi. Birincisi, unvan kanonda Kadim Güneş Tanrısı'nın şahsına ait değildir: onun buyruğundaki sekiz melekle başlasa da sonradan bütün Aşkın Yolları için genelleşmiş, kurucusunun kökeninden bağımsız bir sistem terimi hâline gelmiştir. Kişiye ait bir çağrışımı sisteme ait bir unvana yüklemek bağı gereğinden fazla esnetiyordu. İkincisi, 'Han' Türk-Moğol siyasi geleneğine ait bir kelimedir ve bu bağı zaten pek kuramıyordu. 'Bey' ise siyasi bir gelenekten çok bir rütbe ilişkisi bildirdiği için grubun diline yabancı düşmez."
  bolum_siniri: 486
  kaynak: metin
  mudahale: ceviri
  denetim: tamam
  ilk_gecis: 486

