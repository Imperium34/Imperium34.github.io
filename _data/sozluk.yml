    - seviye: 3
      isim: "Solmaz (Unaging)"
      cevirmen_notu: "Çince ad 不老魔女 (Bùlǎo mónǚ) literal olarak 'Yaşlanmayan Şeytaniçe' veya 'Yaşlanmaz Şeytaniçe' anlamına gelir. 'Solmaz' ise doğrudan birebir çeviri değildir; bilinçli bir anlam aktarımıdır. Türkçede 'solmak' yalnızca bir şeyin rengini veya canlılığını kaybetmesini değil, özellikle çiçek, güzellik ve gençlik bağlamında tazeliğini ve çekiciliğini yitirmesini ifade eder. 'Solmaz' bu nedenle 'yaşlanmayan' niteliğini Türkçede daha şiirsel ve tematik bir biçimde karşılar: yaşlanmadığı için güzelliği solmayan kişi.<br><br>Bu tercih, Suikastçı Yolu'nun Mertebe 7 'Cadı' aşamasında gerçekleşen biyolojik dönüşümle özellikle anlamlıdır. Mertebe 7'den itibaren Aşkın giderek daha güzel ve çekici hâle gelir; yüksek Mertebelerdeki güzellikleri o kadar doğaüstü bir seviyeye ulaşır ki sıradan insanların dikkatini çekmemek için görünüşlerini bilinçli olarak çirkinleştirmeleri gerekir. Dolayısıyla Mertebe 3'ün 'Unaging' niteliği yalnızca biyolojik yaşlanmanın durması değildir: Cadı olarak başlayan kadınsı dönüşümün ardından güzelliğin ve gençliğin solmaması anlamını da taşır. 'Solmaz', bu iki anlamı tek bir Türkçe kelimede birleştirir.<br><br>Bu nedenle 'Yaşlanmaz' daha literal olsa da, 'Solmaz' Mertebenin kanonik işlevi ile Suikastçı Yolu'nun güzellik temasını birlikte yansıttığı için tercih edilmiştir."
      bolum_siniri: 589
      metinde: true
      kaynak: metin
      ilk_gecis: 495
    - seviye: 2
      isim: "Afet (Catastrophe)"
      sistem_kural: [tekil_rezerve]
      cevirmen_notu: "'Afet' Türkçede iki anlamı aynı anda taşır: felaket, yıkım; halk dilinde ise tehlikeli derecede güzel bir kadın için kullanılan bir tabirdir. Bu ikilik tesadüf değildir: kanon bu Yolun otoritesini doğrudan 'yıkıcı kadınlık' (Femme Fatale tiplemesi) olarak tanımlar. 'Afet' bu temayı tek bir kelimede, hem gücün ölçeği hem de Yolun kadınlıkla kurduğu ilişki üzerinden karşılar."
      bolum_siniri: 66
      metinde: false
      kaynak: yazar_beyani
