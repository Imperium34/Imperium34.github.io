      isim: "Dolandırıcı (Swindler)"
      bolum_siniri: 65
      metinde: true
      kaynak: metin
    - seviye: 7
      isim: "Sırbozan (Cryptologist)"
      cevirmen_notu: "Başlangıçta bu mertebe için akademik ve mesleki bir tınısı olan 'Rumuzcu' tercih edilmişti. Ancak yolun genel kötücül ve yıkıcı temasına uyum sağlaması ve kanonik bağları görünür kılması amacıyla 'Sırbozan' olarak revize edildi. Çince orijinali 解密学者 (Jiěmì xuézhě) içindeki 密 (mì - şifre/giz) karakteri, Soytarı ve Çırak yollarındaki 秘 (Mì - sır/gizem) ile eşseslidir. Bu iki yol gerçekliği 'Sır' (Sır Kuklabazı, Sır Efsuncusu) ile şifrelerken, Kapkaççı yolu bu sırları çözer ve istismar eder. 'Rumuzcu' pasif bir okuyucuyu imlerken, 'Sırbozan' doğrudan Amon'un ve bu yolun doğasındaki kural tanımaz, yıkıcı ve asalak karakteri ('bozmak' eylemi üzerinden) yansıtır."
      bolum_siniri: 697
      metinde: true
      kaynak: metin
      ilk_gecis: 697
    - seviye: 6
      isim: "Ateşçalan (Prometheus)"
      cevirmen_notu: "Çince orijinali '盗火人' tam olarak 'Ateş Hırsızı' (Fire Stealer) demektir. 'Ateş Hırsızı' yerine birleşik yapıdaki 'Ateşçalan' tercih edildi. Bu birleştirme eylemi, kelimeyi sıradan bir hırsızlıktan çıkarıp mitolojik ve folklorik bir arketipe (tıpkı Yelkovan veya Kardelen gibi) dönüştürür. İngilizcedeki Prometheus'un taşıdığı mitik ağırlığı, Batı mitolojisine yaslanmadan, Türkçenin kendi yapısal imkânlarıyla karşılar."
