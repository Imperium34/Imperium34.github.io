      cevirmen_notu: "'Efsuncu' kuralının genel gerekçesi için bkz. Sistem Kuralları #1. Bu Mertebenin özel bağı yapısaldır: Kâhin Yolu ile Çırak Yolu, Esrarın Efendisi (Lord of Mysteries) grubunun Kapkaççı Yolu'yla birlikte parçalarıdır; ortak Aslî Kale'dir. Kâhin Yolu ile Uykusuz Yolu arasındaki bağ ise tarihseldir (bkz. Ruh Efsuncusu, Uykusuz Yolu Mertebe 5)."
      sistem_kural: [buyucu_efsuncu_sahir, sir_esrar_gizem_hafi]
      bolum_siniri: 688
      metinde: true
      kaynak: metin
      ilk_gecis: 688
    - seviye: 3
      isim: "Müstekşif (Wanderer)"
      cevirmen_notu: "İlk tercih olan 'Avare', İngilizce 'Wanderer' karşılığıydı ancak Mertebenin ilerleme ilkesiyle (yasak sınırları amaçsız değil, bilgiyle dönmek üzere bilinçli aşmak) çelişiyordu. 'Avare' Türkçede amaçsız, başıboş bir dolaşmayı çağrıştırır, yani bu mertebedeki Aşkınların tam olarak kaçınılması gereken hâli adlandırır. 'Seyrânî' ve benzeri 'seyr' kökenli alternatifler reddedildi, çünkü bu kök zaten 'Âlem Seyyahı'nda ve başka bir Yol'daki 'Doğa Seyyahı'nda kullanılıyor. Üçüncü bir türev gereksiz bir tekrar yaratacaktı. 'Kâşif' de düşünüldü ancak bu Mertebedeki bir Aşkın için fazla modern/günümüzsel bir ton taşıyordu. 'Müstekşif' (bilinçli, sürekli bir keşif çabası içinde olan) hem 'Müneccim' ve 'Kâtip' ile aynı register'a oturuyor hem de ilerleme ayininin gerektirdiği amaçlılığı doğrudan karşılıyor."
      bolum_siniri: 1076
      metinde: true
      kaynak: metin
      ilk_gecis: 182
    - seviye: 2
      isim: "Âlem Seyyahı (Planeswalker)"
      sistem_kural: [bag_onarimi]
      cevirmen_notu: "Çince Mertebe 2 adı 旅法师 (lǚfǎshī), 4. Mertebedeki 秘法师 (mìfǎshī) ile ortak olan 法师 unsurunu taşır. Ancak bu ortaklık, iki Mertebe arasında kurulmuş bir dizge bağı değildir: 旅法师, Magic: The Gathering oyunundaki 'Planeswalker' teriminin Çincede yerleşik karşılığıdır ve ad bütün hâlinde ödünç alınmıştır. 法师 burada Yolun kendi terminolojisinden değil, ödünç alınan terimin içinden gelir.<br><br>Bu yüzden Türkçede 'Efsuncu' kökü kullanılmadı. Kullanılsaydı, kaynağın kendi dizgesinde bulunmayan bir bağ Türkçede icat edilmiş olurdu. 'Âlem Seyyahı', Mertebenin âlemler arası dolaşma niteliğini doğrudan karşılar ve ayin de bunu doğrular: bu gezegenin dışında dokuz ayrı yerde kendine dair efsaneler bırakmak."
      bolum_siniri: 1076
