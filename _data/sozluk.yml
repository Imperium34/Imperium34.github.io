      bolgesel:
        kultur: "Alternatif İsim"
        isim: "Efsunger (Witcher)"
      cevirmen_notu: "Çince aslı 猎魔者 (Liè mó zhě). Buradaki 魔 karakteri Suçlu Yolu'nun hem Mertebe 6'sında (恶魔) hem de Mertebe 4'ünde (魔鬼) bulunur; dolayısıyla kaynak metin avcıyı bu iki Mertebeden birine bağlamaz. Türkçede 'Şeytan Avcısı' denmesi ise bağlardı, zira 'Şeytan' bu sözlükte 魔鬼'ye tahsislidir (bkz. Şeytan, Suçlu Yolu Mertebe 4). Kaynakta bulunmayan bir bağı kurmuş olurduk.<br><br>'Şer' tercihi Mertebenin kendi kabiliyetlerinden gelir. Şer Avcısı Gözü bir görme yetisi değil, hedefin mahiyetini teşhis etme kabiliyetidir ve kanon bunu açıkça şer, yozlaşma ve fesat izlerine karşı duyarlılık olarak tanımlar. Yükselme ayini de aynı genişliği taşır: güçlü bir şeytanın ya da şerir bir mahlukun yol açtığı bir felaketi çözmek. Yani Mertebe belirli bir tür avlamaz, bir hâli teşhis eder ve ona karşı hazırlanır. 'Şer' soyut bir kelimedir ve 'avcı' ile yan yana geldiğinde alışılmadık durur; fakat Mertebenin kendi teşhis kabiliyeti de tam olarak bu soyutlamayı yapar, bir türü değil bir vasfı tanır.<br><br>Alternatif ad. Kanonda Mertebenin ikinci bir adı vardır: 猎魔人 (liè mó rén). Bu ad, Andrzej Sapkowski'nin Witcher serisinin Çincedeki yerleşik karşılığıdır ve 猎魔者'den yalnızca fail ekiyle ayrılır; yazar göndermeyi tek karakterlik bir kayıt farkıyla yapar.<br><br>Gönderme adla sınırlı değildir. Mertebenin kabiliyet listesi baştan sona Geralt'ın teçhizatıdır: özel bir tefekkür hâlinde iksir, merhem, esans ve işaret hazırlamak; canavarların ve otların hangi kısmının nasıl kullanılacağına dair bilgi; farklı yağların aynı anda etki etmesi için çift kılıç taşımak; Şer Avcısı Gözü kullanıldığında her iki göze beliren koyu yeşil sembol. Serideki en bilinen mensubu Colin Iliad da beyaz saçı ve yüzündeki yara izleriyle aynı figürün karşılığıdır.<br><br>Bu yüzden gönderme Türkçede de bir alternatif adla karşılanmıştır. 'Efsunger', Witcher 3'ün resmî Türkçe altyazılarında kullanılan karşılıktır; kitaplar ve dizi kelimeyi çevirmeden bırakmış olsa da oyunun Türkiye'deki erişimi çok daha geniştir ve göndermenin tanınma ihtimali en yüksek biçimi budur.<br><br>Not: 'Efsunger', Sistem Kuralları #1'in kapsamına girmez. O kural 法师 ve 巫 köklerinin hangi Türkçe kelimelerle karşılanacağını düzenler; 'Efsunger' ise bir kökün karşılığı değil, ödünç alınmış bir özel addır. 'Efsuncu' ile paylaştığı kök tesadüfidir ve bir bağ iddiası taşımaz (krş. Âlem Seyyahı, Sistem Kuralları #11)."
