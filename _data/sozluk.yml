    - seviye: 5
      isim: "Sır Kuklabazı (Marionettist)"
      cevirmen_notu: "Başlangıçta İngilizce 'Marionettist' karşılığı olarak 'Kukla Üstadı' kullanılmıştı, ancak dizgesel tutarlılık adına 'Sır Kuklabazı' olarak revize edildi. Bunun sebebi, İngilizce çevirinin metindeki devasa bir yapısal iskeleti tamamen yok etmesidir. Çince orijinalde bu mertebe 秘偶大师 (Mì'ǒu dàshī) şeklindedir ve ilk karakter olan 'Mì' (秘) doğrudan 'Sır/Gizem' anlamına gelir. Bu kelimenin eklenmesi metindeki iki temel kanonik bağı onarır.<br><br>Birincisi yatay bağdır: Çırak Yolu'nun 4. Mertebesi olan Sır Efsuncusu (秘法师 - Mì fǎshī) ile birebir paylaşılan 'Mì' kökü, İngilizcede silinmiş olan bu iki yol arasındaki yapısal akrabalığı kelime düzeyinde yeniden kurar.<br><br>İkincisi ve asıl önemlisi dikey bağdır. Seride bir Aşkın, beşeriyetten uluhiyetin ilk basamağına, yani yarı tanrılığa, 5. Mertebeden 4. Mertebeye tırmanarak geçer. Kâhin Yolunda ise, 5. Mertebe 秘 (Mì – Sır) karakterini taşır; 4. Mertebe, Garabet Efsuncusu, 诡 (Guǐ – Garabet) karakterini. Yan yana konduklarında ortaya çıkan 诡秘 (Guǐmì), hem Yüce Kadim'in adı, hem romanın adı, hem de Klein'ın kendi Yolunun ucunda duran unvanın ilk iki karakteridir: 诡秘之主 — Esrarın Hükümdarı. Üstelik tırmanış sırasında karakterler ters sırada karşılaşılır; ibare ancak geriye dönüldüğünde birleşir<br><br>Yani kanon, Yolun varacağı adı ikiye bölmüş ve insanın tanrılığa ilk adımını attığı iki basamağa yerleştirmiştir. Roman bu örtüşmeyi geç ve bilinçli olarak açık eder; okurun o anda geriye dönüp bağı kurabilmesi için, bağın adların kendisinde durmuş olması gerekir. İngilizce çeviri ('Marionettist' ve 'Bizarro Sorcerer') bu inşayı tamamen körleştirir: bağ ne okunurken görülür, ne de açık edildiğinde geriye dönük olarak görünür hale gelir.<br><br>Sır/Esrar ayrımının genel mantığı için bkz. Sistem Kuralları #8 (Sır / Esrar / Gizem / Hafi Sistemi)."
      sistem_kural: [sir_esrar_gizem_hafi, bag_onarimi, ustalik_ekleri]
