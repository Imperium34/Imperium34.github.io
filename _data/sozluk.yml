- terim: "Nizamı İnhilali"
  ingilizce: "The Anarchy"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Nizamın İnhilali (Anarchy)"
  aciklama: "Nizamın İnhilali,<br>Kaidelerin Ardındaki Gölge,<br>Kara İmparator'un Tahtı,<br>Yargı'nın Tedip Kılıcı,<br>Hercümerçten Neşet Eden,<br>Nizam Kisvesine Bürünen Kadim."
  cevirmen_notu: "Bu Yüce Kadim'in kanonda kendi başına duran bir tazim ismi yoktur; altı satır üç ayrı kanıt katmanından derlenmiştir.<br><br>1-2. satırlar (KANON): Mevcut tek doğrudan kaynak, Hercümercin Oğlu'nun altı satırlık birleşik tazim isminin ilk iki satırıdır (失序者, 秩序阴影); kalan dört satır Müphem Sis'e aittir ve bu ayrım kanonik olarak doğrulanmıştır (bkz. Hercümercin Oğlu ve Müphem Sis maddeleri). Bu iki satır burada Nizamın İnhilali grubunun (Avukat ve Arabulucu Yolları) kendi tazim ismi olarak çıkarılmış ve ayrıştırılmıştır; 'Kotar' maddesindeki tamamlama mantığıyla aynı yöntemdir. Doğrudan çeviridir: 失序者 → 'Nizamın İnhilali' (Yol grubunun her iki üyesinin Mertebe isimlerine gönderme yapar), 秩序阴影 → 'Nizamın Gölgesi'.<br><br>3. satır (İKİNCİL KAYNAK): 'Hercümerçten Neşet Eden', bu Yüce Kadim'in İngilizce wiki maddesindeki başlık altı epigrafından ('Chaos gave birth to order, and order came with its own shadow') alınmıştır. Bu epigraf kanonda tazim isminin bir parçası değildir, ancak varlığın kökenine dair doğrudan ve kanona uygun bir ifadedir; bu yüzden satır olarak kullanılmaya değer görülmüştür.<br><br>4-6. satırlar (SENTEZ): 'Kaidelerin Ardındaki Gölge', 'Kara İmparator'un Tahtı' ve 'Yargı'nın Tedip Kılıcı' hiçbir tek kaynaktan alınmamıştır; bu Yüce Kadim'in iki Yolunun (Avukat, Arabulucu) kendi Mertebe 0 unvanlarına (Kara İmparator, Yargı) ve genel kanonik rolüne (kaidelerin arkasındaki güç, düzenin gölgesi) dayanarak tarafımca kurulmuştur. Doğrudan bir kaynak satırının çevirisi veya tamamlaması değil, doğrulanmış olgulardan yapılan bir sentezdir."
  bolum_siniri: 1347
  kaynak: metin
  mudahale: tamamlama
  denetim: tamam
  ilk_gecis: 1347

- terim: "Müphem Sis"
  ingilizce: "Uncertain Mist"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Müphem Sis (Uncertain Mist)"
  aciklama: "Nur ile Zulmet Arasındaki Cisr,<br>Siyah ile Beyaz Arasındaki Rahne,<br>Ebediyen Müphem Sis,<br>Cümle Eşyaya Nâzır Hakikat."
  cevirmen_notu: "Bu dört satır, Hercümercin Oğlu'nun altı satırlık birleşik tazim isminin kalan dört satırıdır (光与暗的桥梁，黑与白之间隙，永不确定的迷雾，监督万物的真理) ve kanonda tam olarak mevcuttur; 'Nizamın İnhilali' maddesinin aksine bir tamamlamaya ihtiyaç yoktur.<br><br>1. satır: 光 (ışık) için 'Işık' değil 'Nur' tercih edildi. 'Cisr' klasik registeri korumak için 'köprü' yerine tercih edildi.<br><br>2. satır: 'Rahne' (gedik/yarık) doğrudan 隙 karşılığıdır; 1. satırdaki 'Cisr' (birleştiren) ile kasıtlı bir karşıtlık kurar (birleştiren/köprü kuran vs. ayıran/yaran).<br><br>3. satır: 'Müphem', 永不确定 ('asla kesinleşmeyen/belirlenemeyen') için tercih edildi; daha güncel 'belirsiz' yerine klasik registeri koruyan bir Arapça köken kelimedir. Bu satır aynı zamanda varlığın Türkçe adının (Müphem Sis) doğrudan kaynağıdır.<br><br>4. satır: 监督 (gözetmek/nezaret etmek) için 'Nâzır' tercih edildi."
  bolum_siniri: 1270
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

