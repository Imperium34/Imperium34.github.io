- terim: "İlim ve Hikmetin İlahı"
  ingilizce: "God of Knowledge and Wisdom"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Kadir-i Mutlak (God Almighty)"
  aciklama: "İlim Burcu,<br>İlim ve Hikmetin İlahı,<br>Aklın Nuru,<br>Bahr-i İrfan."
  cevirmen_notu: "Kanonik unvan dört satırdır (知识之塔 / 理性化身 / 智慧之神 / 洞悉万物的学者). Türkçe versiyonda üç müdahale bulunur.<br><br>(1) 2. ve 3. satırlar yer değiştirmiştir; ayrıca kanonun 智慧之神 ('hikmet ilahı') satırı yerine ilahın tam adı kullanılmıştır.<br><br>(2) 'Aklın Nuru', 理性化身'in literal karşılığı değildir. 'Tecessüm/化身' bedenlenmeye dayalı bir imgedir. 'Nur' ise İşrâkî geleneğin akıl-ışık özdeşliğine (nûr-ı akl) yaslanarak aynı işlevi görür.<br><br>(3) 4. satır 'Bahr-i İrfan' literal çeviri değildir; kanondaki 洞悉万物的学者 ('her şeyi kavrayan alim') satırının yerine yazılmıştır. Kanon satırı bir fail (alim) tanımlarken Türkçe satır bir mahiyet (derya) tanımlar. Sebep: 'irfan', klasik tasnifte 'ilim'den (kesbî bilgi) ayrı olarak vehbî/tecrübî bilgiyi imler. Bu satırla birlikte unvan ilim–hikmet–akıl–irfan dörtlüsünü kapsar; kanonun bilgi/akıl/hikmet/kavrayış dizisinin Türkçedeki tam karşılığı bu dörtlüdür."
  bolum_siniri: 3
  kaynak: metin
  mudahale: degistirme
  denetim: tamam
  ilk_gecis: 3

- terim: "Cenk Tanrısı"
  ingilizce: "God of Combat"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Sermedi Zulmet (Eternal Darkness)"
  aciklama: "Kudret ve Şanın Timsali,<br>Ulu Şövalye İlahı,<br>Harp Hükümdarı,<br>Top ve Tüfeğin Hamisi,<br>Cümle Mevcudatın Gurubu."
  cevirmen_notu: "Çince adı 战神 (Zhànshén), Çincede savaş tanrısı için en yerleşik ve kısaltılmış kalıptır; 战争 (harp) gibi kurumsal savaşı adlandıran bir kavram değil, bir varlığa verilen addır. Bu sözlükte 'Cenk' bu ada tahsis edilmiştir; 战争 geçen her yerde 'Harp' kullanılır (bkz. Harp Ruhbanı).<br><br>Ayrım kanonik bir ihtilafı taşır. Tazim adındaki 'Harp Hükümdarı' (战争主宰) satırı, aslında Ahmer Hünkar Yolu'nun Gerçek İlahı'na ait bir unvandır; harp, o Yolun sembolizminde (战争之主) ve salahiyetleri arasında doğrudan yer alır. Cenk Tanrısı'nın bu alanı talep edebilmesinin tek sebebi, o Yolun bütün meleklerinin ölü veya mahpus olması ve Gerçek İlahı'nın hiç bulunmamasıdır; yani iddia bir hakka değil, bir boşluğa dayanır. Nitekim boşluk kapanmadan Cenk Tanrısı Ebedi Gece Tanrıçası tarafından öldürülür ve kiliseleri, kimseye bildirilmeksizin O'nun idaresine geçer.<br><br>Türkçedeki kelime ayrımı bu durumu olduğu gibi korur: varlığın adı Cenk'tir, talep ettiği alan ise Harp'tir. Tek kelimeyle karşılansaydı unvan hak edilmiş bir sıfat gibi okunur ve kanonun kurduğu boşluk görünmez olurdu."
  sistem_kural: [salahiyet_adlari]
  cevirmen_notu_sinir: 1409
  bolum_siniri: 3
  kaynak: metin
  mudahale: ceviri
  denetim: tamam
  ilk_gecis: 3

