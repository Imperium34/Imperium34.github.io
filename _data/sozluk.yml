    - seviye: 3
      isim: "Harp Ruhbanı (War Bishop)"
      cevirmen_notu: "Çince aslı 战争主教 (Zhànzhēng zhǔjiào). Buradaki 战争, kurumsal ve büyük ölçekli savaşı adlandıran kelimedir; Çincede tekil çarpışmayı veya destansı bir dövüşü imleyen 战 (zhàn) ile aynı şey değildir. Ayrım bu sözlükte 'Harp' ve 'Cenk' arasında korunmuştur.<br><br>Tercih yalnızca kayıt meselesi değildir; kanonik bir ihtilafı görünür kılar. 战争, Ahmer Hünkar Yolu'nun sembolizminde (战争之主, Harbin Hükümdarı) ve salahiyetleri arasında doğrudan yer alır; savaşın sahibi bu Yoldur. Buna karşılık Cenk Tanrısı'nın (战神) Tazim adında 'Harp Hükümdarı' (战争主宰) satırı bulunur ve kanon bu iddianın karşılıksız olduğunu açıkça belirtir: 'Harp Hükümdarı' alan genişletmeye çalışmıştır, oysa savaşın kendisi Ahmer Hünkar Yolu'na aittir. Medici'nin melek adı da (战争天使, Harp Meleği) aynı kelimeyi taşır.<br><br>Bu yüzden 战争 geçen her yerde 'Harp' kullanılır; 'Cenk' ise yalnızca 战神'nin adına, yani Cenk Tanrısı'na ayrılmıştır. Türkçede bu ayrım korunmadığı takdirde, iki varlığın aynı kelime üzerinde hak iddia ettiği görünmez olur ve Cenk Tanrısı'nın unvanı hak edilmiş bir sıfat gibi okunurdu. Ayrım korunduğunda ise durum kaynaktaki haliyle kalır: bir varlık savaş tanrısı olarak anılır, fakat harbin kendisi bir başkasının salahiyetidir.<br><br>主教 için 'Ruhban' tercihinin genel gerekçesi için bkz. Sistem Kuralları #3 (Piskopos / Ruhban)."
      sistem_kural: [piskopos_ruhban, salahiyet_adlari]
      bolum_siniri: 940
      metinde: true
      kaynak: metin
      ilk_gecis: 940
    - seviye: 2
      isim: "Musahhir (Weather Warlock)"
      eski_karsiliklar: ["Bora Efsuncusu", "Bora Kamı"]
      cevirmen_notu: "Bu Mertebede iki kez yanlış menüden seçim yapıldı. Önce 'Bora Efsuncusu' denendi; sonra 'Efsuncu' kökünün yalnızca Kâhin, Çırak ve Uykusuz Yolları arasındaki kanonik bağa ait olduğu, Avcı Yolu'nun ise o bağın dışında kaldığı karar verilince 'Bora Kamı'na geçildi. Ne var ki her iki tercih de aynı varsayımı paylaşıyordu: bu Mertebenin bir BÜYÜCÜ olduğu. Kabiliyet listesi bu varsayımı desteklemiyor.<br><br>Mertebenin sahip olduğu şeyler sırasıyla şunlar: Emir Zinciri, Toplama (kudretini bütün orduya paylaştırma), Savaş Sisi, Cenk Nârası, Cenk Cevherine kurban sunma ve Felaket Devi suretine bürünme. Hiçbiri efsun değildir. Hava salahiyeti bile bir büyü gibi değil, bir sevk-idare aracı gibi kullanılır: kanon, kudreti kendinde toplamak yerine maiyetine dağıtmanın daha mantıklı olduğunu söyler, zira 'bir kelebeğin kanat çırpışı kasırgaya dönüşür'. Dolayısıyla Sistem Kuralları #1 (Büyücü / Efsuncu / Sahir Sistemi) bu girdiye HİÇ UYGULANMAZ; mesele hangi büyü kelimesinin seçileceği değil, kelimenin büyüyle ilgili olmadığıdır. İngilizcedeki 'Warlock' burada kaynağın değil, İngilizce çevirinin tercihidir.<br><br>Mertebenin kendi rol ifası ilkesi meseleyi kesin olarak çözüyor. Lumian, Güney Kıta'da kan kurbanı geleneğini sürdüren bir kabileye üç gün boyunca aşırı hava şartları getirir; kabile korkudan kırılıp teslim olur ve o geleneğini terk eder. İlkenin kendi ifadesi şudur: havaya hükmetmek, bir felaket getirip hedefi BOYUN EĞDİRMEKTİR. Yani Mertebe bir kumandanlık değil, bir tahakküm makamıdır; kendi ordusunu yönetmekten çok, karşı tarafın iradesini kırar.<br><br>'Musahhir' bu ikiliği tek kelimede taşır. Teshîr (تسخير) hem birini boyunduruk altına almak hem de bir tabiat kuvvetini emre âmâde kılmaktır. Rüzgârların ve bulutların bir kimseye musahhar kılınması bu kökün klasik kullanımıdır. Mertebe havaya tam da boyun eğdirmek İÇİN hükmettiğine göre, iki mana ayrı iki iş değil, aynı işin iki yüzüdür. Devellioğlu ayrıca 'büyüleyen' manasını da verir; bu da girdinin Cazibe (Charm) hassasını, yani insanların ona tâbi olmak ve sadık kalmak istemesini karşılar. Tek kelime, üç hassayı birden tutuyor.<br><br>'Kahhâr' ilk bakışta daha uygun görünse de el-Kahhâr esmâdandır ve o kural gereği yalnızca Kadîr-i Mutlak yol grubuna tahsislidir. Kuralın bariz bir tercihi eledigi durumlardan biri.<br><br>Sıfat olarak yalın bırakıldı. Yolun kendisi zaten tek kelimelik unvanlar taşıyor (Avcı, Hasatçı, Fatih) ve 'Musahhir', Fatih'in hemen altında dururken doğru ağırlığı veriyor: Demirkan Akıncısı → Cenk Ruhbanı → Musahhir → Fatih → Ahmer Hünkar. 'Bora Musahhiri' hava unsurunu isimde açık ederdi; sesçe ağır olduğu ve Felaket Devi suretiyle birlikte zaten hava anlamı bağlamdan çıktığı için tercih edilmedi."
      bolum_siniri: 577
      metinde: true
      kaynak: metin
      ilk_gecis: 577
