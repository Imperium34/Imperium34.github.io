    - seviye: 8
      isim: "Düşmüş Melek (Unwinged Angel)"
      bolgesel:
        kultur: "Alternatif İsim"
        isim: "Cani (Coldblooded)"
      cevirmen_notu: "Çince aslı 折翼天使 (Zhé yì tiānshǐ), düz anlamıyla 'kanadı kırık melek'tir. İngilizce 'Unwinged Angel' bu ifadeyi kanatsızlığa çevirir; oysa ikisi aynı şey değildir. Kanatsızlık bir yokluğu, kanadın kırılması ise bir düşüşü imler. Melek kanadını hiç taşımamış değildir, yitirmiştir.<br><br>Mertebenin kendi tanımı bu okumayı doğrular: bu aşamadan itibaren Aşkın vicdanını yitirir, kötücül arzularına teslim olur, iyi ile kötü ayrımı ortadan kalkar ve bedeni gitgide daha az insana benzer. Yani ad bir hâli değil, bir düşüşün tamamlanmış hâlini adlandırır. İmge yeteneklerde de sürer: Mertebenin en yaygın kabiliyeti olan Ağırlaştırma, hedefin hareketlerini 'uçmak için kullandığı kanatlar kırılmış gibi' ağırlaştırır.<br><br>'Kanadı Kırık Melek' birebir karşılık olurdu ancak üç kelimeye çıkarak Mertebe adları için fazla uzun kalıyordu. 'Düşmüş Melek' aynı hareketi tek sıfatla taşır ve Türkçede yerleşik bir imgedir. Alternatif ad olan 'Cani' (冷血者, soğukkanlı) ise bu düşüşün ardından kalan hâli adlandırır; kanon bu Mertebedeki bir Aşkının en şiddetli çatışmanın ortasında bile duygusuz denecek kadar sakin kalabildiğini belirtir. İki ad birlikte, düşüşü ve düşüşten sonra geriye kalan soğukluğu birlikte verir.<br><br>Tercihin ikinci bir getirisi vardır. Türkçede 'Düşmüş Melek' ile Yolun Mertebe 0'ı olan 'Hâviye' aynı kökten beslenir: Hâviye kelimesi هوى kökünden gelir ve kök anlamı düşmek, uçuruma yuvarlanmaktır. Böylece Yol, Türkçede Mertebe 8'de bir düşüşle başlar ve Mertebe 0'da düşüşün kendisi hâline gelir; kanonun Hâviye'yi 'içine düşen herkesi kaçınılmaz olarak alçalmaya sürükleyen ortam' olarak tanımlaması bu bağı doğrudan destekler. Çince adlarda (折翼 ve 深渊) böyle bir ortaklık yoktur; bağ Türkçenin kendi kelime köklerinden doğar."
      bolum_siniri: 258
      metinde: true
      kaynak: metin
      ilk_gecis: 258
    - seviye: 7
      isim: "Seri Katil (Serial Killer)"
      bolum_siniri: 258
      metinde: true
      kaynak: metin
      ilk_gecis: 258
    - seviye: 6
      isim: "Gulyabani (Devil)"
      cevirmen_notu: "İlk tercih olan 'İblis', İngilizcedeki 'Devil' karşılığı olarak doğru görünse de bu Mertebenin gerçek doğasıyla örtüşmüyordu: kanon bu aşamadaki bir Aşkının en büyük zaafının kolayca kontrolü kaybetmesi olduğunu, kan ve cinayet arzusuyla ele geçirilmeye açık, vahşi ve fiziksel bir varlık olduğunu belirtir.<br><br>Burada bir parantez açmak gerekir. Webnovel'in resmî İngilizce çevirisinde Mertebe 6 'Devil', Mertebe 4 ise 'Demon' olarak adlandırılır; oysa Çince adlar bunun tersini söyler. Mertebe 6'nın adı 恶魔 (èmó), Mertebe 4'ünki ise 魔鬼 (móguǐ)'dir. 魔鬼, Çincede İncil'in şeytanını karşılayan yerleşik kelimedir; 恶魔 ise genel anlamda kötücül, canavarımsı varlığı adlandırır. İngilizce çeviri iki adı yer değiştirmiştir. Bu sözlük İngilizce adları değil, Çince adları ve her Mertebenin kendi kanonik doğasını esas alır.<br><br>'Gulyabani', 恶魔'nun bu Mertebedeki karşılığıdır: gerçek bir Osmanlı-Türk halk anlatısı canavarı, insan yiyen, tamamen fiziksel bir dehşet figürü. Mertebenin vahşi ve kontrolsüz doğasını 'İblis'ten daha isabetli karşılar. Tercihin ikinci bir getirisi vardır: Suçlu Yolu, Mahkûm Yolu'nun kardeş yoludur ve o Yolun klasik canavar kadrosuyla (Kurtadam, Hortlak, Tayf) aynı halk anlatısı köküne ait bir kelime, iki kardeş yol arasında hafif ama gerçek bir yankı kurar.<br><br>Mertebe 4'te 'Şeytan' tercih edilmesi ise doğrudan 魔鬼'nin kendisinden gelir: Çincede İncil'in şeytanını adlandıran kelimenin Türkçedeki birebir karşılığı 'Şeytan'dır.<br><br>İngilizce çevirideki Suçlu Yolu ile Savaşçı Yolu arasındaki Demon → Demon Hunter yankısı Türkçede korunmaz, çünkü kaynakta zaten yoktur; Demon Hunter'ın orijinal Çincesi olan 猎魔者'deki 魔 Suçlu Yolunun hem 6. hem de 4. mertebesinde geçen bir karakterdir ve avcıyı hiçbirine spesifik olarak bağlamaz. (detay için bkz. Şer Avcısı, Savaşçı Yolu Mertebe 4)."
      bolum_siniri: 414
      metinde: true
      kaynak: metin
    - seviye: 5
      isim: "Arzu Havarisi (Desire Apostle)"
      cevirmen_notu: "Çince aslı 欲望使徒 (Yùwàng shǐtú) ve 使徒, Çincede havari için kullanılan yerleşik kelimedir; karşılık doğrudandır.<br><br>Ayin, adın taşıdığı dinî imgeyi destekler görünmektedir: yükselmek için düşkün kimseleri hedef alan bir dizi cinayet işlemek, her cinayetten sonra kurbanın iç organlarını yemek gerekir ve öldürülecek kişi sayısının alt sınırı on üçtür. Bu sayı, İsa ve on iki havariden oluşan on üçlü kadroyu çağrıştırır. Kanon böyle bir bağı açıkça kurmaz; ancak serinin İbrahimî metinlerle kurduğu yoğun ilişki ve Âdem'in doğrudan İncil'den alıntı yapması göz önüne alındığında, sayının tesadüfi olmadığı düşünülebilir. Ayinin bir dizi cinayeti âyin hâline getirmesi ve organ yemenin komünyon imgesini tersine çevirmesi de aynı yönü işaret eder.<br><br>'Havari' bu yüzden korunmuştur. 'Mürit' veya 'Talip' gibi karşılıklar bağlılığı verirdi ancak kelimenin taşıdığı belirli dinî kadroyu ve dolayısıyla sayının kurduğu örtük göndermeyi taşımazdı."
      bolum_siniri: 414
      metinde: true
      kaynak: metin
      ilk_gecis: 414
