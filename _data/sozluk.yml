- terim: "İlahiyat ve Beşeriyet"
  ingilizce: "Divinity and Humanity"
  kategori: "Temel Kavramlar"
  aciklama: "Yüksek mertebeli Aşkınların (özellikle Mertebe 4 ve üzeri) içlerinde yaşadıkları nihai varoluşsal çatışma. Aşkın, mertebelerde yükseldikçe iksirin getirdiği ilahi doğa (İlahiyat) uyanır ve kişinin insanî duygularını, ahlakını ve dünyevi bağlarını (Beşeriyet) yutmaya başlar. Ruhani çıpalara duyulan ihtiyacın temel sebebi bu Beşeriyeti korumaktır."
  cevirmen_notu: "'Humanity' kelimesi için doğrudan 'İnsanlık' yerine 'Beşeriyet' tercih edilmesi bilinçlidir. Aşkınların ilahi katmanlara çıktıkça geride bıraktıkları o aciz, fani ve dünyevi doğayı 'beşer olma hali' çok daha keskin yansıtır. 'İlahiyat' ile 'Beşeriyet' arasındaki bu gerilim, sözlüğün genel klasik/teolojik dil kaydına kusursuzca oturur."
  bolum_siniri: 1403
