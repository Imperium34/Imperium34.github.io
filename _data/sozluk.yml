    - seviye: 6
      isim: "Felaket Müjdecisi (Calamity Priest)"
      cevirmen_notu: "'Müjde/Müjdeci' normalde sevindirici bir haberin; doğum, zafer, kabul olmuş dua vs. habercisini tanımlar; burada bilinçli olarak 'Felaket' ile eşleştirilmiştir. Bu tercih tesadüfi bir ironi değildir: Mertebenin gerçek yeteneği (Calamity Attraction, Psyche Storm) bir rahibin felaketlere sadece katlanmasından ibaret değildir. Felaketleri öngörüp bizzat düşmana yönlendirebilir, adeta kaçınılmaz bir haberi 'müjdeler gibi' sunabilir. Yani 'Müjdeci' burada karanlık bir zevki de örtük olarak taşır: bu rahip için felaket gerçekten de bir tür 'muştu'dur."
      bolum_siniri: 910
      metinde: true
