      cevirmen_notu: "Çince aslı 神孽 (Shén niè). 神 ilah, 孽 ise klasik kullanımda hem günahı hem de günahtan doğan uğursuz evladı imler (孽子: asi, gayrimeşru evlat). Ad bu haliyle Mertebenin kendisini değil, kökenini adlandırır: bu varlık bir ilahtan gelir. Wiki'nin literal karşılığı da bunu doğrular ('Divine Abomination').<br><br>Ayin bu okumayı birebir karşılar: yükselmek için gerçek bir ilahın (veya Yegâneliği barındıran bir Melekler Beyi'nin) takdisini almak gerekir ve takdisi veren varlık bu esnada Lanetlerin Menbaı sembolünden doğan bir Delilik Laneti'ne uğrar. Yani Aşkın, bir ilahın kendisine zarar vererek doğurduğu şeydir.<br><br>Bu Mertebe için önce 'Hilkat Garibesi' kullanılmıştı. İngilizce 'Abomination' ile örtüşüyordu, ancak 神 unsurunu bütünüyle düşürüyor ve yalnızca sonucu (doğuştan biçimsizlik) tarif ediyordu; kaynağın adında bulunan ilahi köken görünmez kalıyordu.<br><br>'Ulûhiyet' bu sözlükte zaten Divinity karşılığıdır; Mertebe adının aynı kelimeyi taşıması, adı sözlüğün kendi terim dağarcığına bağlar. 'Nekbet' ise 孽'nin uğursuzluk, felaket ve düşkünlük katmanını karşılar. Kabul edilen kayıp, 孽'nin taşıdığı doğurulmuşluk anlamıdır; tamlama yapısı ('ilahın nekbeti') bu bilginin yönünü korusa da, kelimenin kendisinde bir doğum imgesi kalmaz."
