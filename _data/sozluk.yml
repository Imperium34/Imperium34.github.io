      kaynak: metin
      ilk_gecis: 940
    - seviye: 0
      isim: "Ahmer Hünkar (Red Priest)"
      bolum_siniri: 456
      cevirmen_notu: "'Priest' için 'Rahip' bilinçli olarak kullanılmadı. Türkçede 'Rahip' kelimesi bir harp ilahına tonal olarak yanlış oturur. 'Hünkar', Osmanlı sultanlarına verilen ve hükümdarlığın kutsal yönünü taşıyan bir unvandır. Sultanlar aynı zamanda halife ve 'Allah'ın yeryüzündeki gölgesi' sıfatını taşıdığından, unvan hem hükümranlık hem ruhbanî boyutu birlikte kapsar. Bu, Red Priest'in Fetih (Conquest) ile Kurban (Sacrifices) otoritelerini birleştiren doğasına 'Rahip'ten daha sadıktır. Kanon gloss da bunu destekler: 'Priest, bir kuvvet ayini olarak anlaşılabilir' yani unvan aslen ruhbanî değildir."
      cevirmen_notu_ek:
      - sinir: 456
        baslik: "Neden Ahmer?"
        metin: "Çince aslı 红祭司'deki 红 (hóng), Çincede kırmızının gündelik adıdır ve kaynak metinde şeffaftır. Buna rağmen 'Kızıl' kullanılmadı.<br><br>Birinci sebep tahsistir: 'Kızıl' bu sözlükte Kızıl Ay (Crimson Moon) imgesine ayrılmıştır. Kızıl Ay kanonda bağımsız ve merkezî bir varlıktır; rengin onun adına bağlı kalması, başka bir Yolun Mertebe 0'ında aynı kelimenin görünmesiyle bulanacaktı. Renk adları da mistik register kelimeleri gibi, çağrıştırdıkları varlığa bağlı tutulur.<br><br>İkinci sebep kayıttır. 'Kızıl' modern Türkçede siyasi bir çağrışım taşır ve bir harp ilahının unvanında istenmeyen bir gürültü yaratır. 'Ahmer' ise Yolun genel kaydına (Musahhir, Fatih, Hünkar, Harp Ruhbanı) oturur ve 'Ahmer Hünkar' sesçe de derli topludur.<br><br>Bu tercih, bu sözlüğün arkaik kelime ölçütüne aykırı değildir: 'Ahmer' burada 'kızıl'ın taşımadığı bir anlamı geri getirdiği için değil, taşıdığı fazladan çağrışımlardan kaçınmak için seçilmiştir. Kelimenin kapalılığı ise bağlamla giderilir; unvan her geçtiğinde bir Yolun ve bir ilahın adı olarak görünür, tek başına bir renk bilgisi taşımaz."
      metinde: true
      kaynak: metin
      ilk_gecis: 456
  kaynak: metin

