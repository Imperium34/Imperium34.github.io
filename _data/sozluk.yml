# -----------------------
# İLAHLAR VE YÜCE KADİMLER
# -----------------------

- terim: "Soytarı Efendi"
  ingilizce: "Mr. Fool"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Esrarın Hükümdarı (Lord of the Mysteries)"
  aciklama: "Bu asra mensup olmayan Soytarı,<br>Gri sislerin fevkindeki esrarlı Hükümdar,<br>Talihe hükmeden Sarı ve Siyahın Kralı."
  sistem_kural: [bag_onarimi]
  cevirmen_notu: "Aptal, Ahmak, Budala, Meczup veya Mecnun gibi doğrudan karşılıklar yerine 'Soytarı' seçildi. Tarot destesinde 0 numaralı kart sadece bir aptallığı değil; bir başlangıcı, kuralların dışına çıkmayı ve henüz biçimlenmemiş sonsuz potansiyeli imler. 'Aptal' bu kartın hiçbir anlamını taşımaz, yalnızca bir hakaret taşır. 'Mecnun' ise farklı bir sebeple reddedildi. Bu kelime Aptal/Ahmak ailesi gibi düz bir hakaret değildir, ama taşıdığı çılgınlık çok spesifik bir çılgınlıktır: Leyla ile Mecnun'dan miras kalan, aşk yüzünden aklını kaybetme hâli. Kartın kendisinde, Klein'ın durumunda ya da Kâhin Yolu'nun tarif edilen doğasında bu türden bir aşk-delilik teması yoktur. Böyle bir çağrışım eklemek, kartın hiç sahip olmadığı bir anlamı ithal etmek olurdu. Kısacası Aptal/Ahmak kelimeyi aşağılar, Mecnun ise yanlış bir çılgınlık türü yükler. İkisi de kartın gerçek anlamını taşımaz. (Mecnun'un burada reddedilmesi kelimenin kendisine dair bir hüküm değildir; doğrudan cinnet bildiren bir kaynağın karşılığı olduğu yerde kullanılır; bkz. Mecnun Sahiri, 狂乱法师.)<br><br>Klein özelinde daha da belirleyici bir gerekçe var: bu ismi seçtiği sahnede kendisiyle sürekli dalga geçen, ne olduğunu bilmediği bir dünyada rol yapan biridir. Kendine 'aptal' ya da 'şapşal' demek şaka değil, sövgü olurdu. 'Soytarı' demek ise dürüstlüktür. Aşkınların varlığından bile habersizken ilah rolü oynayan bir adamın kendi durumunu tam olarak tarif etmesidir. Sözcük, dünyayı kurmadan önce karakteri kuruyor."
  cevirmen_notu_ek:
  - sinir: 251
    baslik: "Yolun dokusu"
    metin: "Tercihi destekleyen ikinci bir gözlem var. Kâhin Yolu'nun bilinen ilk Mertebeleri (Kâhin, Palyaço, Hokkabaz, Suretsiz, Sır Kuklabazı) istisnasız birer icra mesleğidir. Dahası bu icranın sahnesi kademe kademe büyür: bir kâhin köhne bir çadırda, palyaço sokakta veya sirkte, hokkabaz boş bir sahnede, kuklabaz ise kuklaları için kurulmuş donanımlı bir sahnede çalışır.<br><br>Bu yalnızca adların değil, kabiliyetlerin de kurduğu bir dokudur. Yolun araçları Mertebe atladıkça değişmez, yalnızca ölçek büyütür: Palyaço'nun kâğıdı hançere dönüştürme yetisi Hokkabaz'da her türlü silaha, Garabet Efsuncusu'nda yaraları ve hastalıkları üstlenen kâğıt suretlere, Mazinin Alimi'nde kehaneti, takibi ve bakışları saptıran suretlere evrilir. İllüzyon da aynı yolu izler: Hokkabaz renk, ses ve kokuyla oynarken Garabet Efsuncusu koca bir yolcu gemisini gizler. Yani Yol boyunca icracı meslek değiştirmez; aynı numaraları ilahî ölçekte yapmaya başlar.<br><br>Türkçe karşılıklar bu dokuyu korumak üzere seçildi; 'Soytarı' da bu meslekler ailesine aittir, saf bir hakaret sözlüğüne değil."
  - sinir: 1384
    baslik: "İcracının kader karşısındaki yeri"
    metin: "Yolun rol ifaları okunduğunda, icracının kader karşısındaki konumunun Mertebe Mertebe değiştiği görülür. Kâhin kadere karşı korku ve saygı besler, yorumuna körü körüne güvenmemesi öğütlenir. Palyaço kaderi biraz bilir ama karşısında çaresizdir; acısını, kederini ve şaşkınlığını gülen bir yüzün ardına gizler. Hokkabaz inisiyatifi eline alır, imkânsıza meydan okur, fakat sonucun bir yanılsamadan ibaret olması kabul edilmiştir. Sır Kuklabazı artık sahnede değildir, perde arkasından yönetir. Mazinin Alimi kaderi görür, bugüne tesir eder, ama geçmişi geri çeviremez; ayini de onu bizzat geçmişe çevirir: üç yüz yıl gerçeklikten kopup tarihin kendisi hâline gelmek. Mucizekâr'ın rol ifası, icracının ilahî duruşu takınmasını açıkça yasaklar: bir ilah gibi değil, mucize sergileyen bir kişi gibi. Mucizeler bir ana mahsustur, oysa kader uzun sürer. Esrar Hadimi yalnızca hizmet eder.<br><br>Ve Mertebe 0'ın yükselme ayini tek bir cümledir: zamanı, tarihi veya kaderi bir kez kandırmak.<br><br>Kanonik Rol ifasında Yol boyunca kaderin karşısında saygılı, çaresiz, gizlenen ve nihayet hizmet eden icracı, sonunda kaderi kandırır. Fakat kazandığı şey bir zırh değildir. Kanonik betimleme Soytarı'yı bir uçta güçlü, öbür uçta kırılgan olarak tarif eder: bir yıldızı yok edebilecek kudrettedir, fakat o yıldıza doğrudan bakamaz; savunması çoğu Mertebe 0'dan zayıftır. Bu bir eksiklik değil, mesleğin kendisidir. Bütün gücü kandırmaya, yanılsamaya ve yerine koymaya dayanan bir varlığın zırhı olmaz; kâğıt sureti, kukla takası ve Kandırma salahiyeti darbeyi karşılamaz, başka bir yere yönlendirir.<br><br>Sınırsız imtiyaz, sıfır zırh: bu, tam olarak bir saray soytarısının konumudur. Hükümdarın huzurunda bulunan, ona doğruyu söyleyebilen tek kişidir; korunması silahından değil dilinden gelir. 'Soytarı' bu yüzden yalnızca Yolun icra dokusuna değil, Mertebe 0'ın kendi iç mimarisine de uyar."
  - sinir: 1384
    baslik: "Seyircinin Çekilmesi"
    metin: "Yukarıdaki okumayı destekleyen üçüncü bir katman, seyircinin Yol boyunca izlediği seyirdir. Hokkabaz'da alkış istenir. Suretsiz, Sır Kuklabazı ve Garabet Efsuncusu'nun rol ifalarında aynı ifade tekrarlanır: seyirciden geri bildirim almak. Yani ilişki üç Mertebe boyunca kelimesi kelimesine sabit kalır.<br><br>Değişim rol ifasında değil, ayinde olur. Garabet Efsuncusu'nun yükselme ayini, kalabalık bir seyirci önünde yarı tanrı mertebesinde bir yaratığı öldürmeyi şart koşar ve ayinin özü bir Çıpa oluşturmaktır. Burada seyirci artık geri bildirim veren bir taraf değil, çıpayı mümkün kılan bir niceliktir; kanon bunu sayıyla tarif eder: Seyirci Yolu'na mensup bir Aşkın birden çok sıradan seyirciye, o Yolun Melekler Beyi olan Âdem ise binden fazla seyirciye bedeldir. Mertebe 4 bu yüzden bir eşiktir: rol ifası eski ilişkiyi sürdürürken ayin onu çoktan niceliğe çevirmiştir.<br><br>Mazinin Alimi'nde seyirci büsbütün kaybolur. Rol ifasında adı geçmez, ayin ise onun yerine başka bir şey koyar: en az üç yüz yıl gerçeklikten kopmak, tarih hâline gelmek, bu çağa mensup olmamak. Çıpa artık seyirci değil, tarihe bırakılan izin kendisidir. Yani seyirci yalnızca eksilmez, yerini zamana bırakır.<br><br>Mucizekâr'da seyirci geri döner, fakat ilişki açıkça yeniden tanımlanır. Rol ifası bunu doğrudan yasaklayarak söyler: dileği yerine getiren bir ilah gibi değil, kendisi ve başkaları için mucize sergileyen bir kişi gibi davranmak. Tanrılığa iki basamak kala kanon, icracının ilahî duruşu takınmasını adıyla reddeder.<br><br>Esrar Hadimi'nde ise yalnızca engin esrarlara hizmet vardır.<br><br>Yani seyirci basitçe genişlemez; önce niceliğe indirgenir, sonra yerini tarihe bırakır, geri döndüğünde de ilişki bir kademe daha az seyircilik olur. Yol, zirveye çıkmadan önce kendini boşaltır. Ve tam bu boşluğun ardından Soytarı, en geniş seyirciyle görünür: ölümlüler ve ilahlar, aynı anda."
  - sinir: 1384
    baslik: "Kabul edilen kayıp"
    metin: "Bu tercihin bir bedeli var: kanondaki Kandırma salahiyeti ve onun Kör Ahmaklık sembolü, adın kendisinde duyulmaz. Çince orijinalde bu bağ ad düzeyindedir: Soytarı'nın Çincesi 愚者 (Yúzhě) ve içindeki 愚 karakteri, Kör Ahmaklık'ın (盲目痴愚) ve dolayısıyla Azathoth'un Çince unvanının (盲目痴愚之神, 'Kör Ahmaklık Tanrısı') taşıdığı karakterle aynıdır. Bu unvan da Lovecraft'ın 'Blind Idiot God' ifadesinin birebir karşılığıdır. Yani Mertebe 0'a ulaşan bir Soytarı, karşılık gelen salahiyetleri elinde tuttuğu ölçüde bir bakıma Azathoth ile aynı unvanı taşır.<br><br>Bu bağın Türkçede kurulmaması bilinçli bir tercihtir. Bu sözlüğün ölçütü, kaybedilen her nüansı onarmak değil, metnin içinde işleyen bağları korumaktır. 秘 karakteri örneğinde olduğu gibi bir bağ anlatının kendi yapısına, yolların akrabalığına, mertebelerin birbirine bağlanışına, dokunuyorsa onarılır. Azathoth göndermesi ise bu türden değildir. Kör Ahmaklık sembolünün kendisi anlatıda elbette işler; Kandırma salahiyetinin zihin alanındaki karşılığıdır ve hedefin muhakemesini zayıflatıp yanlış hükme varmasını sağlamak gibi doğrudan uygulamaları vardır. İşlemeyen şey, bu sembolün Azathoth'un Çince unvanıyla paylaştığı karakterdir: bu örtüşme anlatı boyunca hiçbir noktada kullanılmaz, karakterlerin bilgisine girmez, salahiyetlerin veya ayinlerin işleyişini etkilemez. Yazarın metnin dışına yaptığı bir selamdır. Bu yüzden ada değil, sembolün kendi çevirisine (Kör Ahmaklık) bırakılmıştır.<br><br>Kanon da bu ikisini zaten ayrı katmanlarda tutar: Ahmaklık ilahın adında değil, salahiyetin sembolündedir. Bu sözlükte de öyle dağıtıldı: ad Soytarı, salahiyet Kandırma, sembol Kör Ahmaklık."
  bolum_siniri: 7
  kaynak: metin
  mudahale: ceviri
  denetim: tamam
  ilk_gecis: 7

