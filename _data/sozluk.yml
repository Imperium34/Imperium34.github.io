      cevirmen_notu: "'Mentor' bu sözlükte sistematik olarak 'Mürşid' olarak sabitlenmiştir (bkz. Hile Mürşidi notu), ancak bu girdide bilinçli olarak istisna yapılmıştır. O kuralın gerekçesi, sıcak/saygın bir kelimeyi karanlık veya ahlaki açıdan belirsiz bir Mertebeyle eşleştirerek kasıtlı bir gerilim yaratmaktı. Güneş Yolu'nda ise böyle bir gerilim kurulacak zemin yoktur: bu Yol doğrudan doğruluk, dürüstlük ve saflığı temsil eder, kanonda karanlık bir okumaya açık değildir. 'Mürşid' kelimesini burada da kullanmak, sözlüğün genelinde inşa edilen sıcak-kelime/karanlık-mertebe ilkesini bozar; okuyucu, düzenli olarak karşılaştığı bu örüntüden yola çıkarak Güneş Yolu'na da olmayan bir ahlaki belirsizlik yükleyebilir. Bu yüzden nötr ve saygın ama 'gerilimsiz' bir karşılık olan 'Üstad' tercih edilmiştir: rehberlik ilişkisini korur, ama tasavvufi ağırlığı ve ondan doğan çift anlamlılığı taşımaz."
