    - seviye: 6
      isim: "Nüve Teskincisi (Soul Assurer)"
      cevirmen_notu: "Başlangıçta İngilizce 'Soul Assurer' çevirisinin yönlendirmesiyle 'Ruh Kefili' kullanılmıştı. Ancak bu karşılık hem 'Assurer'ın 'kefil' üzerinden yorumlanması hem de 'Soul'un doğrudan 'ruh' olarak aktarılması nedeniyle Çince adın anlam yapısını yeterince yansıtmıyordu. Çince 安魂师 (Ānhúnshī) incelendiğinde ise burada iki ayrı unsur bulunduğu görülür: 魂 (hún) ve 安 (ān). 'Ān' yatıştırmak, huzura erdirmek ve teskin etmek anlamına gelir; 安魂 bütünüyle ise ruhu huzura erdirmek, özellikle ölünün ruhunu sakinleştirmek anlamında kullanılır. Bu nedenle 'Assurer' için 'Kefil' yerine 'Teskinci' tercih edildi.<br><br>Aynı zamanda bu mertebenin adındaki 魂 (hún) ile başka mertebelerde kullanılan 灵 (líng) arasında sözlük genelinde terminolojik bir ayrım korunmuştur. 魂 için 'Nüve', 灵 için ise 'Ruh' kullanılmaktadır. Böylece Uykusuz Yolu'nun Mertebe 6'sı 'Nüve Teskincisi' adını alırken, aynı Yolun Mertebe 5'inde bulunan 灵巫 (líng wū) 'Ruh Efsuncusu' olarak kalır. 'Nüve' burada 魂'un sözlük anlamının birebir karşılığı olarak değil, ruhsal varlığın veya metafizik özün teknik bir Türkçe karşılığı olarak kullanılır.<br><br>'Nüve Teskincisi' böylece hem 安魂'daki temel eylemi hem de bu eylemin nesnesi olan 魂'u ayrı ayrı görünür kılar. Ayrıca 'Teskin' tercihi, mertebenin öfkeli ruhları ve zihinsel yozlaşmayı şiir ve ninnilerle yatıştıran temel işleviyle doğrudan örtüşür ve Ebedi Gece Tanrıçası'nın tazim isminde yer alan 'Sükûnet' otoritesiyle kavramsal bir bağ kurar.<br><br>'Can' anlam bakımından 魂'a yakın görünse de tercih edilmedi: Türkçede 'can' yaşayan varlığa aittir, ölenin canı olmaz. Bu Mertebenin Requiem yetisi ise ruhları, hayaletleri ve ölümsüzleri de yatıştırır; yani 魂 burada hem canlıda hem ölüde bulunan ortak özü adlandırır. 'Nüve' bu iki durumu birden kapsayabildiği ve 灵 için ayrılan 'Ruh'tan net biçimde ayrıştığı için tercih edilmiştir."
      bolum_siniri: 402
      metinde: true
      kaynak: metin
      ilk_gecis: 402
    - seviye: 5
      isim: "Ruh Efsuncusu (Spirit Warlock)"
      sistem_kural: [buyucu_efsuncu_sahir, bag_onarimi]
      cevirmen_notu: "'Efsuncu' kuralının genel gerekçesi için bkz. Sistem Kuralları #1 (Büyücü / Efsuncu / Sahir Sistemi). Kâhin Yolu ile Uykusuz Yolu arasındaki bu Mertebeye özgü bağ, Kâhin ve Çırak yolları arasındaki bağlantının tam aksine yapısal değil, tarihseldir; hatta iki Yol normalde farklı gruplara aittir (Kâhin, Esrarın Efendisi grubunda; Uykusuz, Sermedi Zulmet grubunda). Bu iki grubu birbirine bağlayan şey, İkinci Çağ'ın Kadim Tanrısı Yıkım Şeytan Kurdu Flegrea'nın aynı anda her iki Yolun da Yegâneliğini taşımış olmasıdır.<br><br>Flegrea'nın en küçük oğlu Antigonus, Soytarı Yolu'nun Yegâneliğini miras almış ve serinin başladığı tarihte hâlâ bu Yolu kontrol eden hanedanı kurmuştur; kızkardeşi Gökyüzünün Anası (Philanias) ise Karanlık Yolu'nun Mertebe 2'sine (Sır Hadimi) ulaşmış ve iki kardeş, babalarının ölümünün ardından birlikte Ebedi Gece Ulusu'nu kurup yönetmiştir. Bu Yolun bugünkü Mertebe 0'ı olan Ebedi Gece Tanrıçası (Amanises) ise ayrı bir figürdür: Flegrea'nın astı olan Şeamet Tanrıçası'ydı ve efendisinin düşüşünün ardından onun yerini almıştır. Bağ burada ittifaktan çok çatışmaya döner: Ebedi Gece Tanrıçası'nın Kilisesi, daha sonra Gökyüzünün Anası ile Antigonus'un kurduğu krallığa saldırmış, Gökyüzünün Anası'nı yenilgiye uğratıp mühürlü bir eşyaya dönüştürmüş, Antigonus'u ise aynı olayda hapsetmiştir.<br><br>Bu bağ yalnızca kadim tarihle sınırlı değildir; Klein'ın kendi yükselişinde doğrudan işlemeye devam eder. Mertebe 3 (Mazinin Alimi) tarifi, Ebedi Gece Tanrıçası'na doğrudan bir kurban sunularak elde edilmiştir (Bölüm 1138). Mertebe 1 ve Mertebe 0'ın tarifleri ise Soytarı Kartı'ndan ve bizzat Antigonus'un çıldırmış bedeninden gelir (Bölüm 1268, 1352-1353, 1380). Aslında Antigonus'un bu çöküşünde Ebedi Gece Tanrıçası'nın payı olduğu bilinmektedir. Yani Tanrıça'nın kadim çağda Flegrea'nın mirasçılarını kırışı, yüzyıllar sonra Klein'ın tam da o kırılmış mirastan beslenmesinin zeminini hazırlamıştır. Bağ kopmamış, yalnızca biçim değiştirmiştir. Üç Yol arasındaki ortak kelime, bu yüzden bilinçli bir yankıdır. Yapısal neden başka girdidedir. (bkz. Sır Efsuncusu, Çırak Yolu Mertebe 4)"
