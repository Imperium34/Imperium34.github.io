    - seviye: 0
      isim: "Hâviye (Abyss)"
      cevirmen_notu: "Çince aslı 深渊 (shēnyuān), düz anlamıyla derin uçurumdur; kelime Çincede ahlaki veya dinî bir yük taşımaz. 'Uçurum' veya 'Derinlik' gibi bir karşılık bu yalınlığı verirdi, ancak Mertebenin kanonik içeriğini adın dışında bırakırdı.<br><br>Kanon bu Mertebeyi iki salahiyetin birleşimi üzerine kurar: Yozlaşma ve Arzular. Tanım açıktır: Asılmış Adam her canlının düşme eğilimini temsil ediyorsa, Hâviye içine düşen herkesi kaçınılmaz olarak alçalmaya sürükleyen ortamdır; yalnızca tereddiyi kışkırtmakla kalmaz, onu yaratır. Dahası bu ortam dışarıda değil içeridedir: 'Kalbin Hâviyesi' sembolü, uçurumun herkesin içinde zaten bulunduğunu söyler, Habis Tohum'un her canlının içinden geçebilmesinin sebebi de budur.<br><br>'Hâviye' bu yapıyı tek kökte taşır. Kelime هوى kökünden gelir ve bu kök hem düşmek, uçuruma yuvarlanmak hem de arzu, heva, insanı aşağı çeken meyil anlamındadır. Yani Mertebenin iki salahiyeti (düşüş ve arzu) Türkçede adın kendi kökünde birleşir. 深渊 yalnızca mekânı adlandırırken 'Hâviye' hem mekânı hem de oraya sürükleyen kuvveti adlandırır.<br><br>Kelimenin Kuran'daki kullanımı da aynı kökten gelir: Hâviye orada cehennemin bir tabakasının adıdır ve adlandırma tam olarak bu düşme fiiline dayanır. Türk okur için ilk çağrışım muhtemelen budur, ancak bu bir yan etki değil kazanç sayılmalıdır: Mertebenin yükselme ayini bir kıtayı Hâviye'ye dönüştürmektir ve kanonik tanımı 'Hâviye benim, ben Hâviyeyim'dir. Yani ad hem bir mekânı hem o mekâna dönüşen varlığı adlandırır; cehennem çağrışımı Mertebenin yaptığı işin kendisidir.<br><br>Kökün ikinci bir getirisi vardır. Yolun Mertebe 8'i 'Düşmüş Melek'tir ve Türkçede aynı hareketi taşır: Yol bir düşüşle başlar, Mertebe 0'da düşüşün kendisi hâline gelir. Çince adlarda (折翼 ve 深渊) böyle bir ortaklık yoktur; bu yankı Türkçenin kendi kelime köklerinden doğar ve kaynağa dair bir iddia taşımaz."
      bolum_siniri: 1409
