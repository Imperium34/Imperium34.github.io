    - seviye: 0
      isim: "Error / Bug (Error / Bug)"
      cevirmen_notu: "Kaynak metinde 'Error' İngilizce olarak, 'Bug' ise açıkça 'bilinmeyen kökenli, yabancı bir kelime' olarak tanıtılır. Bu ayrım karakterlerin kendisi tarafından da fark edilir. Bu yüzden 'Bug' Türkçeye çevrilmedi ('Kusur' reddedildi): kelimenin yabancı ve teknik kökeni olay örgüsünde doğrudan işlevseldir (yalnızca Dünya kökenli birinin tanıyabileceği bir yazılım terimidir ve bu tanınırlık ilgili bölümde bir karakterin kimliğini sınayan bir ipucu olarak kullanılır). Kelimeyi Türkçeleştirmek bu işlevi söndürürdü. İki kelimenin de olduğu gibi bırakılması, kaynağın kendi yabancılaştırma jestini korumak içindir."
