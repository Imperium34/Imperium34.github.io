    - seviye: 5
      isim: "Galip (Winner)"
      bolum_siniri: 237
      metinde: true
      kaynak: metin
    - seviye: 4
      isim: "Kemtalih Sahiri (Misfortune Mage)"
      cevirmen_notu: "Çince orijinali 厄运法师 (Èyùn fǎshī)'dir. Karanlık (Uykusuz) yolunun 1. Mertebesi olan Şeamet Süvarisi (厄难骑士 - Ènàn qíshì) ile aynı 'È' (厄 - felaket/keder) ön ekini paylaşsa da, kökleri tamamen farklıdır. Karanlık yolu 'nàn' (难 - yıkım/kıyamet) kökünü kullanırken, Canavar yolu kendi sistematiğine sadık kalarak 'Yùn' (运 - talih/kader) kökünü kullanır. 'Talih' kökünü koruyup kelimenin mistik ve tekinsiz ağırlığını artırmak için, 'kötü/şer' anlamındaki Farsça 'kem' ön ekiyle kurulan 'Kemtalih' tercih edilmiştir. 'Sahir' seçiminin genel gerekçesi için bkz. Sistem Kuralları #1."
      sistem_kural: [buyucu_efsuncu_sahir]
      bolum_siniri: 1227
      metinde: true
      kaynak: metin
      ilk_gecis: 1227
    - seviye: 3
      isim: "Fitne Arıtan (Chaos Walker)"
      sistem_kural: [fitne_fesat_mufsit]
      cevirmen_notu: "Kanon çeviri notuna göre Çince orijinalinde 'Chaoswalker' (混乱行者) 混乱/hǔnluàn (Disorder) karakterlerini kullanır, 混沌/hùndùn (İlksel Hercümercin, yaratılış mitlerinde kullanılan ayrı bir otorite) değil. Bu yüzden 'Fitne' (Fitne Mürşidi ile aynı otoriteyi paylaşarak) burada doğru ve tutarlı seçimdir.<br><br>'Arıtan' ise bilinçli olarak literal 'yürüyen/gezen' yerine tercih edildi: Mertebenin yeteneklerinin üçte ikisi (Fate Keeper, fitneli/deli kaderi ayırt edip mühürleme; Spiritual Baptism, ruhu bir vaftiz gibi durultup 'başlangıçtaki gibi' temiz ve istikrarlı hale getirme) doğrudan 'arıtma/temizleme' imgesi üzerine kuruludur. İroni bilinçlidir: bu 'arıtıcı', yalnızca üçüncü yeteneğinde (Disorder otoritesi) tam tersini yapar, düşmanının kaderini ve ruhunu bizzat fitneye ve çılgınlığa sürükleyebilir. Yani 'temizleyen' kişi, gerektiğinde bizzat kirleten kişidir. Bu, insanların 'iyi' görünen bir unvanın kötücül bir Mertebeye verilmesi tercihimin (bkz. Müjdeci, Meczup) bir başka örneğidir. Fitne/Fesat/Müfsit ayrımı için bkz. Sistem Kuralları #5."
      bolum_siniri: 1227
      metinde: true
      kaynak: metin
      ilk_gecis: 1227
    - seviye: 2
      isim: "Münadi (Soothsayer)"
      cevirmen_notu: "'Kâhin' yerine 'Münadi' bilinçli tercih edildi. Kaynak: Kader Çarkı Yolu'nun Soothsayer Mertebesi (S2) yeteneği pasif kehanet değil, aktif bir kehanetin gerçekliğe dönüşme olasılığını yükseltmesidir (bkz. Lumian Lee örneği). Yani sözleri edilgen bir öngörü değil neredeyse performatif bir bildirimdir. Bu, 'gizli işaretleri yorumlayan' Kâhin'den çok, 'yetkiyle ileten' Münadi tanımına daha yakındır."
      bolum_siniri: 237
      metinde: true
      kaynak: metin
      ilk_gecis: 68
    - seviye: 1
      isim: "Cıva Yılanı (Snake of Mercury)"
      cevirmen_notu: "Çince aslı 水银之蛇 (Shuǐyín zhī shé) ve 水银, Çincede cıvanın gündelik adıdır. Kaynak metinde bu ad sıradan ve şeffaftır; okur için aranacak bir şey içermez.<br><br>Bu Mertebe için önce 'Merkür Yılanı' kullanılmıştı. İngilizce 'Mercury' hem gezegeni hem madeni karşıladığı için simyevî bir katman vaat ediyordu; ancak Çince ad bu ikiliği taşımaz, yalnızca madeni adlandırır. Ardından 'Zîbak Yılanı' denendi; gerekçe, 'cıva' kelimesinin Türkçede görece geç yerleşmiş olması ve klasik dağarcığa ait bir karşılığın Yolun kaydına daha iyi oturacağı düşüncesiydi.<br><br>Her ikisinden de vazgeçildi. 'Zîbak' bu sözlüğün arkaik kelime ölçütünü karşılamaz: Tufeyli veya Zulmani gibi örneklerde eski kelime, modern karşılığının taşımadığı bir anlamı geri getirdiği için tercih edilir. 'Zîbak' ise 'cıva' ile tam olarak aynı şeyi söyler, yalnızca daha az okunur. Kaynakta nötr ve şeffaf olan bir adı Türkçede gizemli kılmak, çevirinin metne eklediği bir ağırlık olurdu.<br><br>Dahası 'Cıva' Mertebenin mitsel biçimiyle doğrudan konuşur: bu biçim, yüzeyi birbirine bağlı çarklarla ve sürekli değişen desenlerle kaplı, pulsuz devasa bir yılandır. Akışkan, biçim tutmayan, ele geçmeyen bir maden bu imgeyi anında verir; okunmayan bir kelime veremez."
      bolgesel:
        kultur: "Alternatif İsim"
        isim: "Kader Yılanı (Snake of Fate)"
      bolum_siniri: 237
