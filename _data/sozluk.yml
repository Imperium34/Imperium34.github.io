- terim: "Arzuların Ana Şeceresi"
  ingilizce: "Mother Tree of Desire"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Arzuların Ana Şeceresi (Mother Tree of Desire)"
  aciklama: "Arzuların Ana Şeceresi,<br>Şeytanların Pederi,<br>Garibelerin Hükümdarı,<br>Lanetlerin Menbaı,<br>Mütemadi Bedzeban,<br>Şirazesini Yitirmiş İlah."
  cevirmen_notu: "İngilizce 'Heartless God' doğrudan alınmamıştır; bu ifade Çince orijinali 失心之神 (Shīxīn zhī shén)'i yanlış yorumlamaktadır. '失' (shī) 'kaybetmek/yitirmek' anlamına gelirken, '心' (xīn) hem 'kalp' hem 'zihin/akıl' anlamını taşır. Dolayısıyla 失心, doğuştan duygudan yoksun olmayı değil, bir zamanlar sahip olunan bir bütünlüğün SONRADAN kaybedilmesini anlatır. 'Heartless' bu varlığı özünde soğuk ve duygusuz bir tanrı olarak sunarken, kaynak metin onu bir zamanlar bütün olan ve sonradan çözülmüş bir varlık olarak tarif eder.<br><br>Bu ayrım, sözlükteki 'Şirazesini Yitirmek' girdisiyle doğrudan örtüşür: o girdide tarif edilen şey de tam olarak budur, gücün, hafızanın ve bedenin yerinde durmaya devam etmesine rağmen, onları bir arada tutan şeyin kaybolmasıdır. Arzuların Ana Şeceresi'nin 失心之神 unvanı, bu evrende her Aşkın'ın nihai kâbusu olan bu akıbetin, Kâinatın en kadim varlıklarından birinin de başına geldiğini ima eder. Bu yüzden 'Şirazesini Yitirmiş İlah' tercih edilmiştir: yalnızca 失心'in doğru anlamını karşılamakla kalmaz, aynı zamanda sözlüğün en küçük ölçekli korkusunu (bir Mertebe 9'un şirazeden çıkma korkusu) en büyük ölçekli örneğine (bir Yüce Kadim'in başına gelen aynı akıbet) bağlayan bilinçli bir terminolojik köprü kurar."
  bolum_siniri: 1271
  kaynak: metin
  mudahale: ceviri
  denetim: tamam
  ilk_gecis: 624

