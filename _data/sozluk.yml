      cevirmen_notu: "Başlangıçta İngilizce 'Marionettist' karşılığı olarak 'Kukla Üstadı' kullanılmıştı, ancak dizgesel tutarlılık adına 'Sır Kuklabazı' olarak revize edildi. Bunun sebebi, İngilizce çevirinin metindeki devasa bir yapısal iskeleti tamamen yok etmesidir. Çince orijinalde bu mertebe 秘偶大师 (Mì'ǒu dàshī) şeklindedir ve ilk karakter olan 'Mì' (秘) doğrudan 'Sır/Gizem' anlamına gelir. Bu kelimenin eklenmesi metindeki iki temel kanonik bağı onarır.<br><br>Birincisi yatay bağdır: Çırak Yolu'nun 4. Mertebesi olan Sır Efsuncusu (秘法师 - Mì fǎshī) ile birebir paylaşılan 'Mì' kökü, İngilizcede silinmiş olan bu iki yol arasındaki yapısal akrabalığı kelime düzeyinde yeniden kurar.<br><br>İkincisi ve asıl önemlisi ise dikey bağdır: Soytarı yolunda bir Aşkın yarı tanrılığa adım atarken 5. Mertebeden 4. Mertebeye tırmanır. 5. Mertebe 'Mì' (秘 - Sır), 4. Mertebe ise 'Garabet Efsuncusu'ndaki 'Guǐ' (诡 - Garabet/Tuhaflık) karakterini taşır. Bu iki karakterin birleşimi olan 'Guǐmì' (诡秘), romanın ve Yüce Kadim'in asıl adı olan 'Esrar'ın (Mysteries) ta kendisidir. Yani kanon, Yüce Kadim'in DNA'sını kelimenin tam anlamıyla beşeriyetten ilahiyatın ilk adımlarına geçişin yaşandığı bu iki mertebeye paylaştırmıştır. İngilizce çeviri ('Marionettist' ve 'Bizarro Sorcerer') bu inşayı körleştirir. Türkçede ise Mertebe 5'e 'Sır' kökünün yerleştirilmesi, Aşkın'ın Mertebe 1 (Esrar Hadimi) ve ötesine (Esrarın Hükümdarı) ulaştığında tekil olan 'Sır'dan çoğul/mutlak olan 'Esrar'a geçişini birbirine bağlar."
