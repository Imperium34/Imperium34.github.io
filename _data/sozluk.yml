    - seviye: 5
      isim: "Berzah Bekçisi (Gate Keeper)"
      cevirmen_notu: "'Gate Keeper'ın doğrudan karşılığı olan 'Kapı Bekçisi' ilk bakışta doğal görünür ve Çince orijinal 看门人 (kān ménrén) kelimenin tam anlamıyla 'kapı/giriş bekçisi' veya 'nöbetçi' anlamına geldiği için bu çeviriyi destekler. Ancak bu Mertebe'nin özellikleri ve güçleri düşünüldüğünde buradaki 'kapı'nın sıradan bir fiziksel kapı olarak değil, yaşam ile ölüm arasındaki sınırın bekçiliği olarak yorumlanması daha doğru olur. Bu nedenle 'Berzah' tercih edildi: İslamî gelenekte berzah, ölüm ile diriliş arasındaki ara âlem ve yaşayanlarla ölüleri birbirinden ayıran sınırdır. Mertebenin ruhlar, ölüler ve ruhlar dünyasıyla kurduğu ilişki bu kavramı sıradan bir 'kapı'dan çok daha isabetli kılar. 'Bekçi' ise mertebenin temel işlevini, sınırı koruma ve geçişi denetleme fikrini doğrudan muhafaza eder. Böylece 'Berzah Bekçisi', kanonik 'Gate Keeper'ı kelimesi kelimesine değil, bu Mertebenin ölüm ile ruhlar arasındaki eşik niteliğini esas alarak karşılar."
      bolum_siniri: 19
      metinde: true
