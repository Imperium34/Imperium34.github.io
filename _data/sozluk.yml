    - seviye: 4
      isim: "Tufeyli (Parasite)"
      bolum_siniri: 633
      metinde: true
      kaynak: metin
    - seviye: 3
      isim: "Hile Mürşidi (Mentor of Deceit)"
      cevirmen_notu: "'Mentor' karşılığı bu sözlükte her Mertebede sistematik olarak 'Mürşid' olarak sabitlenmiştir. Bu, yalnızca bu Mertebeye özgü bir tercih değil, genel bir kuraldır. 'Mürşid' Türkçede, özellikle tasavvuf bağlamında, gerçek bir saygınlık taşır: doğru yola götüren, kişiyi dönüştüren manevi rehber anlamına gelir. Bunu 'Hile' (aldatma, düzenbazlık) ile birleştirmek kasıtlı bir gerilim yaratır: sıcak ve saygın kelime soğuk ve karanlık olanı meşrulaştırıyor da olabilir, karanlık kelime saygın olanı kirletiyor da olabilir. İkisi de aynı anda doğru ve eksik kalır. Sıcak ve karanlık kelimelerin bilinçli olarak yan yana kullanılması bu sözlükte genel bir ilkedir, tek bir Mertebeye özgü değildir. Aynı gerekçeyle her 'Mentor' unvanı 'Mürşid' olarak çevrilmiştir; diğer örnekler bu nottan referans alır."
      bolum_siniri: 1162
      metinde: true
      kaynak: metin
      ilk_gecis: 1162
