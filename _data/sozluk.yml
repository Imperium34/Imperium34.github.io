- terim: "Soytarı Efendi"
  ingilizce: "Mr. Fool"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Esrarın Hükümdarı (Lord of the Mysteries)"
  aciklama: "Bu asra mensup olmayan Soytarı,<br>Gri sislerin fevkindeki esrarlı Hükümdar,<br>Talihe hükmeden Sarı ve Siyahın Kralı."
  cevirmen_notu: "Aptal, Ahmak, Budala, Meczup gibi doğrudan karşılıklar yerine 'Soytarı' seçildi. Tarot destesinde 0 numaralı kart bir aptallığı değil; bir başlangıcı, kuralların dışına çıkmayı ve henüz biçimlenmemiş sonsuz potansiyeli imler. 'Aptal' bu kartın hiçbir anlamını taşımaz, yalnızca bir hakaret taşır. Klein özelinde daha da belirleyici bir gerekçe var: bu ismi seçtiği sahnede kendisiyle sürekli dalga geçen, ne olduğunu bilmediği bir dünyada rol yapan biridir. Kendine 'aptal' ya da 'şapşal' demek şaka değil, sövgü olurdu. 'Soytarı' demek ise dürüstlüktür. Aşkınların varlığından bile habersizken ilah rolü oynayan bir adamın kendi durumunu tam olarak tarif etmesidir. Sözcük, dünyayı kurmadan önce karakteri kuruyor."
  cevirmen_notu_ek:
  - sinir: 251
    baslik: "Yolun dokusu"
    metin: "Tercihi destekleyen ikinci bir gözlem var. Kâhin yolunun bilinen ilk mertebeleri (Kâhin, Palyaço, Hokkabaz, Suretsiz, Sır Kuklabazı) istisnasız birer icra mesleğidir. Dahası bu icranın sahnesi kademe kademe büyür: bir kâhin köhne bir çadırda, palyaço sokakta veya sirkte, hokkabaz boş bir sahnede, kukla üstadı ise kuklaları için kurulmuş donanımlı bir sahnede çalışır. Yolun tamamı, güç basamaklarından çok bir icracının kariyeri gibi kurgulanmıştır. Türkçe karşılıklar bu dokuyu korumak üzere seçildi; 'Soytarı' da bu meslekler ailesine aittir, hakaret sözlüğüne değil."
  - sinir: 1384
    baslik: "Yükselişin vardığı yer"
    metin: "Sahne büyüdükçe icracının mevkisi de yükselir. Fakat bu yükseliş düz bir çizgi izlemez. Garabet Efsuncusu'nda seyirci hâlâ vardır (Mertebenin Rol İfasında 'gösteriden geri bildirim al' ibaresi korunur); ritüelin özünde ise seyirci sayıyla tarif edilir: Seyirci yoluna mensup bir aşkın birden çok sıradan seyirciye, o yolun Melekler Kralı olan Âdem ise binlerce seyirciye bedeldir. Bu sayısallaştırma bizce seyircinin artık bir ilişki değil, bir Çıpa malzemesi olarak ele alındığı savunulabilir. Mazinin Alimi'nde Rol İfası'nda seyirciden hiç söz edilmez; geriye kalan tek şey tarihe bırakılan bir izdir. Mucizekâr'da seyirci geri döner ama ilişki açıkça yeniden tanımlanır: 'dileği yerine getiren bir ilah gibi değil, kendisi ve başkaları için mucize sergileyen bir kişi gibi.' Esrar Hadimi'nde Rol İfası yalnızca 'Engin esrarlara hizmet eder' der; seyirciye dair hiçbir ibare yoktur."
  - sinir: 1384
    baslik: "Çıkarılan Sonuç"
    metin: "Buradan çıkardığımız okuma şu: mertebeler büyüdükçe seyirci basitçe genişlemez; önce niceliğe indirgenir, sonra metinden bütünüyle çekilir. Yol, zirveye çıkmadan önce kendini boşaltıyor gibi görünür. Ve tam bu boşluğun ardından Soytarı, kanonda tarif edilen en geniş seyirciyle karşımıza çıkar: 'Ölümlüler ve ilahlar', aynı anda. Bu örüntüyü tarot'taki 0 kartının hem baştan önce hem yolculuğun sonunda durabilmesiyle aynı hareket olarak okuyoruz: icracı sıfıra iner, yeniden belirdiğinde ise yeni bir basamağın en altında değil, basamaklandırmanın dışında görünür. Nitekim Mertebe 0, kanonda da Mertebe 1'den 'bir üstü' değil, kategorik olarak ayrı bir konumdur. Kanonik betimleme bu okumayı destekler: bir yıldızı yok edebilecek kadar güçlü, ona doğrudan bakamayacak kadar kırılgan; sınırsız imtiyaz, sıfır zırh. Bize göre tam olarak bir saray soytarısının, hükümdarın huzurunda bulunan ama hiçbir korumaya sahip olmayan konumu. Tarot tarafındaki 'köke dönüş' bu yorumda bir çağrışımdan öte, mertebenin iç mimarisinde işleyen bir mekanizma olarak öne sürülüyor: yol, sıfırlanarak biter ve sıfırdan başlar."
  - sinir: 1384
    baslik: "Kabul edilen kayıp"
    metin: "Bu tercihin bir bedeli var: kanondaki Kandırma salahiyeti ve onun Kör Ahmaklık sembolü, adın kendisinde duyulmaz. Bu kaybın göründüğünden daha ağır olduğunu belirtmek gerekir: 'Kör Ahmaklık' (盲目痴愚) yalnızca soyut bir 'ahmaklık' temasına değil, doğrudan Azathoth'un kendi Çince unvanına (盲目痴愚之神, 'Kör Ahmak Tanrı') atıfta bulunur. Aslında bu unvan da Lovecraft'ın kendi kaleminden çıkma 'Blind Idiot God' ifadesinin birebir çevirisidir. Yani Soytarı, Mertebe 0'a ulaştığında bir bakıma Azathoth'un kendisiyle aynı unvanı taşır; bu, kanonun bilinçli kurduğu bir metinlerarası gönderme olarak okunabilir. 'Soytarı' adı bu göndermeyi taşımaz, yalnızca sembol düzeyinde (Kör Ahmaklık çevirisinde) hayatta kalır. Buna karşılık kanon da bu ikisini ayrı katmanlarda tutar: Ahmaklık ilahın adında değil, salahiyetin sembolündedir. Bu sözlükte de öyle dağıtıldı: ad Soytarı, salahiyet Kandırma, sembol Kör Ahmaklık."
  bolum_siniri: 5
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

- terim: "Esrarın Hükümdarı"
  ingilizce: "Lord of the Mysteries"
