    - seviye: 8
      isim: "Azmettirici (Instigator)"
      cevirmen_notu: "Çince aslı 教唆者 (Jiàosuō zhě). 教唆 Çincede hukuki bir terimdir; 教唆犯 doğrudan azmettirme suçunu adlandırır. Mertebenin yetisi de bu tanımla birebir örtüşür: insanların içindeki kötücül arzuları tetikleyip onları suça, kavgaya ve şiddete yöneltmek, üstelik fark edilmeden.<br><br>Bu Mertebe için önce 'Fitneci' kullanılmıştı ve iki sebeple değiştirildi. Birincisi, 'Fitne' bu sözlükte 混乱'ya (disorder) tahsislidir ve kaynakta burada o kelime geçmez (bkz. Sistem Kuralları #5). İkincisi ölçek meselesidir: fitne toplumsal bir kargaşayı imler, oysa bu Mertebe tek tek kişileri hedef alır. Birinin içindeki arzuyu bulup onu harekete geçirir. Suikastçı Yolu'nun tamamı bu bireysel ölçekte çalışır; toplumsal çözülme Avukat Yolu'nun alanıdır.<br><br>'Azmettirici' ayrıca Avcı Yolu'nun 挑衅者 (Kışkırtıcı) Mertebesinden de doğru biçimde ayrışır: kışkırtma meydan okuma ve tahrik yoluyla karşı tarafı harekete geçirmektir, azmettirme ise hedefin kendi arzusunu kullanarak ona bir eylem yaptırmaktır. Kaynak iki kelimeyi ayırdığı için Türkçe de ayırır."
      bolum_siniri: 64
      metinde: true
      kaynak: metin
