- terim: "Yıldızlı Gökkubbe"
  ingilizce: "Cosmos"
  kategori: "Temel Kavramlar"
  aciklama: "Dünyanın (ve Astral Alemin) koruyucu bariyerinin ötesindeki uçsuz bucaksız, karanlık ve tekinsiz uzay. Öte İlahların ve Dünya'yı yozlaştırmak isteyen tarif edilemez dehşetlerin asıl mekanıdır."
  cevirmen_notu: "Çince orijinali sadece 'Yıldızlı Gökyüzü'dür; İngilizce 'Cosmos' ise nötr bir terimdir. 'Gökkubbe' bilinçli tercih edildi çünkü kubbe/mimari çağrışımı, bu kavramın aynı zamanda Aslî Yaradan'ın kurduğu bariyer olma işlevini önceden haber veriyor. Gökyüzünün aslında dünyayı çevreleyen bir kabuk olduğunu ima ediyor. Ne Çince ne İngilizce kaynak bunu mimari olarak kodlamıyor."
  cevirmen_notu_sinir: 1203
  cevirmen_notu_ek:
  - sinir: 1203
    baslik: "Gökkubbe ve Kâinat Ayrımı"
    metin: "Çeviride bu kavram perspektife ve bağlama göre ikiye ayrılmıştır. Aslî Yaradan'ın kurduğu bariyer, Dünya'nın sınırı veya Dünya'dan dışarıya (veya içeriye) bakış kastedildiğinde 'Yıldızlı Gökkubbe' (koruyucu kabuk/mimari sınır) kullanılır. Ancak bariyerin ötesindeki sınırsız uzay, derin kozmos ve Öte İlahların saltanat sürdüğü sonsuz boşluk kastedildiğinde (örn. Supernova Dominator'un tazim ismindeki 'Namütenahi Kâinat') 'Kâinat' kelimesi tercih edilir. Bu ikili kullanım, Dünya'yı saran 'kabuk' ile onun dışındaki 'sonsuzluk' arasındaki yapısal farkı Türkçe terminolojide görünür kılar."
  bolum_siniri: 892
  arama_adi: ["yıldızlı gökkubbe", "gökkubbe", "yıldızlar", "kâinat"]
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

