      isim: "Sır Hadimi (Servant of Concealment)"
      sistem_kural: [sir_esrar_gizem_hafi, bag_onarimi]
      cevirmen_notu: "(bkz. Ruh Efsuncusu notu, Flegrea ve Antigonus bağlantısı.) 'Hadim' kökünün burada ve Esrar Hadimi'nde (Kâhin Yolu, Mertebe 1) tekrarı, Çince kaynaktaki bir sözcük yankısını yansıtmaz; 诡秘侍者 ve 隐秘之仆 farklı köklerden gelir. Buna karşılık iki Yol arasındaki bağ iki ayrı düzlemde gerçektir.<br><br>Birincisi tarihseldir ve Ruh Efsuncusu notunda ayrıntılandırılmıştır. İkincisi salahiyet düzeyindedir: her iki Yolun Mertebe 0'ı da Concealment salahiyeti taşır. Karanlık'ta bu salahiyet Cümlenin Vahdeti sembolizmine bağlıdır ve izleri gizlemeyi, kehanet ile sorgulamayı yanıltmayı, hedefleri Gizli bir Dünyaya çekmeyi kapsar. Soytarı'da ise doğrudan İlahi Diyar'ın adını taşır, Esrar Diyarı, Garabet sembolizminin bir tecellisi olarak Concealment barındırır. Yani 'Sır', bu iki Yol arasında yalnızca tarihsel bir yankının değil, paylaşılan bir salahiyetin de kelimesidir.<br><br>Bu, Kural 8'in ihlali değil, iki kuralın kesişimidir: 'Sır' Esrarın Hükümdarı grubuna doğrulanmış bağla bağlı Mertebelerde kullanılabilir (Kural 8) ve salahiyet adları grup ayrımı gözetmez (Kural 10). Bağın hangi düzlemde bulunduğunun önemsiz oluşu için ayrıca bkz. Kural 11."
      bolum_siniri: 766
      metinde: true
      kaynak: metin
      ilk_gecis: 766
    - seviye: 1
      isim: "Şeamet Süvarisi (Knight of Misfortune)"
      cevirmen_notu: "'Şeamet' tercihi öncelikle Ebedi Gece Tanrıçası'nın tazim isminde yer alan 厄难 (ènàn) ile kurulan doğrudan terminolojik bağı korumak içindir: 'Şeamet ve Dehşet Ecesi' ifadesindeki 'Şeamet', bu kavramın sözlükteki yerleşik Türkçe karşılığıdır. Aynı 厄难, Mertebe 1'de 厄难骑士 (Knight of Misfortune) biçiminde yeniden ortaya çıktığı için burada da 'Şeamet' korunmuştur. Böylece Mertebenin taşıdığı uğursuzluk/musibet otoritesi ile Ebedi Gece Tanrıçası'nın aynı kavram üzerindeki hâkimiyeti Türkçe terminolojide görünür kalır. 'Felaket' veya 'Afet' gibi başka karşılıklar anlam bakımından mümkün olsa da bunlar hem farklı Çince terimlerin Türkçe karşılıkları olarak sözlükte zaten işlev görür hem de 厄难 ile Tanrıça'nın tazim ismi arasındaki doğrudan bağı koparır."
