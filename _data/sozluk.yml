# Helak Felaketi (Calamity of Destruction)

- terim: "Avcı Yolu"
  ingilizce: "Hunter Pathway"
  kategori: "Aşkın Yolları"
  yol_grubu: "Helak Felaketi (Calamity of Destruction)"
  cevirmen_notu: "Bu Yolun Mertebe adları, özellikle üst Mertebelerde, Osmanlı askerî ve siyasi dağarcığından beslenir: Akıncı, Harp, Musahhir, Fatih, Hünkar. Bu tercih tesadüfi değildir ve gerekçesi iki katmanlıdır.<br><br>Birinci katman, Yolun kendi yapısından gelir. Yolun yükselme ayinleri baştan sona bir genişleme sürecini tarif eder: kendinden yüksek Mertebeli bir hedefi kuşatıp esir almak; bir orduyu savaşta yenmek; otuz milyondan fazla nüfuslu bir ülkeyi fethedip oradaki bütün varlıklara kendinden korkmayı, itaat etmeyi ve tazim göstermeyi kabul ettirmek; nihayet bir kıtayı baştan başa saran bir harp yürütüp yeterince zafer kazanmak. Bu ilerleyiş, tek tek zaferlerden imparatorluğa doğru giden bir yükselişi anlatır. Bu tür bir yükseliş anlatısı için Türkçenin en zengin ve en canlı dağarcığı Osmanlı askerî-siyasi dilidir.<br><br>İkinci katman ise bu tercihten bağımsızdır ve asıl belirleyici olandır. Yukarıdaki eşleştirme kelimelerin aranacağı yeri belirlemiştir, ancak seçilen her kelime kendi Mertebesinin içeriğiyle ayrıca savunulur ve alternatiflerinden bu içerik sebebiyle üstündür: 'Musahhir', havaya hükmetmenin bir kumandanlık değil bir tahakküm işi oluşundan; 'Hünkar', Mertebenin Fetih ile Kurban salahiyetlerini birleştirmesinden ve 'Rahip'in bir harp ilahına tonal olarak oturmamasından; 'Akıncı', Kural 4'teki şövalye ekonomisinden; 'Fatih', ayinin doğrudan bir ülke fethini şart koşmasından. Yani bu adlardan hiçbiri, yalnızca kayıt bütünlüğü uğruna seçilmiş değildir.<br><br>Bu kayıt tercihi çevirmene aittir, kanona değil; kaynak metin hiçbir tarihsel kültüre işaret etmez, yalnızca fetih ve harp temaları taşır."
  cevirmen_notu_ek:
  - sinir: 200
    baslik: "Kültürel İsimler"
    metin: "Bu yoldaki 'bolgesel' alanı özgün bir eklemedir ve kaynak materyalde karşılığı yoktur. Loen'in resmî Mertebe isimlerinin yanında bölgesel argo/rütbe kullanımı yaratma fikri tamamen bana aittir ve şu an için sadece Avcı Yolu'nda uygulanmıştır. Bunun sebebi Intis'teki Avcı Yoluna ait Aşkın sayısının fazla olması ve kültürleriyle birleşmiş olmasıdır. İleride başka yollara genişletilebilir.<br><br>Not: Bölgesel adlar, resmî Mertebe adlarının birebir çevirileri olmak zorunda değildir; ilgili kültürün kendi askerî, dinî ve toplumsal söz varlığında kullanacağı karşılıkları temsil eder."
  mertebeler:
    - seviye: 9
      isim: "Avcı (Hunter)"
      bolum_siniri: 279
      metinde: true
      kaynak: metin
    - seviye: 8
      isim: "Kışkırtıcı (Provoker)"
      bolgesel:
        kultur: "Intis"
        isim: "Provokatör"
      bolum_siniri: 200
      metinde: true
      kaynak: metin
      ilk_gecis: 200
    - seviye: 7
      isim: "Ateş Müptelası (Pyromaniac)"
      bolgesel:
        kultur: "Intis"
        isim: "Piroman"
      cevirmen_notu: "Çince aslı 纵火家 (Zònghuǒ jiā) düz anlamıyla ateş salan, kundak koyan kişidir; bu haliyle 'Kundakçı' beklenen karşılık gibi görünür. Ancak kanon bu okumayı açıkça reddeder: Ateş Müptelaları kundakçı değildir, ve ilkeleri şudur — ancak kendini yakmayı göze alan başkasını yakabilir.<br><br>Yani mertebeyi tanımlayan şey eylem değil, o eylemi mümkün kılan hâldir. Ateş burada bir araç değil, Aşkının kendisini de kapsayan bir tutkudur; kanon bunların yalnızca maddeyi değil zihni ve toplumu da tutuşturduğunu, alevi öldürmek kadar caydırma, sindirme ve işaret olarak da kullandıklarını belirtir. 'Müptela' (bir şeye tutulmuş, ondan kendini alamayan) bu hâli adlandırır; 'Kundakçı' yalnızca eylemi adlandırır ve kanonun ayırdığı iki şeyi birleştirirdi.<br><br>Intis bölgesel adı 'Piroman' ise aynı hâli klinik bir kayıtla verir ve bölgesel adların resmî/Fransızca örüntüsüne uyar."
      bolum_siniri: 200
      metinde: true
      kaynak: metin
      ilk_gecis: 200
    - seviye: 6
      isim: "Müfsitçi (Conspirer)"
      sistem_kural: [fitne_fesat_mufsit]
      bolgesel:
        kultur: "Intis"
        isim: "Komplocu"
      cevirmen_notu: "'Müfsit' klasik kullanımda zaten faildir; 'müfsitçi' bu yüzden teknik olarak fazladan bir ek taşır. Ek bilinçlidir: Türkçede '-çi' bir işi meslek edinmeyi bildirir ve bu Mertebeyi arızi bir bozguncudan ayırıp komployu iş edinmiş bir icracı olarak konumlandırır. Yolun erken Mertebelerinin tamamı birer icra kimliğidir (Avcı, Kışkırtıcı, Ateş Müptelası, Hasatçı); 'Müfsitçi' bu aileye aittir. Ek ayrıca kelimeyi modern okur için daha okunur kılar. Fitne/Fesat/Müfsit ayrımı için bkz. Sistem Kuralları #5."
      bolum_siniri: 242
      metinde: true
      kaynak: metin
    - seviye: 5
      isim: "Hasatçı (Reaper)"
      bolgesel:
        kultur: "Intis"
        isim: "*Mareşal"
      cevirmen_notu: "Çince aslı 收割者 (Shōugē zhě), biçen/hasat eden kişidir ve kelime Çincede tarımsaldır. İngilizce 'Reaper' ise Grim Reaper çağrışımı üzerinden bir ölüm-orakçısı imgesi taşır; bu imge kaynakta yoktur ve kanonla da çelişir, zira bu Yolun hiçbir Mertebesinde ani ölüm etkisi bulunmaz.<br><br>'Hasatçı' bu yüzden korundu. Mertebenin rol ifası ilkesi imgeyi doğrudan kurar: Biçme, hedefi yok etmek ve kendine bir hasat devşirmektir. Yetenekler de bunu destekler; Zaafiyet Tespiti hedefin zayıf noktasını bulur, Biçme o noktadan can toplar. Yani eylem gelişigüzel bir öldürme değil, olgunlaşmışı seçip toplamadır. 'Orakçı' gibi bir karşılık, metnin sahip olmadığı bir vaadi ada yazardı."
      cevirmen_notu_ek:
      - sinir: 653
        baslik: "Neden Mareşal?"
        metin: "İngilizce terim 'Reaper' (Loen'de 'Hasatçı' olarak korunmuştur) hasat/ruh-biçen imgesini taşır; Intis bölgesel adı 'Mareşal' ise saf askerî bir rütbedir ve bu imgeyi karşılamaz. Tercih iki gerekçeyle yapıldı: (1) Intis bölgesel adları resmî/Fransızca registerdedir (Provokatör, Piroman) ve 'Mareşal' bu örüntüye tam oturur; (2) her ne kadar mertebenin yeteneklerine değilse de, ilerleme ayinine ve özellikle Avcı Yolu'nun genel kumandanlık/komuta temalarına uygundur. Ayin, kişinin kendinden yüksek Mertebeli bir hedefi kuşatıp esir alarak zaferini onlara seyrettirmesini gerektirir; bu, bir kumandanın stratejik zaferini yansıtır. Şimdilik sabittir; daha iyi bir alternatif bulunursa gözden geçirilecektir. (Asteriks bu belirsizliği işaretler.)"
      bolum_siniri: 653
      metinde: true
      kaynak: metin
    - seviye: 4
      isim: "Demirkan Akıncısı (Iron-Blooded Knight)"
      sistem_kural: [sovalye]
      bolgesel:
        kultur: "Intis"
        isim: "Demirkan Şövalyesi"
      bolum_siniri: 484
