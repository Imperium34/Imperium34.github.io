- terim: "Hakiki Hâlık"
  ingilizce: "The True Creator"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Kadir-i Mutlak (God Almighty)"
  aciklama: "Zulmet Perdesi Ardından Hükmeden,<br>Mevcudatın Sanii,<br>Müşfik Peder,<br>Cümle Cürümü Sırtlayan Rab."
  cevirmen_notu: "Bu tazim ismi literal çeviri değildir; kanondaki üç satırdan ikisi korunmuş, bir tanesi bilinçli olarak kullanılmamıştır (bkz. aşağıdaki not). Yerine eklenen 'Müşfik Peder' ve 'Cümle Cürümü Sırtlayan Rab' satırları ise boşluktan icat edilmiş değildir; Fecir Tarikatı'nın hem LOTM hem CoI'deki dağınık ama gerçek ifadelerinin bir sentezidir. 'Cümle Cürümü Sırtlayan Rab', tarikat üyelerinin fiilen ettiği bir duaya ('Praise be to you, who carries the burdens of the world's sins', CoI Bölüm 232) doğrudan yakındır. 'Müşfik Peder' ise tarikatın kayıtlı doktrininden ('the great being who created this world, the father of all living creatures', CoI Bölüm 232) ve paylaşılan ilahilik inancından ('Divinity exists within every living being, and no one is inherently more noble than another', CoI Bölüm 232) damıtılmıştır.<br><br>Gerekçe bir yöntem tercihi olarak kalır: tazim isimleri bir varlığın objektif tarifi değil, ona inananların ağzından okunan ayinsel bir hitaptır; dolayısıyla bir kilisenin kendi ilahını nasıl yücelttiği, o ilahın gerçekte ne olduğundan farklı olabilir ve olmalıdır da. Ancak bu farkın kendisi kanonda gerçekten mevcuttur: tarikatın dışarıdan 'neredeyse tamamı çılgın' olarak tarif edilmesiyle, içeriden kaydedilen bu sıcak ve tutarlı teolojisi (paylaşılan ilahilik, günahı sırtlayan bir baba) arasındaki çelişki icat edilmiş değil, metnin kendisinde durur. Buradaki satırlar bu iç sesi yansıtır; dışarıdan bakışın kaydı ise başka bir girdidedir (bkz. aşağıdaki not).<br><br>(Aşağıdaki not, içerisinde spoiler içerdiğinden sadece LotM'u bitiren kişilerin görebileceği şekilde ayarlanmıştır.)"
  cevirmen_notu_ek:
  - sinir: 1409
    baslik: "Çıkarılan satır nereye gitti"
    metin: "Kullanılmayan kanonik satır, cümle zîhayatın yozlaşmış fıtratına dair olandır ve 'Yarı Kadir-i Mutlak Âdem' girdisinde 'Cümle Zîhayatın Sefil Fıtratı' olarak karşılanmıştır. Ayrım bilinçlidir: Fecir Tarikatı onu 'Müşfik Peder' diye çağırırken, aynı varlığın kendi hakikatini bildiren satır ona tapanların değil, onu tanıyanların kaydında durur. Böylece iki girdi aynı varlığın iki farklı yüzünü taşır. Biri ibadetin, diğeri bilginin dilinde."
  sistem_kural: [esma]
  bolum_siniri: 87
  kaynak: metin
  mudahale: degistirme
  denetim: tamam
  ilk_gecis: 87

