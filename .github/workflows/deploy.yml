name: Deploy Jekyll Site
on:
  repository_dispatch:
    types: [publish_chapters]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send Discord Announcement
        # ONLY run on repository_dispatch triggers (ignores manual workflow_dispatch runs)
        if: github.event.action == 'publish_chapters'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import urllib.request
          import json
          import os
          from datetime import datetime

          webhook_url = os.environ.get('DISCORD_WEBHOOK')
          if not webhook_url:
              exit(0)

          tree = ET.parse('_site/feed/chapters.xml')
          root = tree.getroot()
          ns = {'atom': 'http://www.w3.org/2005/Atom'}

          entries = root.findall('atom:entry', ns)
          if not entries:
              exit(0)

          latest = entries[0]
          published_str = latest.find('atom:published', ns).text
          published_dt = datetime.fromisoformat(published_str)
          today = datetime.now(published_dt.tzinfo).date()

          # Only notify if the newest chapter was published today
          if published_dt.date() != today:
              print('No new chapter published today. Skipping Discord notification.')
              exit(0)

          title = latest.find('atom:title', ns).text.strip()
          title = title.split(' · ')[0].split(' - ')[0]

          link = latest.find('atom:link', ns).attrib['href']

          payload = {
              'content': f'📜 **Yeni Bölüm Yayınlandı!**\n\n**{title}** <1458903249175314493>',
              'embeds': [{
                  'title': title,
                  'url': link,
                  'color': 10754072,
                  'description': f'**{title}** yayında. Keyifli okumalar!',
                  'footer': {'text': 'Esrarın Hükümdarı · Tarot Kulübü'}
              }]
          }
          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
          )
          urllib.request.urlopen(req)
          print('Discord notification sent for:', title)
          "
