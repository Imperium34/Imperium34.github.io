# -----------------------
# SITE IDENTITY
# -----------------------
title: Gizemlerin Efendisi (Esrarın Hükümdarı Edisyon)
description: "Viktorya dönemi gizemi ve kozmik dehşet üzerine atmosferik bir çeviri."
author:
  name: "Cuttlefish That Loves Diving (Çeviri: Imperium)"

# -----------------------
# SITE URL / HOSTING
# -----------------------
url: "https://esrarinhukumdari.com"
baseurl: ""
timezone: Europe/Istanbul

# -----------------------
# COLLECTIONS
# -----------------------
collections:
  chapters:
    output: true
    permalink: /:collection/:name/

# -----------------------
# PLUGINS
# -----------------------
plugins:
  - jekyll-feed

# -----------------------
# MARKDOWN / BUILD SETTINGS
# -----------------------
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false

sass:
  sass_dir: css
  style: expanded

# -----------------------
# EXCLUDES
# -----------------------
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
